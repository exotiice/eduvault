  const fr=document.createElement('iframe');fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.append(fr);const d=fr.contentDocument;d.open();d.write('<!doctype html><html><head><meta charset="utf-8"><title>EduVault</title><style>'+css+'</style></head><body><h1>📌 '+esc(Lg('Aide-mémoire','Cheat sheet','ملخص سريع'))+' · '+esc(A.activeSemester)+'</h1>'+html+'</body></html>');d.close();
  fr.contentWindow.onafterprint=()=>fr.remove();setTimeout(()=>{fr.contentWindow.focus();fr.contentWindow.print()},200);setTimeout(()=>fr.remove(),120000)}

/* ---------- Examen blanc (chrono + correction finale) ---------- */
let MK=null;
function mockCard(){return`<div class="c" style="margin-top:12px"><h4>📝 ${Lg('Examen blanc','Mock exam','امتحان تجريبي')}</h4><small class="mu">${Lg('Chrono global, questions de la banque du module, aucune correction avant la fin.','Global timer, questions from the module bank, no feedback until the end.','مؤقت عام وأسئلة من بنك المادة دون تصحيح قبل النهاية.')}</small><div class="row" style="justify-content:flex-start"><button class="b p" data-a="mock">${Lg('Lancer','Start','ابدأ')}</button></div></div>`}
function mockDlg(){
  if(needMod())return;
  ask(Lg('Examen blanc','Mock exam','امتحان تجريبي'),[{k:'mid',l:Lg('Module','Module','المادة'),t:'select',o:modOpts()},{k:'n',l:Lg('Nombre de questions','Number of questions','عدد الأسئلة'),t:'select',o:[['10','10'],['20','20'],['30','30'],['999',Lg('Toute la banque','Whole bank','كل البنك')]],v:'20'},{k:'min',l:Lg('Durée','Duration','المدة'),t:'select',o:[['10','10 min'],['20','20 min'],['30','30 min'],['45','45 min'],['60','1 h']],v:'30'}],v=>{
    const keep={...qcfg};qcfg.mod=v.mid;qcfg.n=9999;qcfg.mode='qcm';const pool=qPool().filter(q=>q.k==='qcm');Object.assign(qcfg,keep);
    const qs=shuf(pool).slice(0,+v.n);if(qs.length<3)return toast(Lg('Pas assez de questions QCM dans ce module (il en faut au moins 3 : fiches ou quiz IA)','Not enough MCQ in this module (at least 3 needed: cards or AI quiz)','لا توجد أسئلة كافية (3 على الأقل)'),'er');
    MK={mid:v.mid,qs,i:0,ans:[],flag:new Set(),end:Date.now()+(+v.min)*60000,done:false};MK.t=setInterval(mkTick,1000);go('qz')})}
function mkTick(){if(!MK||MK.done){return}const l=MK.end-Date.now(),el=$('mkt');if(el){el.textContent=fmtMS(l);el.classList.toggle('low',l<300000)}if(l<=0)mkFinish()}
function mkView(){const q=MK.qs[MK.i],n=MK.qs.length,l=MK.end-Date.now(),answered=MK.ans.filter(x=>x!=null).length;
  return`<div class="c"><div class="top" style="margin:0"><div><small class="mu">${esc(modName(MK.mid))}</small><h3 style="margin:0">${Lg('Question','Question','سؤال')} ${MK.i+1} / ${n}</h3></div><div class="mkt${l<300000?' low':''}" id="mkt">${fmtMS(l)}</div></div>
  <div class="mkbar"><i style="width:${Math.round(100*answered/n)}%"></i></div><p style="font-size:17px;font-weight:700;margin:14px 0">${esc(q.q)}</p>
  ${q.opts.map((o,i)=>`<button class="opt${MK.ans[MK.i]===o?' on':''}" data-a="mkPick" data-i="${i}">${esc(o)}</button>`).join('')}
  <div class="row"><button class="b" data-a="mkFlag">${MK.flag.has(MK.i)?'🚩':'⚐'} ${Lg('À revoir','Review later','للمراجعة')}</button><button class="b" data-a="mkGo" data-i="-1" ${MK.i?'':'disabled'}>‹</button><button class="b p" data-a="mkGo" data-i="1" ${MK.i<n-1?'':'disabled'}>›</button></div>
  <div class="mkgrid">${MK.qs.map((_,i)=>`<button class="b${i===MK.i?' p':''}${MK.ans[i]!=null?' dn':''}${MK.flag.has(i)?' fl':''}" data-a="mkJump" data-i="${i}" aria-label="${i+1}">${i+1}</button>`).join('')}</div>
  <div class="row"><small class="mu">${answered}/${n} ${Lg('répondues','answered','مجاب')}</small><button class="b" style="color:var(--er)" data-a="mkEnd">${Lg("Terminer l'examen","Finish the exam",'إنهاء الامتحان')}</button></div></div>`}
function mkFinish(){if(!MK||MK.done)return;clearInterval(MK.t);MK.done=true;const n=MK.qs.length;MK.sc=MK.qs.filter((q,i)=>MK.ans[i]===q.right).length;MK.spent=Math.round((Date.now()-(MK.end-(MK.end-Date.now())))/1000);
  A.quizHist.push({d:Date.now(),sc:MK.sc,n,mod:MK.mid});A.quizHist=A.quizHist.slice(-60);logAct('q',n);MK.qs.forEach(q=>logMod(q.moduleId,.5));save();render()}
function mkResult(){const n=MK.qs.length,sc=MK.sc,note=Math.round(sc/n*200)/10,bad=MK.qs.map((q,i)=>({q,a:MK.ans[i]})).filter(o=>o.a!==o.q.right);
  return`<div class="c pm"><h2>${note>=10?'🎉':'📚'} ${note.toFixed(1)}/20</h2><small class="mu">${sc} / ${n} ${Lg('bonnes réponses','correct answers','إجابات صحيحة')} · ${esc(modName(MK.mid))}</small>
  ${bad.length?`<h4 style="margin-top:14px">${Lg('Correction','Correction','التصحيح')} (${bad.length})</h4>${bad.map(o=>`<div class="rs" style="display:block;text-align:start;margin-top:6px"><b>${esc(o.q.q)}</b><small class="bad">${o.a==null?Lg('Sans réponse','No answer','بدون إجابة'):'✗ '+esc(o.a)}</small><small class="okt">✅ ${esc(o.q.right)}</small>${o.q.exp?`<small class="mu">${esc(o.q.exp)}</small>`:''}</div>`).join('')}`:`<p class="okt">${Lg('Aucune erreur 🎉','No mistakes 🎉','لا أخطاء 🎉')}</p>`}
  <div class="row"><button class="b" data-a="mkClose">${tr('Fermer')}</button><button class="b p" data-a="mock">${Lg('Nouvel examen','New exam','امتحان جديد')}</button></div></div>`}
{const _q=R.qz;R.qz=()=>MK?(MK.done?mkResult():mkView()):(QZ?_q():_q()+mockCard())}

Object.assign(act,{
  scRev:mid=>{qcfg.mod=mid;qcfg.n=8;qcfg.mode='qcm';QZ=null;go('qz');qStart(qPool())},
  wkOk:k=>{LS(k,'1');render()},
  agSort:()=>{LS('eduVault_agsort',LS('eduVault_agsort')==='date'?'prio':'date');render()},
  fmOn:()=>fmOn(),photo:()=>photoDlg(),memo:()=>memoDlg(),mock:()=>{if($('dlg').open)$('dlg').close();if(MK){clearInterval(MK.t);MK=null}mockDlg()},
  memoAdd:()=>{const b=$('mk_b').value.trim();if(!b)return toast(Lg('Écris le contenu','Write the content','اكتب المحتوى'),'er');(A.memos[memoMid]=A.memos[memoMid]||[]).push({id:uid('e'),k:$('mk_k').value,t:$('mk_t').value.trim().slice(0,60),b:b.slice(0,1500)});save();memoDlg(memoMid)},
  memoDel:id=>{const l=A.memos[memoMid]||[],i=l.findIndex(e=>e.id===id);if(i<0)return;const e=l.splice(i,1)[0];save();memoDlg(memoMid);toastUndo(Lg('Entrée supprimée','Entry deleted','تم حذف العنصر'),()=>{(A.memos[memoMid]=A.memos[memoMid]||[]).splice(Math.min(i,A.memos[memoMid].length),0,e);save();memoDlg(memoMid)})},
  memoPrint:w=>memoPrint(w),
  mkPick:i=>{MK.ans[MK.i]=MK.qs[MK.i].opts[+i];render()},mkGo:d=>{MK.i=Math.max(0,Math.min(MK.qs.length-1,MK.i+(+d)));render()},mkJump:i=>{MK.i=+i;render()},
  mkFlag:()=>{MK.flag.has(MK.i)?MK.flag.delete(MK.i):MK.flag.add(MK.i);render()},
  mkEnd:()=>{const un=MK.qs.length-MK.ans.filter(x=>x!=null).length;if(confirm(un?Lg(un+' question(s) sans réponse. Terminer ?',un+' unanswered question(s). Finish?',un+' أسئلة بلا إجابة. إنهاء؟'):Lg("Terminer l'examen ?",'Finish the exam?','إنهاء الامتحان؟')))mkFinish()},
  mkClose:()=>{MK=null;render()}
});
smartCards.__v=1;render();
</script>

<script>
/* =====================================================================
   Espace de classe (chat + demandes de ressources) et projets de groupe — Firestore temps réel
   cls/{CODE}/chat, cls/{CODE}/reqs/{id}/r, prj/{CODE}/t
   ===================================================================== */
let csG='',csTab='chat',csReq=null,csUnsubs=[],lastSend=0;
const csClean=()=>{csUnsubs.forEach(u=>{try{u()}catch(e){}});csUnsubs=[]};
const myTag=()=>{const p=prof();return((p?p.a+' ':'')+((p&&p.n)||Lg('Étudiant','Student','طالب'))).slice(0,24)};
const msgId=()=>String(Date.now()).padStart(13,'0')+Math.random().toString(36).slice(2,6);
const linkify=t=>esc(t).replace(/(https:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const FP=()=>firebase.firestore.FieldPath.documentId();
const clsCol=n=>fb.db.collection('cls').doc(csG).collection(n);
const ago=ts=>{const m=Math.floor((Date.now()-ts)/6e4);return m<1?Lg('à l\'instant','just now','الآن'):m<60?m+' min':m<1440?Math.floor(m/60)+' h':Math.floor(m/1440)+' j'};
async function clsSpace(g){
  const gs=myGroups();
  if(!gs.length)return dlgShow(`<h3>💬 ${Lg('Espace de classe','Class space','فضاء القسم')}</h3><p class="mu">${Lg("Rejoins d'abord une classe avec un code : la discussion et les demandes sont propres à chaque classe.","Join a class with a code first: the chat and requests are per class.",'انضم أولا إلى قسم برمز.')}</p><div class="row"><button class="b" data-a="shJoin">${tr('Rejoindre avec un code')}</button></div>${closeBtn()}`);
  if(!(await needFb()))return;
  csG=(g&&shOk(g))?g:(gs.some(x=>x[0]===csG)?csG:gs[0][0]);csReq=null;
  const d=dlgShow(`<h3>💬 ${Lg('Espace de classe','Class space','فضاء القسم')}</h3>
  <label>${Lg('Classe','Class','القسم')}<select onchange="csReq=null;clsSpace(this.value)">${gs.map(([c,n])=>`<option value="${c}"${c===csG?' selected':''}>${esc(n)} (${shFmt(c)})</option>`).join('')}</select></label>
  <div class="seg" style="margin:10px 0"><button class="${csTab==='chat'?'on':''}" data-a="csTab" data-i="chat">💬 ${Lg('Discussion','Chat','نقاش')}</button><button class="${csTab==='req'?'on':''}" data-a="csTab" data-i="req">🆘 ${Lg('Demandes','Requests','طلبات')}</button></div>
  <div id="csb"></div><div class="warn" style="font-size:11px">${Lg("Reste respectueux. Quiconque a le code de classe peut lire cet espace ; les messages inappropriés sont supprimés par l'admin.","Stay respectful. Anyone with the class code can read this space; inappropriate messages are removed by the admin.",'كن محترما. كل من لديه رمز القسم يمكنه قراءة هذا الفضاء.')}</div>${closeBtn()}`);
  csRender()}
let csDocs=[];
function csChatPaint(){const l=$('chl');if(!l)return;const near=l.scrollHeight-l.scrollTop-l.clientHeight<80;
  l.innerHTML=csDocs.map(m=>{const me=m.u===fbUser.uid;return`<div class="msg${me?' me':''}">${avSpan(m.u)}<div class="bub"><small>${esc(avName(m))} · ${ago(m.ts)}${me||ADMIN?` <button class="x-btn" style="width:22px;height:22px;display:inline-grid" data-a="csDel" data-i="chat|${m.id}" aria-label="${tr('Supprimer')}">✕</button>`:''}</small>${linkify(m.m||'')}</div></div>`}).join('')||`<p class="mu e">${Lg('Sois le premier à écrire 👋','Be the first to write 👋','كن أول من يكتب 👋')}</p>`;
  avLoad(csDocs.map(m=>m.u),csChatPaint);
  if(near||!l.dataset.init){l.scrollTop=l.scrollHeight;l.dataset.init=1}}
function csRender(){csClean();const b=$('csb');if(!b)return;
  if(csTab==='chat'){
    b.innerHTML=`<div class="chatbox" id="chl" aria-live="polite"></div><form id="chf" class="row" style="margin:8px 0 0;flex-wrap:nowrap"><input name="m" maxlength="500" autocomplete="off" placeholder="${Lg('Ton message…','Your message…','رسالتك…')}" style="flex:1" aria-label="${Lg('Message','Message','رسالة')}"><button class="b p" aria-label="${Lg('Envoyer','Send','إرسال')}">➤</button></form>`;
    $('chf').onsubmit=async e=>{e.preventDefault();const f=e.target.elements,t=f.m.value.trim();if(!t||Date.now()-lastSend<1200)return;lastSend=Date.now();f.m.value='';
      try{await clsCol('chat').doc(msgId()).set({u:fbUser.uid,p:myTag(),m:t.slice(0,500),ts:Date.now()})}catch(x){toast(shErr(x),'er');f.m.value=t}};
    csUnsubs.push(clsCol('chat').orderBy(FP(),'desc').limit(60).onSnapshot(sn=>{csDocs=sn.docs.map(x=>({id:x.id,...x.data()})).reverse();csChatPaint()},e=>toast(shErr(e),'er')))}
  else if(!csReq){
    b.innerHTML=`<div class="row" style="justify-content:flex-start;margin:0 0 8px"><button class="b p" data-a="csNew">+ ${Lg('Nouvelle demande','New request','طلب جديد')}</button></div><div id="rql"></div>`;
    csUnsubs.push(clsCol('reqs').orderBy(FP(),'desc').limit(40).onSnapshot(sn=>{const l=$('rql');if(!l)return;
      l.innerHTML=sn.docs.length?`<div class="sg">${sn.docs.map(x=>({id:x.id,...x.data()})).map(r=>`<button class="nr" data-a="csOpen" data-i="${r.id}"><span class="ti" style="--c1:${r.ok?'#10b981':'#f59e0b'};--c2:${r.ok?'#14b8a6':'#ef4444'}">${r.ok?'✅':'🆘'}</span><span><b>${esc(r.t)}</b><small>${esc(r.md||'')}${r.md?' · ':''}${esc(r.p||'')} · ${ago(r.ts)}</small></span><i class="chev"></i></button>`).join('')}</div>`:`<p class="mu e">${Lg("Aucune demande. Tu as raté un cours ? Demande les notes à ta classe.","No request. Missed a class? Ask your classmates for the notes.",'لا توجد طلبات. فاتك درس؟ اطلب الملاحظات من قسمك.')}</p>`},e=>toast(shErr(e),'er')))}
  else{
    b.innerHTML=`<div id="rqh"></div><div class="chatbox" id="rpl"></div><form id="rpf" class="row" style="margin:8px 0 0;flex-wrap:nowrap"><input name="m" maxlength="400" autocomplete="off" placeholder="${Lg('Ta réponse ou un lien https://…','Your reply or an https:// link…','ردك أو رابط https://…')}" style="flex:1"><button class="b p" aria-label="${Lg('Envoyer','Send','إرسال')}">➤</button></form><div class="row" style="justify-content:flex-start"><button class="b" data-a="csBack">‹ ${Lg('Retour','Back','رجوع')}</button></div>`;
    const rq=clsCol('reqs').doc(csReq);
    csUnsubs.push(rq.onSnapshot?rq.onSnapshot(s0=>{const h=$('rqh');if(!h)return;if(!s0.exists){csReq=null;csRender();return}const r=s0.data(),mine=r.u===fbUser.uid;
      h.innerHTML=`<div class="rs" style="display:block"><b>${r.ok?'✅ ':'🆘 '}${esc(r.t)}</b><small class="mu">${esc(r.md||'')} · ${esc(r.p||'')} · ${ago(r.ts)}</small>${r.d?`<div style="margin-top:6px">${linkify(r.d)}</div>`:''}${mine||ADMIN?`<div class="row" style="justify-content:flex-start;margin:8px 0 0">${mine&&!r.ok?`<button class="b" data-a="csDone">✅ ${Lg('Résolu','Solved','تم الحل')}</button>`:''}<button class="b" style="color:var(--er)" data-a="csDel" data-i="reqs|${csReq}">${tr('Supprimer')}</button></div>`:''}</div>`}):()=>{});
    csUnsubs.push(rq.collection('r').orderBy(FP()).limit(100).onSnapshot(sn=>{const l=$('rpl');if(!l)return;
      l.innerHTML=sn.docs.map(x=>({id:x.id,...x.data()})).map(m=>{const me=m.u===fbUser.uid;return`<div class="msg${me?' me':''}"><div class="bub"><small>${esc(m.p||'')} · ${ago(m.ts)}${me||ADMIN?` <button class="x-btn" style="width:22px;height:22px;display:inline-grid" data-a="csDel" data-i="r|${m.id}" aria-label="${tr('Supprimer')}">✕</button>`:''}</small>${linkify(m.m||'')}</div></div>`}).join('')||`<p class="mu e">${Lg('Pas encore de réponse','No reply yet','لا ردود بعد')}</p>`;l.scrollTop=l.scrollHeight},e=>toast(shErr(e),'er')));
    $('rpf').onsubmit=async e=>{e.preventDefault();const f=e.target.elements,t=f.m.value.trim();if(!t||Date.now()-lastSend<1200)return;lastSend=Date.now();f.m.value='';
      try{await clsCol('reqs').doc(csReq).collection('r').doc(msgId()).set({u:fbUser.uid,p:myTag(),m:t.slice(0,400),ts:Date.now()})}catch(x){toast(shErr(x),'er');f.m.value=t}}}}
/* ---------- projets de groupe ---------- */
let pjC='',pjFilter='all';
const pjList=()=>A.settings.projects||[];
function projSpace(){
  csClean();
  const l=pjList();
  dlgShow(`<h3>🤝 ${Lg('Projets de groupe','Group projects','مشاريع جماعية')}</h3><p class="mu">${Lg("Qui fait quoi, avec échéances. Crée un projet, partage le code à ton groupe : chacun voit et coche ses tâches en temps réel.","Who does what, with deadlines. Create a project and share the code with your group: everyone sees and ticks their tasks in real time.",'من يفعل ماذا مع المواعيد. أنشئ مشروعا وشارك الرمز مع مجموعتك.')}</p>
  <div class="row" style="justify-content:flex-start"><button class="b p" data-a="pjNew">+ ${Lg('Créer','Create','إنشاء')}</button><button class="b" data-a="pjJoin">🔑 ${Lg('Rejoindre avec un code','Join with a code','انضمام برمز')}</button></div>
  ${l.length?`<div class="sg" style="margin-top:10px">${l.map(x=>`<button class="nr" data-a="pjOpen" data-i="${x.c}"><span class="ti" style="--c1:#6366f1;--c2:#06b6d4">🤝</span><span><b>${esc(x.n)}</b><small>${shFmt(x.c)}</small></span><i class="chev"></i></button>`).join('')}</div>`:`<p class="mu e">${Lg('Aucun projet pour le moment','No project yet','لا مشاريع بعد')}</p>`}${closeBtn()}`)}
async function pjOpen(c){
  if(!(await needFb()))return;pjC=c;csClean();
  const ref=fb.db.collection('prj').doc(c);dlgShow(`<div id="pjh"></div><div id="pjb"></div>`);
  const meta=(A.settings.projects||[]).find(x=>x.c===c)||{n:c};
  let tasks=[];
  const paint=()=>{const b=$('pjb'),h=$('pjh');if(!b||!h)return;const done=tasks.filter(t=>t.done).length,pc=tasks.length?Math.round(100*done/tasks.length):0,me=myTag(),shown=tasks.filter(t=>pjFilter==='all'||t.who===me).sort((a,b)=>(a.done-b.done)||String(a.due||'9').localeCompare(String(b.due||'9')));
    h.innerHTML=`<h3>🤝 ${esc(meta.n)}</h3><div class="row" style="justify-content:space-between;margin:0"><span class="chip">${shFmt(c)}</span><button class="b" data-a="shCopy" data-i="${c}|c">${tr('Copier le code')}</button></div><div class="mkbar"><i style="width:${pc}%"></i></div><small class="mu">${done}/${tasks.length} ${Lg('terminées','done','منجزة')} · ${pc}%</small>`;
    b.innerHTML=`<div class="seg" style="margin:10px 0"><button class="${pjFilter==='all'?'on':''}" data-a="pjFlt" data-i="all">${Lg('Tout','All','الكل')}</button><button class="${pjFilter==='me'?'on':''}" data-a="pjFlt" data-i="me">${Lg('Mes tâches','My tasks','مهامي')}</button></div>
    ${shown.length?`<div class="sg">${shown.map(t=>{const late=!t.done&&t.due&&t.due<iso(new Date());return`<div class="sr" style="gap:10px"><input type="checkbox" ${t.done?'checked':''} data-a="pjDone" data-i="${t.id}" aria-label="${Lg('Terminée','Done','منجزة')}" style="order:0;margin:0!important"><span style="flex:1;min-width:0;${t.done?'opacity:.55;text-decoration:line-through':''}"><b>${esc(t.t)}</b><small class="mu" style="display:block;font-weight:500">👤 ${esc(t.who||'—')}${t.due?' · <span style="'+(late?'color:var(--er);font-weight:800':'')+'">📅 '+esc(t.due)+'</span>':''}</small></span><button class="x-btn" data-a="pjDel" data-i="${t.id}" aria-label="${tr('Supprimer')}">✕</button></div>`}).join('')}</div>`:`<p class="mu e">${Lg('Aucune tâche','No task','لا مهام')}</p>`}
    <form id="pjf" style="margin-top:10px"><input name="t" maxlength="100" required placeholder="${Lg('Nouvelle tâche…','New task…','مهمة جديدة…')}"><div class="row" style="margin:6px 0 0;flex-wrap:nowrap"><input name="w" maxlength="24" value="${esc(me)}" aria-label="${Lg('Responsable','Assignee','المسؤول')}" style="flex:1"><input name="d" type="date" aria-label="${Lg('Échéance','Deadline','الموعد')}" style="flex:1"><button class="b p" aria-label="${Lg('Ajouter','Add','إضافة')}">+</button></div></form>

    $('pjf').onsubmit=async e=>{e.preventDefault();const f=e.target.elements,t=f.t.value.trim();if(!t)return;const id=msgId();f.t.value='';
      try{await ref.collection('t').doc(id).set({t:t.slice(0,100),who:f.w.value.trim().slice(0,24)||me,due:f.d.value||'',done:false,u:fbUser.uid,ts:Date.now()})}catch(x){toast(shErr(x),'er')}}};
  try{const s0=await ref.get();if(!s0.exists){toast(Lg('Projet introuvable','Project not found','المشروع غير موجود'),'er');return projSpace()}meta.n=s0.data().n}catch(e){toast(shErr(e),'er');return projSpace()}
  csUnsubs.push(ref.collection('t').limit(200).onSnapshot(sn=>{tasks=sn.docs.map(x=>({id:x.id,...x.data()}));paint()},e=>toast(shErr(e),'er')));paint()}
$('dlg').addEventListener('close',()=>{if(!$('dlg').open)csClean()});
/* Toucher en dehors d'une fenetre la ferme (sauf si elle est obligatoire ou si un texte a ete saisi). */
(function(){
  const TXT='textarea,input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=color]):not([type=button])';
  ['dlg','vdlg'].forEach(id=>{
    const d=document.getElementById(id);if(!d)return;
    let down=false,dirty=false;
    const outside=e=>{const r=d.getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom};
    d.addEventListener('input',e=>{if(e.target.matches&&e.target.matches(TXT)&&e.target.value)dirty=true});
    d.addEventListener('close',()=>{dirty=false;down=false});
    d.addEventListener('pointerdown',e=>{down=e.target===d&&outside(e)});
    d.addEventListener('click',e=>{
      if(!down||e.target!==d||!outside(e))return;
      down=false;if(dirty)return;
      const ev=new Event('cancel',{cancelable:true});d.dispatchEvent(ev);
      if(!ev.defaultPrevented&&d.open)d.close();
    });
  });
})();
Object.assign(act,{
  clsSpace:()=>clsSpace(),csTab:t=>{csTab=t;csReq=null;clsSpace(csG)},csOpen:i=>{csReq=i;csRender()},csBack:()=>{csReq=null;csRender()},

  csDone:async()=>{try{await clsCol('reqs').doc(csReq).update({ok:true})}catch(e){toast(shErr(e),'er')}},
  csDel:async i=>{const[k,id]=i.split('|');if(!confirm(Lg('Supprimer ?','Delete?','حذف؟')))return;try{if(k==='chat')await clsCol('chat').doc(id).delete();else if(k==='r')await clsCol('reqs').doc(csReq).collection('r').doc(id).delete();else{await clsCol('reqs').doc(id).delete();csReq=null;csRender()}}catch(e){toast(shErr(e),'er')}},
  projSpace:()=>projSpace(),pjOpen:c=>pjOpen(c),pjFlt:f=>{pjFilter=f;pjOpen(pjC)},
  pjNew:()=>{ask(Lg('Nouveau projet','New project','مشروع جديد'),[{k:'n',l:Lg('Nom du projet','Project name','اسم المشروع'),r:1,a:' maxlength="60"'}],async v=>{if(!(await needFb()))return;const c=shNew();
      try{await fb.db.collection('prj').doc(c).set({o:fbUser.uid,n:v.n.trim().slice(0,60),ts:Date.now()});(A.settings.projects=A.settings.projects||[]).push({c,n:v.n.trim().slice(0,60)});save();pjOpen(c)}catch(e){toast(shErr(e),'er')}})},
  pjJoin:()=>{ask(Lg('Rejoindre un projet','Join a project','انضمام إلى مشروع'),[{k:'c',l:Lg('Code du projet','Project code','رمز المشروع'),r:1,a:' autocapitalize="characters" autocomplete="off"'}],async v=>{const c=shParse(v.c);if(!shOk(c))return toast(Lg('Code invalide','Invalid code','رمز غير صالح'),'er');if(!(await needFb()))return;
      try{const s0=await fb.db.collection('prj').doc(c).get();if(!s0.exists)return toast(Lg('Projet introuvable','Project not found','المشروع غير موجود'),'er');const l=A.settings.projects=A.settings.projects||[];if(!l.some(x=>x.c===c)){l.push({c,n:s0.data().n});save()}pjOpen(c)}catch(e){toast(shErr(e),'er')}})},
  pjDone:async(id,el)=>{try{await fb.db.collection('prj').doc(pjC).collection('t').doc(id).update({done:!!el.checked})}catch(e){toast(shErr(e),'er')}},
  pjDel:async id=>{if(!confirm(Lg('Supprimer cette tâche ?','Delete this task?','حذف هذه المهمة؟')))return;try{await fb.db.collection('prj').doc(pjC).collection('t').doc(id).delete()}catch(e){toast(shErr(e),'er')}}
});

<script>
/* =====================================================================
   v14 : Chat public pour tout le serveur (collection Firestore « chat »)
   - lecture : ouverte à tous les visiteurs, même sans compte
   - écriture : compte requis, 500 caractères max, 1 message / 2,5 s (appliqué aussi par les règles via chatMeta)
   - modération : l'auteur ou l'admin supprime ; l'admin peut bloquer un compte (banned/{uid})
   - quota : seulement les 40 derniers messages, abonnement coupé en quittant la page ou après 60 s en arrière-plan
   ===================================================================== */
const CH_LIMIT=40,CH_GAP=2500;
let chPrev='da',chUnsub=null,chMsgs=[],chErr='',chLoading=false,chSent=0,chHideT=null,chDraft='';
function chStop(){clearTimeout(chHideT);if(chUnsub){try{chUnsub()}catch(e){}chUnsub=null}}
function rCh(){
  return `<div class="chpage"><div class="sethd"><div class="seth1"><button class="setx" data-a="chBack" aria-label="${Lg('Retour','Back','رجوع')}">${isRTL()?'›':'‹'}</button><h3>💬 ${Lg('Chat public','Public chat','الدردشة العامة')}</h3></div>
   <small>${Lg("Ouvert à tout le monde : n'importe qui sur le site peut lire. Pour écrire, il faut un compte.","Open to everyone: anyone on the site can read. You need an account to write.",'مفتوحة للجميع: يمكن لأي زائر القراءة. للكتابة تحتاج حسابا.')}</small></div>
   <div class="chatbox chbig" id="chl" role="log" aria-live="polite"></div><div id="chw"></div>
   <div class="warn" style="font-size:11px">${Lg("Ne partage pas d'informations personnelles (téléphone, adresse, mot de passe). Les messages sont publics ; les messages inappropriés sont supprimés et leurs auteurs peuvent être bloqués.","Don't share personal information (phone, address, password). Messages are public; inappropriate messages are removed and their authors may be blocked.",'لا تشارك معلومات شخصية. الرسائل عامة وتُحذف الرسائل المسيئة.')}</div></div>`}
function chPost(){
  if(tab!=='ch'){return}
  chPaintForm();chPaint();chStart()}
function chPaintForm(){const w=$('chw');if(!w)return;
  if(!UID){w.innerHTML=`<div class="row" style="margin:8px 0 0;flex-wrap:nowrap;align-items:center"><span class="mu" style="flex:1;font-size:13px">${Lg('Tu lis en tant que visiteur. Connecte-toi pour écrire.','You are reading as a visitor. Sign in to write.','تقرأ كزائر. سجل الدخول للكتابة.')}</span><button class="b p" data-a="chLogin">${Lg('Se connecter','Sign in','دخول')}</button></div>`;return}
  w.innerHTML=`<form id="chf" class="row" style="margin:8px 0 0;flex-wrap:nowrap"><input name="m" maxlength="500" autocomplete="off" placeholder="${Lg('Ton message…','Your message…','رسالتك…')}" style="flex:1" aria-label="${Lg('Message','Message','رسالة')}" value="${esc(chDraft)}"><button class="b p" aria-label="${Lg('Envoyer','Send','إرسال')}">➤</button></form>`;
  const f=$('chf');f.m.oninput=()=>{chDraft=f.m.value};
  f.onsubmit=async e=>{e.preventDefault();const t=f.m.value.trim();if(!t)return;
    if(Date.now()-chSent<CH_GAP){toast(Lg('Doucement : un message toutes les 3 secondes','Slow down: one message every 3 seconds','على مهلك: رسالة كل 3 ثوان'),'er');return}
    chSent=Date.now();f.m.value='';chDraft='';
    try{await chSend(t)}catch(x){f.m.value=t;chDraft=t;toast(x&&x.code==='permission-denied'?Lg("Message refusé : compte bloqué, message trop rapide, horloge de l'appareil décalée, ou règles Firestore non publiées.",'Message refused: blocked account, too fast, device clock off, or Firestore rules not published.','رفضت الرسالة'):shErr(x),'er')}}}
async function chSend(t){
  if(!(await needFb()))throw{code:'cancel'};
  const ts=Date.now(),b=fb.db.batch();
  b.set(fb.db.collection('chatMeta').doc(fbUser.uid),{t:ts});
  b.set(fb.db.collection('chat').doc(msgId()),{u:fbUser.uid,p:myTag(),m:t.slice(0,500),ts});
  await b.commit()}
function chPaint(){const l=$('chl');if(!l)return;
  if(chErr){l.innerHTML=`<p class="mu e">${esc(chErr)}</p><div class="row" style="justify-content:center"><button class="b" data-a="chRetry">${Lg('Réessayer','Retry','إعادة المحاولة')}</button></div>`;return}
  if(!chMsgs.length&&(chLoading||!chUnsub)){l.innerHTML=`<p class="mu e">${Lg('Chargement…','Loading…','جار التحميل…')}</p>`;return}
  const near=l.scrollHeight-l.scrollTop-l.clientHeight<90||!l.dataset.init,me0=fbUser&&fbUser.uid;
  l.innerHTML=chMsgs.map(m=>{const me=m.u===me0;return`<div class="msg${me?' me':''}">${avSpan(m.u)}<div class="bub"><small><span class="nm">${esc(avName(m))}</span> · ${ago(m.ts)}${me||ADMIN?` <button class="x-btn rowbtn" style="width:22px;height:22px" data-a="chDel" data-i="${m.id}" aria-label="${tr('Supprimer')}">✕</button>`:''}${ADMIN&&!me?` <button class="x-btn rowbtn" style="width:22px;height:22px" data-a="chBan" data-i="${m.u}" aria-label="${Lg('Bloquer','Block','حظر')}" title="${Lg('Bloquer ce compte','Block this account','حظر هذا الحساب')}">🚫</button>`:''}</small>${linkify(m.m||'')}</div></div>`}).join('')||`<p class="mu e">${Lg('Personne n\'a encore écrit. Lance la discussion 👋','Nobody has written yet. Start the conversation 👋','لم يكتب أحد بعد 👋')}</p>`;
  avLoad(chMsgs.map(m=>m.u),chPaint);
  if(near){l.scrollTop=l.scrollHeight;l.dataset.init=1}}
async function chStart(){
  if(chUnsub||chLoading||document.hidden)return;chLoading=true;
  try{await fbLoad()}catch(e){chLoading=false;chErr=fbMsg(e);chPaint();return}
  chLoading=false;if(tab!=='ch'||chUnsub)return;chErr='';
  chUnsub=fb.db.collection('chat').orderBy('ts','desc').limit(CH_LIMIT).onSnapshot(sn=>{chMsgs=sn.docs.map(x=>({id:x.id,...x.data()})).reverse();chErr='';chPaint()},
    e=>{chUnsub=null;chErr=e&&e.code==='permission-denied'?Lg('Chat indisponible : publie les nouvelles règles Firestore (voir LISEZ-MOI.md).','Chat unavailable: publish the new Firestore rules (see LISEZ-MOI.md).','الدردشة غير متاحة: انشر قواعد Firestore الجديدة.'):fbMsg(e);chPaint()});
  chPaint()}
document.addEventListener('visibilitychange',()=>{if(tab!=='ch')return;if(document.hidden){clearTimeout(chHideT);chHideT=setTimeout(chStop,60000)}else{clearTimeout(chHideT);chStart()}});
Object.assign(act,{
  chat:()=>{if(tab!=='ch')chPrev=tab;go('ch')},chBack:()=>go(chPrev&&chPrev!=='ch'?chPrev:'da'),chRetry:()=>{chErr='';chStop();chPaint();chStart()},
  chLogin:()=>{acMode='up';acctDlg()},
  chDel:async id=>{if(!confirm(Lg('Supprimer ce message ?','Delete this message?','حذف هذه الرسالة؟')))return;try{await fb.db.collection('chat').doc(id).delete()}catch(e){toast(shErr(e),'er')}},
  chBan:async u=>{if(!ADMIN||!u)return;if(!confirm(Lg('Bloquer ce compte du chat ?','Block this account from the chat?','حظر هذا الحساب من الدردشة؟')))return;try{await fb.db.collection('banned').doc(u).set({ts:Date.now()});toast(Lg('Compte bloqué','Account blocked','تم حظر الحساب'),'ok')}catch(e){toast(shErr(e),'er')}}
});
</script>

<script>
/* ===== v16 : notes riches (code + LaTeX), projets Kanban, assistant IA, stats par matière, Google Agenda ===== */
(function(){
const p2=n=>String(n).padStart(2,'0');

/* ---------- 1. rendu riche : blocs de code colorés + LaTeX ---------- */
const CDN='https://cdnjs.cloudflare.com/ajax/libs/';
let libP=null;
const loadJS=u=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=u;s.crossOrigin='anonymous';s.onload=ok;s.onerror=ko;document.head.append(s)});
function loadLibs(){
  if(libP)return libP;
  const l=document.createElement('link');l.rel='stylesheet';l.href=CDN+'KaTeX/0.16.9/katex.min.css';l.crossOrigin='anonymous';document.head.append(l);
  libP=Promise.allSettled([loadJS(CDN+'highlight.js/11.9.0/highlight.min.js'),loadJS(CDN+'KaTeX/0.16.9/katex.min.js')]).then(()=>{if(!window.hljs&&!window.katex)libP=null});
  return libP}
const LALIAS={'c++':'cpp','cc':'cpp','ino':'cpp','arduino':'cpp','py':'python','js':'javascript','ts':'typescript','sh':'bash','shell':'bash'};
function codeHtml(code,lang){
  lang=(lang||'').toLowerCase();lang=LALIAS[lang]||lang;let h=esc(code);
  if(window.hljs){try{h=(lang&&hljs.getLanguage(lang))?hljs.highlight(code,{language:lang,ignoreIllegals:true}).value:hljs.highlightAuto(code).value}catch(e){}}
  return '<pre class="hl" dir="ltr">'+(lang?'<span class="hll">'+esc(lang)+'</span>':'')+'<code>'+h+'</code></pre>'}
function mathHtml(x,disp){
  if(window.katex){try{return '<span dir="ltr" class="'+(disp?'mathd':'mathi')+'">'+katex.renderToString(x.trim(),{displayMode:!!disp,throwOnError:false})+'</span>'}catch(e){}}
  return '<code class="tex" dir="ltr">'+(disp?'$$':'$')+esc(x)+(disp?'$$':'$')+'</code>'}
function rich(src){
  const store=[],ph=h=>{store.push(h);return '\u0000'+(store.length-1)+'\u0000'};
  let t=String(src||'').replace(/\r/g,'');
  t=t.replace(/```([\w+#-]*)[ \t]*\n?([\s\S]*?)```/g,(m,l,c)=>ph(codeHtml(c.replace(/\n$/,''),l)));
  t=t.replace(/\$\$([\s\S]+?)\$\$/g,(m,x)=>ph(mathHtml(x,true))).replace(/\\\[([\s\S]+?)\\\]/g,(m,x)=>ph(mathHtml(x,true)));
  t=t.replace(/`([^`\n]+)`/g,(m,c)=>ph('<code>'+esc(c)+'</code>'));
  t=t.replace(/\\\((.+?)\\\)/g,(m,x)=>ph(mathHtml(x,false)));
  t=t.replace(/(^|[^\\$\w])\$([^\s$](?:[^$\n]*?[^\s$])?)\$(?!\d)/g,(m,a,x)=>a+ph(mathHtml(x,false)));
  t=esc(t);
  t=t.replace(/^#{1,3} (.+)$/gm,'<b class="rh">$1</b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*(?!\*)/g,'$1<i>$2</i>').replace(/^[-•] (.+)$/gm,'<span class="rli">• $1</span>');
  t=t.replace(/\[([^\]\n]+)\]\((https?:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/^&gt; ?(.*)$/gm,'<span class="rbq">$1</span>').replace(/^(?:-{3,}|\*{3,})$/gm,'<hr>').replace(/^(\d+)\. (.+)$/gm,'<span class="rli">$1. $2</span>');
  t=t.replace(/\n/g,'<br>');
  return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>store[+i])}
function richInto(el,text){
  el.innerHTML=rich(text);
  if(!window.hljs&&!window.katex&&/```|\$|\\\(/.test(text||''))loadLibs().then(()=>{if(el.isConnected&&(window.hljs||window.katex))el.innerHTML=rich(text)})}
window.richText=rich;window.richInto=richInto;window.loadLibs=loadLibs;

/* ---------- 2. Notes de cours : barre d'outils + aperçu + assistant ---------- */
const _clsDlg=window.clsDlg;
window.clsDlg=function(id){
  botClose();_clsDlg(id);
  const d=$('dlg'),nt=$('nt');if(!nt)return;
  nt.rows=8;nt.placeholder=Lg("Points importants… Tu peux écrire du code (```cpp … ```) et des formules LaTeX ($V=RI$ ou $$\\frac{a}{b}$$)","Key points… You can write code (```cpp … ```) and LaTeX ($V=RI$ or $$\\frac{a}{b}$$)","نقاط مهمة… يمكنك كتابة كود (```cpp … ```) ومعادلات LaTeX ($V=RI$ أو $$\\frac{a}{b}$$)");
  const bar=document.createElement('div');bar.className='row nbar';
  bar.innerHTML=`<button type="button" class="b" data-a="ntPrev">👁 ${Lg('Aperçu','Preview','معاينة')}</button><button type="button" class="b" data-a="ntIns" data-i="code">&lt;/&gt; ${Lg('Code','Code','كود')}</button><button type="button" class="b" data-a="ntIns" data-i="math">∑ LaTeX</button><button type="button" class="b" data-a="botNote">🤖 ${Lg('Assistant','Assistant','المساعد')}</button>`;
  const lab=nt.closest('label');lab.after(bar);
  const pv=document.createElement('div');pv.id='ntv';pv.className='rich';pv.hidden=true;bar.after(pv);
  const bn=document.createElement('div');bn.id='botn';bn.className='botp botn';bn.hidden=true;pv.after(bn);
  let tm;nt.addEventListener('input',()=>{if(!pv.hidden){clearTimeout(tm);tm=setTimeout(()=>richInto(pv,nt.value),180)}});
  if(/```|\$|\\\(/.test(nt.value))loadLibs()};
Object.assign(act,{
  ntPrev:()=>{const pv=$('ntv'),nt=$('nt');if(!pv)return;pv.hidden=!pv.hidden;if(!pv.hidden)richInto(pv,nt.value)},
  ntIns:k=>{const nt=$('nt');if(!nt)return;const a=nt.selectionStart,b=nt.selectionEnd,sel=nt.value.slice(a,b),
    ins=k==='code'?'\n```cpp\n'+(sel||'')+'\n```\n':'$$'+(sel||'V = R \\cdot I')+'$$';
    nt.setRangeText(ins,a,b,'end');nt.focus();nt.dispatchEvent(new Event('input'))},
  botNote:()=>{const bn=$('botn');if(!bn)return;bn.hidden=!bn.hidden;if(!bn.hidden){mountBot(bn,true);bn.querySelector('.botq').focus()}}
});

/* ---------- 3. Assistant de révision (utilise la clé Gemini/Groq déjà saisie dans ✨ IA) ---------- */
const BOT={msgs:[],busy:false,draft:''};
function botKey(){const prov=localStorage.getItem('eduVault_aiProv')||'gemini';return{prov,key:aiKey(prov)}}
function mountBot(el,inDlg){
  el.dataset.dlg=inDlg?'1':'';
  el.innerHTML=`<div class="bothd"><b>🤖 ${Lg('Assistant de révision','Study assistant','مساعد المراجعة')}</b><span class="bothb"><button type="button" class="x-btn" data-a="botClear" aria-label="${Lg('Effacer la conversation','Clear conversation','مسح المحادثة')}" title="${Lg('Effacer','Clear','مسح')}">🗑</button>${inDlg?'':`<button type="button" class="x-btn" data-a="botClose" aria-label="${tr('Fermer')}">✕</button>`}</span></div>
  ${inDlg?`<label class="botctx"><input type="checkbox" class="botc" checked> ${Lg('Inclure mes notes comme contexte (envoyées au fournisseur IA)','Include my notes as context (sent to the AI provider)','تضمين ملاحظاتي كسياق (تُرسل إلى مزود الذكاء الاصطناعي)')}</label>`:''}
  <div class="botl" role="log" aria-live="polite"></div>
  <form class="botf"><textarea class="botq" rows="2" dir="auto" placeholder="${Lg('Pose une question rapide…','Ask a quick question…','اطرح سؤالا سريعا…')}"></textarea><button class="b p" aria-label="${Lg('Envoyer','Send','إرسال')}">➤</button></form>`;
  const q=el.querySelector('.botq');q.value=BOT.draft;q.oninput=()=>{BOT.draft=q.value};
  paintBot()}
function paintBot(){
  document.querySelectorAll('.botp').forEach(el=>{const l=el.querySelector('.botl');if(!l)return;
    if(!BOT.msgs.length&&!BOT.busy){l.innerHTML=`<p class="mu e">${Lg("Demande une explication, une formule, un exemple de code… Les réponses peuvent contenir du code et du LaTeX.","Ask for an explanation, a formula, a code example… Answers can include code and LaTeX.","اطلب شرحا أو قانونا أو مثال كود… قد تحتوي الإجابات على كود ومعادلات.")}</p>`;return}
    l.innerHTML=BOT.msgs.map((m,i)=>`<div class="msg${m.r==='u'?' me':''}"><div class="bub" dir="auto">${m.r==='u'?esc(m.t).replace(/\n/g,'<br>'):'<div class="rich" data-bi="'+i+'"></div>'}</div></div>`).join('')+(BOT.busy?`<div class="msg"><div class="bub mu">…</div></div>`:'');
    l.querySelectorAll('.rich[data-bi]').forEach(r=>richInto(r,BOT.msgs[+r.dataset.bi].t));
    l.scrollTop=l.scrollHeight})}
async function botSend(root){
  if(BOT.busy)return;const q=root.querySelector('.botq'),t=q.value.trim();if(!t)return;
  q.value='';BOT.draft='';BOT.msgs.push({r:'u',t});
  const{prov,key}=botKey();
  if(!key){BOT.msgs.push({r:'a',t:Lg("Configure d'abord ta clé IA : ouvre l'onglet Horaires puis ✨ IA (clé Gemini ou Groq gratuite).","Set up your AI key first: open the Timetable tab, then ✨ AI (free Gemini or Groq key).","اضبط مفتاح الذكاء الاصطناعي أولا: افتح تبويب الحصص ثم ✨ الذكاء الاصطناعي (مفتاح Gemini أو Groq مجاني).")});paintBot();return}
  let ctx='';const nt=$('nt'),c=root.querySelector('.botc');
  if(c&&c.checked&&nt&&nt.value.trim()){const cl=A.timetable.find(x=>x.id===cur.id);ctx=`\nNotes de l'étudiant${cl?' (cours « '+modName(cl.moduleId)+' »)':''} :\n"""\n${nt.value.trim().slice(0,4000)}\n"""\n`}
  const hist=BOT.msgs.slice(-9,-1).map(m=>(m.r==='u'?'Étudiant : ':'Assistant : ')+m.t.slice(0,1500)).join('\n');
  const prompt=`Tu es un assistant de révision pour un étudiant (électronique, électricité, informatique, robotique, systèmes embarqués). Réponds de façon claire et concise, dans la langue de la dernière question. Pour le code, utilise des blocs \`\`\`langage. Pour les formules, utilise LaTeX avec $...$ (en ligne) ou $$...$$ (bloc).${ctx}\nConversation :\n${hist}\nÉtudiant : ${t}\nAssistant :`;
  BOT.busy=true;paintBot();
  try{const out=await aiCall(prov,key,aiModel(prov),[],prompt);BOT.msgs.push({r:'a',t:(out||'').trim()||'…'})}
  catch(e){BOT.msgs.push({r:'a',t:'⚠️ '+(e&&e.message||'Erreur')})}
  BOT.busy=false;BOT.msgs=BOT.msgs.slice(-30);paintBot()}
document.addEventListener('submit',e=>{const f=e.target.closest&&e.target.closest('.botf');if(!f)return;e.preventDefault();botSend(f.closest('.botp'))});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.classList&&e.target.classList.contains('botq')){e.preventDefault();botSend(e.target.closest('.botp'))}});
function botOpen(){
  const dlg=$('dlg');if(dlg&&dlg.open)return;
  let d=$('botd');if(!d){d=document.createElement('aside');d.id='botd';d.className='botp botd';d.setAttribute('aria-label','Assistant');document.body.append(d)}
  mountBot(d,false);d.hidden=false;document.documentElement.classList.add('botopen');$('botfab').hidden=true;d.querySelector('.botq').focus()}

/* glisser-déposer (souris + tactile) via Pointer Events ; les boutons ‹ › restent disponibles */
let D=null;
const colAt=(x,y)=>{D.g.style.display='none';const el=document.elementFromPoint(x,y);D.g.style.display='';return el&&el.closest?el.closest('.kbc'):null};
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest&&e.target.closest('.kbh');if(!h||D)return;const k=h.closest('.kbk');if(!k)return;e.preventDefault();
  const r=k.getBoundingClientRect(),g=k.cloneNode(true);g.classList.add('kbg');g.style.cssText=`width:${r.width}px;left:${r.left}px;top:${r.top}px`;document.body.append(g);k.classList.add('kbdrag');
  D={id:k.dataset.id,k,g,dx:e.clientX-r.left,dy:e.clientY-r.top,pid:e.pointerId};try{h.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{
  if(!D||e.pointerId!==D.pid)return;
  D.g.style.left=(e.clientX-D.dx)+'px';D.g.style.top=(e.clientY-D.dy)+'px';
  const col=colAt(e.clientX,e.clientY);document.querySelectorAll('.kbc').forEach(c=>c.classList.toggle('over',c===col));
  if(e.clientY<90)scrollBy(0,-14);else if(innerHeight-e.clientY<120)scrollBy(0,14);
  const kb=document.querySelector('.kb');if(kb){const b=kb.getBoundingClientRect();if(e.clientX<b.left+40)kb.scrollLeft-=16;else if(e.clientX>b.right-40)kb.scrollLeft+=16}});
function endDrag(e,cancel){
  if(!D||(e&&e.pointerId!==D.pid))return;const d=D;D=null;d.g.remove();d.k.classList.remove('kbdrag');
  const col=cancel?null:(D=d,colAt(e.clientX,e.clientY));D=null;document.querySelectorAll('.kbc').forEach(c=>c.classList.remove('over'));
  if(!col)return;const p=kbCur(),c=p&&p.cards.find(x=>x.id===d.id);if(!c)return;
  const before=[...col.querySelectorAll('.kbk')].filter(x=>x!==d.k).find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  p.cards=p.cards.filter(x=>x!==c);c.s=col.dataset.col;
  const bi=before?p.cards.findIndex(x=>x.id===before.dataset.id):-1;if(bi>=0)p.cards.splice(bi,0,c);else p.cards.push(c);
  upd()}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

/* ---------- 5. Statistiques : focus par matière + progression des quiz ---------- */
function spark(v,w,h){
  if(!v.length)return'';const n=v.length,x=i=>10+(n<2?(w-20)/2:i*(w-20)/(n-1)),y=a=>h-10-a/100*(h-20);
  return`<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${Lg('Évolution du score aux quiz','Quiz score over time','تطور نتائج الاختبارات')}"><line class="th" x1="10" x2="${w-10}" y1="${y(60)}" y2="${y(60)}"/><polyline fill="none" style="stroke:var(--br);stroke-width:2" points="${v.map((a,i)=>x(i)+','+y(a)).join(' ')}"/>${v.map((a,i)=>`<circle cx="${x(i)}" cy="${y(a)}" r="3.2" style="fill:var(--br)"><title>${Math.round(a)}%</title></circle>`).join('')}</svg>`}
function extraStats(){
  const mods=A.modules.filter(m=>(m.pomo||0)>0).sort((a,b)=>b.pomo-a.pomo),mx=Math.max(1,...mods.map(m=>m.pomo));
  const focus=`<div class="c" style="grid-column:1/-1"><h4>${Lg('Temps de focus par matière','Focus time per subject','وقت التركيز لكل مادة')}</h4>${mods.length?mods.map(m=>`<div class="sbr"><span class="sbn"><i style="background:${esc(m.color||'var(--br)')}"></i>${esc(m.name)}</span><span class="sbb"><i style="width:${Math.max(3,Math.round(100*m.pomo/mx))}%;background:${esc(m.color||'var(--br)')}"></i></span><b>${fmtDur(m.pomo)}</b></div>`).join(''):`<p class="mu e">${Lg('Lance un minuteur Focus en choisissant un module.','Start a Focus timer and pick a module.','شغّل مؤقت التركيز واختر مادة.')}</p>`}</div>`;
  const H=[...A.quizHist].filter(h=>h.n>0).sort((a,b)=>a.d-b.d),by={};
  H.forEach(h=>{const k=A.modules.some(m=>m.id===h.mod)?h.mod:'_';(by[k]=by[k]||[]).push(100*h.sc/h.n)});
  const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
  const rows=Object.entries(by).map(([k,a])=>{const last=a.slice(-3),rec=avg(last),prev=a.slice(-6,-3),tr_=prev.length?rec-avg(prev):0,m=A.modules.find(x=>x.id===k);
    return{name:m?m.name:Lg('Mixte (tous modules)','Mixed (all modules)','مختلط (كل المواد)'),n:a.length,all:Math.round(avg(a)),rec:Math.round(rec),tr:tr_,low:rec<60,color:m&&m.color}}).sort((a,b)=>a.rec-b.rec);
  const quiz=`<div class="c" style="grid-column:1/-1"><h4>${Lg('Progression aux quiz','Quiz progress','التقدم في الاختبارات')}</h4>${H.length?`${spark(H.slice(-20).map(h=>100*h.sc/h.n),320,90)}<small class="mu">${Lg('Derniers quiz · ligne pointillée = 60 %','Latest quizzes · dashed line = 60%','آخر الاختبارات · الخط المتقطع = 60%')}</small>
    ${rows.map(r=>`<div class="sbr"><span class="sbn">${r.color?`<i style="background:${esc(r.color)}"></i>`:''}${esc(r.name)}</span><span class="sbb"><i style="width:${r.rec}%;background:${r.low?'var(--er)':'var(--ok)'}"></i></span><b>${r.rec}%${r.tr>5?' ▲':r.tr<-5?' ▼':''}</b>${r.low?`<span class="pr h">${Lg('À réviser','Review','للمراجعة')}</span>`:''}</div>`).join('')}<small class="mu">${Lg('Score moyen sur les 3 derniers quiz de chaque matière.','Average of the last 3 quizzes per subject.','المعدل في آخر 3 اختبارات لكل مادة.')}</small>`:`<p class="mu e">${Lg('Passe un quiz pour voir ta progression.','Take a quiz to see your progress.','أجرِ اختبارا لترى تقدمك.')}</p>`}</div>`;
  return focus+quiz}

<script>
/* ===== v20 : Google Agenda — synchronisation automatique bidirectionnelle (POST / PATCH / DELETE) =====
   Calendrier dédié « EduVault » (scope calendar.app.created : l'appli ne touche JAMAIS à tes autres agendas).
   Cours = événements hebdomadaires récurrents (A/B, vacances en EXDATE) · Échéances = événements avec rappels.
   Les modifs faites dans Google (titre, heure, salle, suppression) reviennent dans EduVault. */
(function(){
const API='https://www.googleapis.com/calendar/v3/',GSCOPE='https://www.googleapis.com/auth/calendar.app.created';
const TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){return'UTC'}})();
const BYD=['MO','TU','WE','TH','FR','SA','SU'],enc=encodeURIComponent;
const p2=n=>String(n).padStart(2,'0');
const GC=()=>{const g=A.gcal=A.gcal&&typeof A.gcal==='object'?A.gcal:{};if(!g.map||typeof g.map!=='object'){Object.assign(g,{on:false,calId:'',map:{},tasks:true,tt:true,auto:true,until:'',last:0,stats:null})}return g};
const ldt=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())+':00';
const hm=s=>{const d=new Date(s);return p2(d.getHours())+':'+p2(d.getMinutes())};
const H=o=>{const s=JSON.stringify(o);let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h};
const gid=k=>'edv'+Array.from(k).map(c=>c.charCodeAt(0).toString(16)).join('');
/* couleur du module -> couleur d'événement Google la plus proche */
const GCOL={1:'#a4bdfc',2:'#7ae7bf',3:'#dbadff',4:'#ff887c',5:'#fbd75b',6:'#ffb878',7:'#46d6db',8:'#e1e1e1',9:'#5484ed',10:'#51b749',11:'#dc2127'};
const rgb=h=>[1,3,5].map(i=>parseInt(normHex(h).slice(i,i+2),16));
const gcol=h=>{const a=rgb(h);let best='9',bd=1e9;for(const[k,v]of Object.entries(GCOL)){const b=rgb(v),d=(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;if(d<bd){bd=d;best=k}}return best};

/* ---------- jeton OAuth (séparé de celui de Drive) ---------- */
let gtok=null,gexp=0,gct=null,gbusy=false,gerr='',gTimer=null,gArmed=false,gAsked=false;
try{const s=JSON.parse(localStorage.getItem('eduVault_gtok')||sessionStorage.getItem('eduVault_gtok')||'null');if(s&&s.exp>Date.now()+60000){gtok=s.t;gexp=s.exp}else localStorage.removeItem('eduVault_gtok')}catch(e){}
const gHave=()=>!!gtok&&Date.now()<gexp;
const gLib=()=>(window.google&&google.accounts&&google.accounts.oauth2)?Promise.resolve():lib('https://accounts.google.com/gsi/client');
function gAuth(){return gLib().then(()=>new Promise((ok,ko)=>{
  gct=gct||google.accounts.oauth2.initTokenClient({client_id:cid(),scope:GSCOPE,
    callback:r=>{if(r.error)return gct._ko&&gct._ko(Error(r.error));gtok=r.access_token;gexp=Date.now()+((+r.expires_in||3600)-90)*1000;
      try{localStorage.setItem('eduVault_gtok',JSON.stringify({t:gtok,exp:gexp}))}catch(e){}gerr='';gct._ok&&gct._ok()},
    error_callback:e=>gct._ko&&gct._ko(Error((e&&e.type)||'popup'))});
  gct._ok=ok;gct._ko=ko;const em=(typeof fbUser!=='undefined'&&fbUser&&fbUser.email)||'';gct.requestAccessToken(em?{prompt:'',hint:em}:{prompt:''})}))}
function gArm(){ /* la session Google dure 1 h : on se reconnecte au prochain toucher */
  if(gArmed||gAsked||!GC().on)return;gArmed=true;gPaint();
  const run=()=>{['pointerup','keydown'].forEach(t=>document.removeEventListener(t,run,true));gArmed=false;gAsked=true;if(!GC().on||gHave())return;
    gAuth().then(()=>gSync()).catch(e=>{gerr=gMsg(e);gPaint()})};
  ['pointerup','keydown'].forEach(t=>document.addEventListener(t,run,true))}
function gMsg(e){const m=String(e&&e.message||e),r=e&&e.reason;
  if(r==='accessNotConfigured'||/has not been used|disabled/i.test(m))return Lg("L'API Google Calendar n'est pas activée dans ton projet Google Cloud (voir GCAL-SETUP.md).","The Google Calendar API is not enabled in your Google Cloud project (see GCAL-SETUP.md).","واجهة Google Calendar غير مفعّلة في مشروعك على Google Cloud (راجع GCAL-SETUP.md).");
  if(/access_denied/.test(m))return Lg('Autorisation refusée.','Permission denied.','تم رفض الإذن.');
  if(/popup/.test(m))return Lg('Fenêtre de connexion bloquée ou fermée.','Sign-in window blocked or closed.','نافذة تسجيل الدخول محظورة أو أُغلقت.');
  if(e&&e.status===403)return Lg("Permission insuffisante : reconnecte-toi et accepte l'accès à Google Agenda.",'Insufficient permission: reconnect and allow Google Calendar access.','صلاحية غير كافية: أعد الاتصال ووافق على الوصول إلى Google Calendar.');
  return m}
async function gf(path,opt={},n=0){
  if(!gHave()){const e=Error('no-token');e.status=401;throw e}
  const r=await fetch(API+path,{method:opt.method||'GET',headers:{Authorization:'Bearer '+gtok,'Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===204)return null;let j=null;try{j=await r.json()}catch(e){}
  if(r.ok)return j;
  const er=(j&&j.error)||{},reason=(er.errors&&er.errors[0]&&er.errors[0].reason)||er.status||'',e=Error(er.message||('HTTP '+r.status));e.status=r.status;e.reason=reason;

  if((r.status===429||r.status>=500||(r.status===403&&/rate|quota/i.test(reason)))&&n<3){await new Promise(z=>setTimeout(z,500*Math.pow(2,n)+Math.random()*250));return gf(path,opt,n+1)}
  throw e}

/* ---------- ce qu'EduVault veut voir dans l'agenda ---------- */
const defUntil=()=>{const d=new Date();d.setDate(d.getDate()+112);return iso(d)};
function taskEv(t){
  const d=new Date(t.dueDate),ex=t.type==='exam',m=A.modules.find(x=>x.id===t.moduleId),ic=ex?'🚨':t.type==='review'?'📖':'📝',end=new Date(d.getTime()+(ex?120:30)*6e4);
  return{b:{summary:`${ic} ${t.title}${m?' · '+m.name:''}`,description:'EduVault',start:{dateTime:ldt(d),timeZone:TZ},end:{dateTime:ldt(end),timeZone:TZ},colorId:m?gcol(m.color):'9',
    reminders:{useDefault:false,overrides:ex?[{method:'popup',minutes:1440},{method:'popup',minutes:180},{method:'popup',minutes:30}]:[{method:'popup',minutes:1440},{method:'popup',minutes:60}]},
    extendedProperties:{private:{edvKey:'t_'+t.id}}}}}
function firstDate(c,di){const mon=monday(new Date()),t0=new Date();t0.setHours(0,0,0,0);
  for(let w=0;w<4;w++){const d=new Date(mon);d.setDate(mon.getDate()+di+7*w);if(d<t0)continue;if(c.week&&c.week!=='all'&&weekOfDate(d)!==c.week)continue;return iso(d)}
  return iso(mon)}
function classEv(c){
  if(c.date){if(c.date<iso(new Date(Date.now()-864e5)))return null;const mod0=A.modules.find(x=>x.id===c.moduleId);
    return{s:c.date,sig:'x|'+c.date,b:{summary:(mod0?mod0.name:'Cours')+' ➕',location:c.room||'',description:'EduVault · '+Lg('séance supplémentaire','extra session','حصة إضافية')+(c.prof?' · '+c.prof:'')+(c.note?' · '+c.note:''),start:{dateTime:c.date+'T'+c.startTime+':00',timeZone:TZ},end:{dateTime:c.date+'T'+c.endTime+':00',timeZone:TZ},colorId:mod0?gcol(mod0.color):'9',reminders:{useDefault:false,overrides:[{method:'popup',minutes:1440},{method:'popup',minutes:30}]},extendedProperties:{private:{edvKey:'c_'+c.id}}}}}
  const di=DAYS.indexOf(c.day);if(di<0||!c.startTime||!c.endTime)return null;
  const g=GC(),m=g.map['c_'+c.id],wk=c.week&&c.week!=='all'?c.week:'all',sig=c.day+'|'+wk,iv=wk==='all'?1:2;
  const sd=m&&m.sig===sig&&m.s?m.s:firstDate(c,di),until=g.until||defUntil(),ex=[];
  for(let d=new Date(sd+'T00:00'),n=0;iso(d)<=until&&n<80;n++,d.setDate(d.getDate()+7*iv)){const s=iso(d);if(isHol(s))ex.push(s.replace(/-/g,'')+'T'+c.startTime.replace(':','')+'00')}
  const mod=A.modules.find(x=>x.id===c.moduleId);
  const rec=[`RRULE:FREQ=WEEKLY;INTERVAL=${iv};BYDAY=${BYD[di]};UNTIL=${until.replace(/-/g,'')}T235959Z`];
  if(ex.length)rec.push(`EXDATE;TZID=${TZ}:${ex.join(',')}`);
  return{s:sd,sig,b:{summary:mod?mod.name:'Cours',location:c.room||'',description:'EduVault'+(wk==='all'?'':' · '+Lg('Semaine','Week','أسبوع')+' '+wk),
    start:{dateTime:sd+'T'+c.startTime+':00',timeZone:TZ},end:{dateTime:sd+'T'+c.endTime+':00',timeZone:TZ},recurrence:rec,colorId:mod?gcol(mod.color):'9',
    reminders:{useDefault:false,overrides:[{method:'popup',minutes:30}]},extendedProperties:{private:{edvKey:'c_'+c.id}}}}}
function desired(){
  const g=GC(),out={},now=Date.now();
  if(g.tasks)A.tasks.forEach(t=>{if(t.completed||t.gnosync||!t.dueDate)return;const d=new Date(t.dueDate);if(isNaN(d)||d.getTime()<now-30*864e5)return;out['t_'+t.id]=taskEv(t)});
  if(g.tt){const ids=curIds();A.timetable.forEach(c=>{if(!ids.has(c.moduleId)||c.gnosync)return;const e=classEv(c);if(e)out['c_'+c.id]=e})}
  return out}

/* ---------- Google -> EduVault (modifs faites dans l'agenda) ---------- */
function applyPull(k,ev){
  const id=k.slice(2);let ch=false;
  if(k[0]==='t'){const t=A.tasks.find(x=>x.id===id);if(!t)return false;
    let s=(ev.summary||'').replace(/^[🚨📖📝]\s*/u,'');const m=A.modules.find(x=>x.id===t.moduleId);if(m&&s.endsWith(' · '+m.name))s=s.slice(0,-(m.name.length+3));s=s.trim();
    if(s&&s!==t.title){t.title=s;ch=true}
    const st=ev.start&&(ev.start.dateTime||(ev.start.date?ev.start.date+'T08:00:00':''));
    if(st){const nd=ldt(new Date(st)).slice(0,16);if(nd!==t.dueDate){t.dueDate=nd;ch=true}}}

    const sd=ev.start&&ev.start.dateTime,ed=ev.end&&ev.end.dateTime;
    if(sd&&hm(sd)!==c.startTime){c.startTime=hm(sd);ch=true}if(ed&&hm(ed)!==c.endTime){c.endTime=hm(ed);ch=true}
    if(c.date&&sd){const nd=ldt(new Date(sd)).slice(0,10);if(nd!==c.date){c.date=nd;c.day=DAYS[(new Date(nd+'T00:00').getDay()+6)%7];ch=true}}

/* ---------- moteur de synchronisation ---------- */
const calPath=()=>'calendars/'+enc(GC().calId)+'/events';
async function gFindCals(){const out=[];let pt='';
  do{const r=await gf('users/me/calendarList?maxResults=250&fields='+enc('nextPageToken,items(id,summary,accessRole)')+(pt?'&pageToken='+enc(pt):''));
    (r.items||[]).forEach(c=>{if(c.summary==='EduVault'&&c.accessRole==='owner')out.push(c)});pt=r.nextPageToken||''}while(pt);

async function gList(){const out=[];let pt='';
  do{const r=await gf(calPath()+'?maxResults=2500&showDeleted=true&fields='+enc('nextPageToken,items(id,status,updated,summary,location,start,end,extendedProperties/private)')+(pt?'&pageToken='+enc(pt):''));out.push(...(r.items||[]));pt=r.nextPageToken||''}while(pt);
  return out}
async function gSync(manual,retry){
  const g=GC();if(!g.on||gbusy)return;
  if(!gHave()){gArm();return}
  gbusy=true;gerr='';const st={c:0,u:0,d:0,p:0,l:0};gPaint();let more=false,pulled=false;
  try{
    if(!g.calId)await gMakeCal();
    const list=await gList(),byKey={};list.forEach(e=>{const k=e.extendedProperties&&e.extendedProperties.private&&e.extendedProperties.private.edvKey;if(k)byKey[k]=e});
    /* 1) lire les changements faits côté Google */
    let des=desired();
    for(const k of Object.keys(g.map)){const m=g.map[k],ev=byKey[k];
      if(!ev||ev.status==='cancelled'){if(des[k]){unlinkItem(k);st.l++}delete g.map[k];continue}
      if(ev.updated!==m.u){const localChanged=des[k]&&H(des[k].b)!==m.h;
        if(!localChanged&&applyPull(k,ev)){st.p++;pulled=true}
        m.u=ev.updated;if(!localChanged){const nd=desired()[k];if(nd){m.h=H(nd.b)}}}}
    des=desired();
    /* 2) envoyer les changements d'EduVault */
    let ops=0;
    for(const k of Object.keys(des)){if(ops>=60){more=true;break}
      const d=des[k],m=g.map[k],h=H(d.b),ev=byKey[k],alive=ev&&ev.status!=='cancelled';
      if(m&&m.h===h)continue;ops++;
      if(m||alive){const eid=m?m.id:ev.id,r=await gf(calPath()+'/'+enc(eid),{method:'PATCH',body:d.b});g.map[k]={id:r.id,h,u:r.updated,s:d.s,sig:d.sig};st.u++}
      else{try{const r=await gf(calPath(),{method:'POST',body:{...d.b,id:gid(k)}});g.map[k]={id:r.id,h,u:r.updated,s:d.s,sig:d.sig};st.c++}
        catch(e){if(e.status!==409)throw e;const r=await gf(calPath()+'/'+gid(k),{method:'PATCH',body:{...d.b,status:'confirmed'}});g.map[k]={id:r.id,h,u:r.updated,s:d.s,sig:d.sig};st.u++}}}
    for(const k of Object.keys(g.map)){if(des[k])continue;if(ops>=60){more=true;break}ops++;
      try{await gf(calPath()+'/'+enc(g.map[k].id),{method:'DELETE'})}catch(e){if(e.status!==404&&e.status!==410)throw e}
      delete g.map[k];st.d++}
    g.last=Date.now();g.stats=st;
  }catch(e){
    if(e.status===404&&!retry&&g.calId){g.calId='';g.map={};gbusy=false;return gSync(manual,1)}
    gerr=gMsg(e);if(e.status===401)gArm()}
  gbusy=false;save();if(pulled)render();gPaint();if(more)setTimeout(()=>gSync(),8000)}
const gSched=()=>{const g=GC();if(!g.on||!g.auto||gbusy)return;clearTimeout(gTimer);gTimer=setTimeout(()=>gSync(),7000)};
const _save=window.save;window.save=function(){const r=_save.apply(this,arguments);if(!gbusy)gSched();return r};
setInterval(()=>{const g=GC();if(document.visibilityState==='visible'&&g.on&&g.auto&&Date.now()-(g.last||0)>5*6e4)gSync()},60000);
document.addEventListener('visibilitychange',()=>{const g=GC();if(document.visibilityState==='visible'&&g.on&&g.auto&&Date.now()-(g.last||0)>2*6e4)gSync()});
addEventListener('online',gSched);

/* ---------- fenêtre « Google Agenda » ---------- */
const upcoming=()=>{const now=Date.now()-36e5;return A.tasks.filter(t=>!t.completed&&t.dueDate&&new Date(t.dueDate).getTime()>=now).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate))};
const tIco=t=>t.type==='exam'?'🚨 ':t.type==='review'?'📖 ':'📝 ';
const gUrl=t=>{const d=new Date(t.dueDate);if(isNaN(d))return'';const e=new Date(d.getTime()+36e5),f=x=>x.getFullYear()+p2(x.getMonth()+1)+p2(x.getDate())+'T'+p2(x.getHours())+p2(x.getMinutes())+'00';
  return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+enc(tIco(t)+t.title+' · '+modName(t.moduleId))+'&dates='+f(d)+'/'+f(e)+'&details=EduVault'};

  return`<b>${L[0]} ${esc(L[1])}</b>${g.on&&g.last?`<small class="mu">${Lg('Dernière synchro','Last sync','آخر مزامنة')} : ${new Date(g.last).toLocaleString(LOC())}${st?` · +${st.c} ~${st.u} −${st.d}${st.p?' · ↩ '+st.p:''}${st.l?' · ⛓ '+st.l:''}`:''}</small>`:''}`}

Object.assign(act,{
  gcal:()=>{const g=GC(),l=upcoming(),unl=A.tasks.filter(t=>t.gnosync).length+A.timetable.filter(c=>c.gnosync).length;
    dlgShow(`<h3>🗓 Google ${Lg('Agenda','Calendar','التقويم')}</h3><div id="gcst" class="gcst">${gStatusHTML()}</div>
    ${g.on?`<p class="mu" style="margin:8px 0">${Lg("Les cours et échéances sont envoyés dans un agenda dédié « EduVault » (tes autres agendas ne sont jamais touchés). Les changements faits dans Google (titre, heure, salle, suppression) reviennent ici.","Classes and deadlines go to a dedicated “EduVault” calendar (your other calendars are never touched). Changes made in Google (title, time, room, deletion) come back here.","تُرسل الحصص والمواعيد إلى تقويم مخصص «EduVault» (لا تُمَسّ تقاويمك الأخرى). التغييرات التي تجريها في Google (العنوان، الوقت، القاعة، الحذف) تعود إلى هنا.")}</p>
      ${chk('auto',Lg('Synchronisation automatique','Automatic sync','مزامنة تلقائية'))}${chk('tasks',Lg('Examens et devoirs','Exams and homework','الامتحانات والواجبات'))}${chk('tt',Lg('Emploi du temps (cours hebdomadaires)','Timetable (weekly classes)','جدول الحصص (أسبوعيا)'))}
      <label class="gcr">${Lg("Cours répétés jusqu'au","Classes repeat until","تتكرر الحصص حتى")} <input type="date" value="${esc(g.until||defUntil())}" onchange="act.gcSet('until',this.value)"></label>
      ${unl?`<p class="mu">⛓ ${unl} ${Lg("élément(s) supprimé(s) dans Google : ils ne sont plus synchronisés.","item(s) deleted in Google are no longer synced.","عناصر حُذفت في Google ولم تعد تتزامن.")} <button class="b" data-a="gcRelink">${Lg('Les resynchroniser','Sync them again','أعد مزامنتها')}</button></p>`:''}
      <div class="row"><button class="b p" data-a="gcNow">⟳ ${Lg('Synchroniser maintenant','Sync now','زامن الآن')}</button><button class="b" data-a="gcStop">${Lg('Arrêter la synchro','Stop syncing','إيقاف المزامنة')}</button></div>
      <div class="row"><button class="b" data-a="gcDedupe">🧹 ${Lg('Supprimer les agendas EduVault en double','Remove duplicate EduVault calendars','حذف تقاويم EduVault المكررة')}</button><button class="b" style="color:var(--er)" data-a="gcWipe">🗑 ${Lg("Supprimer l'agenda EduVault de Google","Delete the EduVault calendar from Google","حذف تقويم EduVault من Google")}</button></div>`
    :`<p class="mu" style="margin:8px 0">${Lg("Connecte ton compte Google pour envoyer automatiquement tes cours (récurrents, semaines A/B, vacances) et tes examens/devoirs vers Google Agenda, avec rappels sur ton téléphone.","Connect your Google account to automatically send your classes (recurring, A/B weeks, holidays) and exams/homework to Google Calendar, with phone reminders.","اربط حسابك على Google لإرسال حصصك (متكررة، أسابيع A/B، العطل) وامتحاناتك وواجباتك تلقائيا إلى Google Calendar مع تذكيرات على هاتفك.")}</p>
      ${gerr?`<p class="bad">${esc(gerr)}</p>`:''}<div class="row"><button class="b p" data-a="gcConnect">${Lg('Connecter Google Agenda','Connect Google Calendar','ربط Google Calendar')}</button></div>`}
    <details style="margin-top:10px"><summary class="mu">${Lg('Ajout manuel (sans connexion)','Manual add (no sign-in)','إضافة يدوية (بدون ربط)')}</summary><div class="gcl">${l.length?l.map(t=>`<div class="rs" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="min-width:0"><b>${tIco(t)}${esc(t.title)}</b><small class="mu">${esc(modName(t.moduleId))} · ${new Date(t.dueDate).toLocaleString(LOC())}</small></span><a class="b" href="${gUrl(t)}" target="_blank" rel="noopener">＋ Google</a></div>`).join(''):`<p class="mu e">${Lg('Aucune échéance à venir.','No upcoming deadlines.','لا توجد مواعيد قادمة.')}</p>`}</div><div class="row"><button class="b" data-a="exptask">⬇ .ics ${Lg('(échéances)','(deadlines)','(المواعيد)')}</button></div></details>
    <div class="row"><button class="b" onclick="$('dlg').close()">${tr('Fermer')}</button></div>`)},
  gcConnect:async()=>{try{toast(Lg('Connexion à Google…','Connecting to Google…','جارٍ الاتصال بـ Google…'));await gAuth();GC().on=true;GC().last=0;save();act.gcal();await gSync(true);act.gcal();if(!gerr)toast(Lg('Google Agenda synchronisé ✔','Google Calendar synced ✔','تمت مزامنة Google Calendar ✔'),'ok')}catch(e){gerr=gMsg(e);GC().on=false;toast(gerr,'er');act.gcal()}},
  gcSet:(k,v)=>{const g=GC();g[k]=v;save();gSched();if(k==='until'||k==='tasks'||k==='tt')setTimeout(()=>gSync(),400)},
  gcNow:async()=>{if(!gHave()){try{await gAuth()}catch(e){gerr=gMsg(e);gPaint();return}}await gSync(true);act.gcal()},
  gcStop:()=>{GC().on=false;save();clearTimeout(gTimer);act.gcal();toast(Lg("Synchronisation arrêtée (les événements restent dans Google)","Sync stopped (events stay in Google)","تم إيقاف المزامنة (تبقى الأحداث في Google)"))},
  gcRelink:()=>{A.tasks.forEach(t=>delete t.gnosync);A.timetable.forEach(c=>delete c.gnosync);save();gSync(true).then(()=>act.gcal())},
  gcDedupe:async()=>{
    try{if(!gHave())await gAuth();const g=GC(),f=await gFindCals();
      if(!g.calId&&f.length){g.calId=f[0].id;g.map={}}
      const extra=f.filter(c=>c.id!==g.calId);
      if(!extra.length){toast(Lg('Aucun doublon : un seul agenda EduVault ✔','No duplicates: a single EduVault calendar ✔','لا تكرار: تقويم EduVault واحد ✔'),'ok');save();return}
      if(!confirm(Lg(`Supprimer ${extra.length} agenda(s) EduVault en double dans Google ? L'agenda utilisé par l'appli est conservé.`,`Delete ${extra.length} duplicate EduVault calendar(s) in Google? The one used by the app is kept.`,`حذف ${extra.length} تقويم(ات) EduVault مكررة في Google؟ يُحتفظ بالتقويم الذي يستخدمه التطبيق.`)))return;
      let n=0;for(const c of extra){try{await gf('calendars/'+enc(c.id),{method:'DELETE'});n++}catch(e){if(e.status===404||e.status===410)n++}}
      save();toast(Lg(`${n} agenda(s) en double supprimé(s) ✔`,`${n} duplicate calendar(s) removed ✔`,`تم حذف ${n} تقويم(ات) مكررة ✔`),'ok');gSync(true).then(()=>act.gcal())}
    catch(e){toast(e&&e.status===403?Lg("Google n'autorise pas la liste des agendas : supprime les doublons à la main dans Google Agenda (Paramètres de l'agenda > Supprimer).","Google doesn't allow listing calendars: delete duplicates manually in Google Calendar (Calendar settings > Delete).","Google لا يسمح بعرض التقاويم: احذف المكررة يدويا من إعدادات التقويم."):gMsg(e),'er')}},
  gcWipe:async()=>{if(!confirm(Lg("Supprimer l'agenda « EduVault » et tous ses événements dans Google ? (tes données EduVault ne sont pas touchées)","Delete the “EduVault” calendar and all its events in Google? (your EduVault data is untouched)","حذف تقويم «EduVault» وكل أحداثه في Google؟ (بياناتك في EduVault لا تتأثر)")))return;
    const g=GC();try{if(!gHave())await gAuth();if(g.calId){try{await gf('calendars/'+enc(g.calId),{method:'DELETE'})}catch(e){if(e.status!==404&&e.status!==410){for(const k of Object.keys(g.map)){try{await gf(calPath()+'/'+enc(g.map[k].id),{method:'DELETE'})}catch(x){}}}}}
      g.calId='';g.map={};g.on=false;g.stats=null;A.tasks.forEach(t=>delete t.gnosync);A.timetable.forEach(c=>delete c.gnosync);save();act.gcal();toast(Lg('Agenda EduVault supprimé de Google','EduVault calendar removed from Google','تم حذف تقويم EduVault من Google'),'ok')}
    catch(e){toast(gMsg(e),'er')}}
});
/* démarrage : si la synchro est active, on reprend (jeton encore valide) ou on attend le prochain toucher */
setTimeout(()=>{const g=GC();if(!g.on)return;if(gHave())gSync();else gArm()},2500);
window.__gcal={GC,gSync,desired,gHave};
})();

<script>
/* ===== v21 : école & âge, règles de moyenne + simulateur, visionneuse complète, partage/raccourcis/installation,
   dictée & lecture vocale, import ICS, cartes à trous & images masquées ===== */
(function(){
const p2=n=>String(n).padStart(2,'0'),enc=encodeURIComponent;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const num=v=>{if(v===''||v==null)return null;const x=+String(v).replace(',','.');return isFinite(x)?x:null};

/* ================= 1. École & âge (étape d'accueil) ================= */
const SCHOOLS=['ENIAD','ENSA','ENSAM','EMI','INPT','INSEA','ENCG','FST (Faculté des Sciences et Techniques)','Faculté des Sciences','Faculté Polydisciplinaire','FSJES','CPGE (classes préparatoires)','École d\'ingénieurs privée','Université privée','Autre'];
const presetFor=s=>/ensa|eniad|ensam|\bemi\b|inpt|insea|ing[ée]nieur/i.test(s||'')?'eng':/fst|facult|fsjes|univers/i.test(s||'')?'lmd':'simple';
function afterOnboard(){const d=$('dlg');d.oncancel=null;if(d.open)d.close();if(!LS('eduVault_tour'))setTimeout(()=>{typeof profFirst==='function'?profFirst():typeof tourStart==='function'&&tourStart()},500)}
function schoolStep(first){
  const st=A.settings;
  dlgShow(`<h3>🏫 ${Lg('Ton école','Your school','مدرستك')}</h3>
   <p class="mu">${Lg("Pour adapter EduVault (règles de moyenne, vocabulaire, présets).","To tailor EduVault (grading rules, wording, presets).","لتكييف EduVault (قواعد المعدل والمصطلحات).")}</p>
   <label>${Lg('Dans quelle école / faculté étudies-tu ?','Which school / faculty do you study at?','في أي مدرسة / كلية تدرس؟')}<input id="scn" list="schl" maxlength="80" autocomplete="off" placeholder="ENIAD, ENSA, FST…" value="${esc(st.school||'')}"></label>
   <datalist id="schl">${SCHOOLS.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
   <label>${Lg('Âge (facultatif)','Age (optional)','العمر (اختياري)')}<input id="sca" type="number" inputmode="numeric" min="10" max="99" value="${st.age||''}"></label>
   <p class="mu"><small>${Lg("Ces informations restent dans tes données EduVault, tu peux les modifier ou les laisser vides.","This stays in your EduVault data; you can edit it or leave it empty.","تبقى هذه المعلومات ضمن بياناتك في EduVault ويمكنك تعديلها أو تركها فارغة.")}</small></p>
   <div class="row"><button class="b" data-a="schSkip" data-i="${first?1:0}">${Lg('Passer','Skip','تخطي')}</button><button class="b p" data-a="schSave" data-i="${first?1:0}">${Lg('Continuer','Continue','متابعة')}</button></div>`);
  if(first)$('dlg').oncancel=e=>e.preventDefault()}
window.schoolStep=schoolStep;window.afterOnboard=afterOnboard;

/* ================= 2. Règles de moyenne + simulateur ================= */
const RDEF={preset:'custom',modPass:10,elim:5,compSem:true,semPass:10,compYear:true,yearPass:10,ratMode:'max',ratCap:10,ectsSem:30};
const RPRE={simple:{modPass:10,elim:null,compSem:true,semPass:10,compYear:true,yearPass:10,ratMode:'max',ratCap:10},
  lmd:{modPass:10,elim:5,compSem:true,semPass:10,compYear:true,yearPass:10,ratMode:'max',ratCap:10},
  eng:{modPass:10,elim:8,compSem:true,semPass:10,compYear:false,yearPass:10,ratMode:'cap',ratCap:10}};
const getR=()=>Object.assign({},RDEF,A.settings.rules||{});
function ectsOf(m,R){if(m.ects!=null&&m.ects!=='')return +m.ects;const ms=A.modules.filter(x=>x.semester===m.semester),tc=ms.reduce((s,x)=>s+(x.coeff||1),0)||1;return Math.round(R.ectsSem*(m.coeff||1)/tc*2)/2}
function noteOf(m,R,ov){
  const g=k=>ov&&ov[k]!==undefined?ov[k]:m[k];
  const comp=ex=>{let t=0,d=0;[['ncc','ccc'],['ntp','ctp']].forEach(([n,c])=>{const v=g(n);if(v!=null&&m[c]>0){t+=v*m[c];d+=m[c]}});if(ex!=null&&m.cex>0){t+=ex*m.cex;d+=m.cex}return d?t/d:null};
  const o=comp(g('nex'));if(o==null)return null;
  const rat=g('nrat');if(rat==null||!(m.cex>0))return o;
  const r=comp(rat);if(r==null)return o;
  if(R.ratMode==='replace')return r;
  if(R.ratMode==='cap')return Math.max(o,Math.min(r,R.ratCap));
  return Math.max(o,r)}
function evalSem(sem,ovAll){
  const R=getR(),ms=A.modules.filter(m=>m.semester===sem),rows=ms.map(m=>({m,n:noteOf(m,R,ovAll&&ovAll[m.id]),k:m.coeff||1,e:ectsOf(m,R)}));
  const kn=rows.filter(r=>r.n!=null),sk=kn.reduce((s,r)=>s+r.k,0),avg=sk?kn.reduce((s,r)=>s+r.n*r.k,0)/sk:null;
  const elimHit=R.elim!=null&&kn.some(r=>r.n<R.elim),complete=rows.length>0&&kn.length===rows.length;
  const semOK=R.compSem?(avg!=null&&avg>=R.semPass&&!elimHit):(complete&&kn.every(r=>r.n>=R.modPass));
  rows.forEach(r=>{r.s=r.n==null?'N':r.n>=R.modPass?'V':(R.compSem&&semOK&&(R.elim==null||r.n>=R.elim))?'C':(R.elim!=null&&r.n<R.elim)?'E':'R'});
  const got=rows.filter(r=>r.s==='V'||r.s==='C').reduce((s,r)=>s+r.e,0),total=rows.reduce((s,r)=>s+r.e,0);
  return{R,rows,avg,semOK,complete,elimHit,got,total}}
function needExam(m,target,ov){
  if(!(m.cex>0))return null;const g=k=>ov&&ov[k]!==undefined?ov[k]:m[k];let t=0,d=0;
  [['ncc','ccc'],['ntp','ctp']].forEach(([n,c])=>{const v=g(n);if(v!=null&&m[c]>0){t+=v*m[c];d+=m[c]}});
  return(target*(d+m.cex)-t)/m.cex}
const SLAB={V:['✅',Lg('Validé','Passed','ناجح')],C:['🟰',Lg('Compensé','Compensated','معوَّض')],R:['⚠️',Lg('À rattraper','Retake','استدراك')],E:['⛔',Lg('Éliminatoire','Eliminatory','إقصائي')],N:['·','—']};
const f2=x=>x==null?'—':(Math.round(x*100)/100).toFixed(2).replace(/\.?0+$/,'');
const SIM={sem:null,ov:{}};
function simRes(){
  const sem=SIM.sem,ev=evalSem(sem,SIM.ov),R=ev.R;
  ev.rows.forEach(r=>{const el=document.getElementById('simo-'+r.m.id);if(!el)return;
    const ne=needExam(r.m,R.modPass,SIM.ov[r.m.id]),hint=r.s==='V'||ne==null?'':ne>20?Lg('Validation directe impossible','Direct pass impossible','النجاح المباشر مستحيل'):ne<=0?'':Lg('Examen ≥ ','Exam ≥ ','الامتحان ≥ ')+f2(Math.ceil(ne*100)/100)+Lg(' pour valider',' to pass',' للنجاح');
    el.innerHTML=`<b>${f2(r.n)}</b> <span class="sst s-${r.s}">${SLAB[r.s][0]} ${esc(SLAB[r.s][1])}</span>${hint?`<small class="mu"> · ${esc(hint)}</small>`:''}`});
  const S=document.getElementById('simsum');if(!S)return;
  const lv=LV[A.settings.level]||[],i=lv.indexOf(sem),pair=i<0?null:lv[i^1];let yr='';
  if(pair){const o=evalSem(pair),all=[...ev.rows,...o.rows].filter(r=>r.n!=null),sk=all.reduce((s,r)=>s+r.k,0),ya=sk?all.reduce((s,r)=>s+r.n*r.k,0)/sk:null;
