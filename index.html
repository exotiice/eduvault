.ph{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.ph div{position:relative;flex:none}.ph img{width:64px;height:64px;object-fit:cover;border-radius:10px}.ph button{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;border:0;background:var(--er);color:#fff;font-size:11px}

.tod{border-color:var(--br);box-shadow:0 0 0 1px var(--br)}
:focus-visible{outline:3px solid var(--br);outline-offset:2px}

h1{cursor:pointer}.n3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--in);padding:8px;border-radius:12px;margin:0 0 8px;font-size:11px}.n3 label{margin:0}.n3 input{padding:6px;margin-top:2px;background:var(--card)}
input[type=color]{height:42px;padding:3px}

.c{box-shadow:0 1px 3px #0000001a}.b{transition:transform .12s,opacity .12s}.b:active{transform:scale(.96)}
nav{overflow-x:auto;gap:2px}nav button{min-width:54px;border-radius:12px}nav .on{background:var(--bs)}

@media(prefers-reduced-motion:reduce){dialog[open]{animation:none}.b{transition:none}}
.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--br),#0006);background-color:var(--br);color:#fff;border-radius:18px;padding:16px;display:grid;gap:2px}.hero b{font-size:19px}.hero small{opacity:.9;font-size:12px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0;cursor:pointer}.sw.sel{border-color:var(--tx)}

.bar{height:6px;border-radius:9px;background:var(--in);overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--br);transition:width .3s}

.opt:not(:disabled):hover{border-color:var(--br)}.opt.ok{border-color:var(--ok);background:#05966926}.opt.no{border-color:var(--er);background:#dc262626}.opt:disabled{cursor:default;color:var(--tx)}
.okt{color:var(--ok);font-weight:700}.bad{color:var(--er);font-weight:700}
.mh{flex-wrap:wrap;align-items:flex-start}.mh>div:first-child{flex:1 1 140px;min-width:0}.mh>div:last-child{flex-wrap:wrap}.mh b{overflow-wrap:anywhere}

/* ===== design moderne ===== */
:root{--r:20px;--sh:0 10px 30px -16px rgba(15,23,42,.4)}
.dark{--bg:#0a1020;--card:#111a2f;--ln:#1f2b47;--in:#182440;--mu:#94a3b8}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;font-size:15px;letter-spacing:-.005em;
 background:radial-gradient(900px 420px at 50% -140px,color-mix(in srgb,var(--br) 20%,transparent),transparent),var(--bg);background-repeat:no-repeat;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
header{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);padding:10px 14px}
h1{display:flex;align-items:center;gap:8px;font-size:19px;letter-spacing:-.02em}
h1 .ic{width:30px;height:30px;padding:5px;border-radius:10px;background:var(--br);color:#fff;stroke-width:2.1}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
h3{font-size:18px;letter-spacing:-.01em}h4{display:flex;align-items:center;gap:6px;font-size:11.5px}
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
.c{border-radius:var(--r);padding:14px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
@media(hover:hover){.c:hover{transform:translateY(-2px)}}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:9px 14px;border:1px solid var(--ln);background:var(--card)}
.b.p{border-color:transparent;background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 70%,#000));box-shadow:0 8px 18px -8px var(--br)}
.pills .b{padding:7px 16px;border-radius:99px;flex:none}.pills .b.cur::after{content:"";width:6px;height:6px;border-radius:50%;background:#f59e0b;margin-left:2px}
nav{left:50%;right:auto;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(580px,calc(100% - 20px));border:1px solid var(--ln);border-radius:26px;padding:6px;
 background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 18px 44px -14px rgba(0,0,0,.5)}
nav button{padding:7px 2px 6px;font-size:10.5px;border-radius:18px;gap:3px}nav button span{display:flex}nav .ic{width:23px;height:23px}
nav .on{background:var(--bs);color:var(--br)}
.cl{border-radius:14px;padding:11px 12px;transition:filter .12s}.cl:hover{filter:brightness(1.04)}
.x-btn{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;transition:background .12s}.x-btn:hover{background:var(--in)}.x-btn .ic{width:18px;height:18px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 55%,#000))}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;background:#ffffff22}.hero b{font-size:21px;letter-spacing:-.02em}
input,select,textarea{border-radius:14px;border:1px solid transparent;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--br);box-shadow:0 0 0 3px color-mix(in srgb,var(--br) 25%,transparent)}
dialog{border-radius:26px;padding:20px;box-shadow:0 30px 80px -20px #000b}dialog::backdrop{background:#0b122099;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.st>div{border-radius:18px}.opt{border-radius:16px}.fa,.fb{border-radius:20px}
#ts div{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 10px 24px -10px #0008}
.top{margin-bottom:14px}.rs{border-radius:14px}.e{border-radius:14px}

/* ===== v3 : identite visuelle (icone) ===== */
:root{--br:#2f6fe4;--bs:#e6efff;--ac:#f59e0b;--r:22px}
.dark{--bg:#080e1d;--card:#0f1830;--ln:#1b2a4a;--in:#16223f;--bs:#2f6fe42b}
body{background:radial-gradient(1000px 460px at 50% -160px,color-mix(in srgb,var(--br) 26%,transparent),transparent),radial-gradient(500px 300px at 100% 30%,color-mix(in srgb,var(--ac) 7%,transparent),transparent),var(--bg);background-repeat:no-repeat}
h1 .logo{width:32px;height:32px;border-radius:10px;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--br) 70%,#000)}
header{border-bottom:1px solid color-mix(in srgb,var(--ln) 70%,transparent)}
nav{border-radius:28px;padding:6px 8px}
nav .on{background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 62%,#000));color:#fff;box-shadow:0 8px 18px -8px var(--br)}
nav button{transition:background .2s,color .2s,transform .15s}nav button:active{transform:scale(.92)}
nav .ic{fill:none}
.sbadge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;border-radius:18px;background:var(--bs);border:1px solid color-mix(in srgb,var(--br) 28%,transparent)}
.sbadge span{font-size:12px;font-weight:600;color:var(--mu)}.sbadge b{font-size:18px;color:#fff;background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 60%,#000));padding:2px 14px;border-radius:99px}.sbadge small{margin-left:auto}
.cl{position:relative;background:linear-gradient(135deg,var(--bs),transparent 85%),var(--card);border:1px solid var(--ln);box-shadow:0 6px 16px -12px #000}
.cl .br{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cl b{font-size:15px;margin:2px 0}
.tod{box-shadow:0 0 0 2px color-mix(in srgb,var(--br) 55%,transparent),var(--sh)}
h4{color:var(--mu);font-weight:800}
.top h2{font-size:23px}
.hero{background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 45%,#0b1b4a))}
.hero::before{content:"";position:absolute;left:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:color-mix(in srgb,var(--ac) 30%,transparent);filter:blur(2px)}
.c{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 100%,#fff 3%),var(--card));border:1px solid var(--ln)}
.chip{border:1px solid var(--ln)}
.up{background:linear-gradient(135deg,var(--ac),#ea580c);box-shadow:0 10px 24px -12px var(--ac)}
.pills{scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pills .b.p{box-shadow:0 8px 18px -8px var(--br)}
@media(min-width:900px){main{padding:22px}.g{gap:16px}}
@media print{header,nav,.b,.x-btn{display:none!important}body{background:#fff;color:#000}}

/* ===== v4 : rattrapage/bilan, calendrier, about, i18n (AR/RTL), son ===== */
html[dir="rtl"]{direction:rtl}
html[dir="rtl"] body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif}
html[dir="rtl"] .cl[style*="border-left"]{border-left:0!important}
.rat{display:flex;gap:8px;align-items:center;background:#fff7ed;border:1px solid #fdba74;border-radius:12px;padding:8px;margin:6px 0;font-size:12px}

.cl.live{box-shadow:0 0 0 2px #f59e0b}
.cl{color:var(--tx)}.cl b{color:var(--mc,inherit)}

#dlg .bad{min-height:1.2em;margin:4px 0 0}

function toast(m,t=''){const e=document.createElement('div');e.className=t;e.textContent=m;$('ts').append(e);setTimeout(()=>e.remove(),3500)}
function beep(n=3){if(localStorage.getItem('eduVault_sound')==='0')return;try{const Ctx=window.AudioContext||window.webkitAudioContext,ctx=new Ctx();let tm=ctx.currentTime;
  for(let i=0;i<n;i++){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(.0001,tm);g.gain.exponentialRampToValueAtTime(.3,tm+.02);g.gain.exponentialRampToValueAtTime(.0001,tm+.25);o.start(tm);o.stop(tm+.3);tm+=.35}
  setTimeout(()=>ctx.close().catch(()=>{}),n*400+300)}catch(e){}}
async function notify(t,b,taskId){
  beep();toast(t+' : '+b);try{navigator.vibrate([200,100,200])}catch(e){}
  try{
    if(!window.Notification||Notification.permission!=='granted')return;
    const reg=navigator.serviceWorker&&navigator.serviceWorker.controller&&await navigator.serviceWorker.getRegistration().catch(()=>null);
    if(reg&&taskId)reg.showNotification(t,{body:b,tag:'task-'+taskId,data:{taskId},actions:[{action:'done',title:'✅ '+t_('Terminé')}]});
    else new Notification(t,{body:b});
  }catch(e){}
}
const t_=s=>s; /* alias local pour eviter un conflit de nom avec t() dans ce contexte */
const L={};const lib=s=>L[s]||(L[s]=new Promise((ok,ko)=>{const e=document.createElement('script');e.src=s;e.onload=ok;e.onerror=()=>{delete L[s];ko(new Error('Chargement impossible (connexion ?)'))};document.head.append(e)}));
function dlBlob(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.append(a);a.click();a.remove()}
function shrink(f,max=800,qa=.6){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',qa))};im.src=r.result};r.readAsDataURL(f)})}

/* ---------- data ---------- */
function load(o){
  try{Object.assign(A,o||JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
  for(const k of ['modules','tasks','flashcards','timetable','notes','quizQs','quizHist'])if(!Array.isArray(A[k]))A[k]=[];
  A.settings=Object.assign({level:null,currentWeek:'A',weekRef:'',holidays:[]},A.settings);
  if(!Array.isArray(A.settings.holidays))A.settings.holidays=[];
  A.modules.forEach(m=>{
    m.resources=m.resources||[];m.absences=m.absences||0;m.pomo=m.pomo||0;m.color=m.color||'#2563eb';m.coeff=m.coeff||1;
    m.ccc=+m.ccc||0;m.ctp=+m.ctp||0;m.cex=m.cex==null?1:+m.cex;
    m.ncc=m.ncc==null?null:+m.ncc;m.ntp=m.ntp==null?null:+m.ntp;m.nex=m.nex==null?null:+m.nex;m.nrat=m.nrat==null?null:+m.nrat;
    if(m.grade!=null&&m.nex==null&&m.ncc==null&&m.ntp==null){m.nex=+m.grade;m.cex=1;m.ccc=0;m.ctp=0}
    delete m.grade;
  });
  A.flashcards.forEach(f=>{f.efactor=f.efactor||2.5;f.interval=f.interval||0;f.repetition=f.repetition||0;f.nextRev=f.nextRev||Date.now()});
  if(!visSems().includes(A.activeSemester))A.activeSemester=curSem();
}

/* ---------- week A/B + holidays ---------- */
function curWeek(){const s=A.settings,c=s.currentWeek||'A';if(!s.weekRef)return c;const k=Math.round((monday(new Date())-monday(new Date(s.weekRef+'T00:00')))/6048e5);return Math.abs(k)%2===0?c:(c==='A'?'B':'A')}
const isHol=d=>A.settings.holidays.includes(d);
function ranges(){const r=[];[...A.settings.holidays].sort().forEach(d=>{const l=r[r.length-1];if(l){const n=new Date(l[1]+'T00:00');n.setDate(n.getDate()+1);if(iso(n)===d){l[1]=d;return}}r.push([d,d])});return r}

/* ---------- generic form dialog ---------- */
function ask(title,fields,ok){
  const d=$('dlg');
  d.innerHTML=`<form><h3>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.l)}${
    f.t==='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}"${o[0]==f.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:
    f.t==='textarea'?`<textarea name="${f.k}" rows="3"${f.r?' required':''}>${esc(f.v)}</textarea>`:
    `<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}"${f.r?' required':''}${f.a||''}>`}</label>`).join('')}
    <div class="row"><button type="button" class="b" onclick="$('dlg').close()">${tr('Annuler')}</button><button class="b p">${tr('OK')}</button></div></form>`;
  d.querySelector('form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);d.close();ok(Object.fromEntries(fd),fd)};
  d.oncancel=null;d.showModal();
}

/* ---------- views ---------- */
const semBadge=()=>`<div class="sbadge"><span>Semestre en cours</span><b>${curSem()}</b><small>${A.settings.level||''} · modifiable dans Réglages</small></div>`;
const pills=()=>`<div class="pills">${visSems().map(s=>`<button class="b${s===A.activeSemester?' p':''}${s===curSem()?' cur':''}" data-a="sem" data-i="${s}">${s}</button>`).join('')}</div>`;
function banner(){const n=new Date(),t=A.tasks.filter(t=>!t.completed&&new Date(t.dueDate)>n).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate))[0];if(!t)return'';const h=Math.floor((new Date(t.dueDate)-n)/36e5),d=Math.floor(h/24);return`<div class="up" data-a="goAg">⏰ ${t.type==='exam'?'Examen':'Devoir'} : ${esc(t.title)} (${d>0?'dans '+d+' j':h>0?'dans '+h+' h':'très bientôt'})</div>`}
const modCol=id=>A.modules.find(m=>m.id===id)?.color||'var(--br)';
const MPAL=['#2563eb','#059669','#7c3aed','#e11d48','#ea580c','#0d9488','#d97706','#4f46e5','#db2777','#0891b2','#65a30d','#9333ea'];
const nextModColor=()=>MPAL[A.modules.length%MPAL.length];
const tint=c=>`--mc:${c};background:color-mix(in srgb, ${c} 16%, var(--card));border:1px solid color-mix(in srgb, ${c} 35%, transparent);border-left:4px solid ${c}`;
const mAvg=m=>{let t=0,d=0;[['ncc','ccc'],['ntp','ctp'],['nex','cex']].forEach(([n,c])=>{if(m[n]!=null&&m[c]>0){t+=m[n]*m[c];d+=m[c]}});return d?t/d:null};
/* rattrapage : la note de rattrapage remplace la note d'examen si elle donne un meilleur resultat */
function mAvgF(m){const o=mAvg(m);if(o==null||m.nrat==null||!(m.cex>0))return o;
  let t=0,d=0;[['ncc','ccc'],['ntp','ctp']].forEach(([n,c])=>{if(m[n]!=null&&m[c]>0){t+=m[n]*m[c];d+=m[c]}});
  t+=m.nrat*m.cex;d+=m.cex;const r=d?t/d:o;return Math.max(o,r)}
function calcSem(){let t=0,c=0;mods().forEach(m=>{const a=mAvgF(m);if(a!=null){t+=a*(m.coeff||1);c+=m.coeff||1}});return c?(t/c).toFixed(2):'-'}
function semAvgNum(sem){let t=0,c=0;A.modules.filter(m=>m.semester===sem).forEach(m=>{const a=mAvgF(m);if(a!=null){t+=a*(m.coeff||1);c+=m.coeff||1}});return c?t/c:null}

function doSearch2(){
  const k=$('sq').value.trim().toLowerCase(),res=$('s-res');
  if(!k){res.style.display='none';return}

  A.modules.filter(m=>m.name.toLowerCase().includes(k)).forEach(m=>h+=`<div class="cl" data-a="sgo" data-i="mo|${m.semester}">📚 ${esc(m.name)} <small class="mu">${m.semester}</small></div>`);
  A.flashcards.filter(f=>(f.q+' '+f.a).toLowerCase().includes(k)).slice(0,8).forEach(f=>h+=`<div class="cl" data-a="sgo" data-i="fc|${A.modules.find(m=>m.id===f.moduleId)?.semester||A.activeSemester}">🃏 ${esc(f.q)}</div>`);
  A.tasks.filter(t=>t.title.toLowerCase().includes(k)).forEach(t=>h+=`<div class="cl" data-a="sgo" data-i="ag|${A.modules.find(m=>m.id===t.moduleId)?.semester||A.activeSemester}">📝 ${esc(t.title)}</div>`);
  res.innerHTML=h||'<small class="mu">Aucun résultat</small>';res.style.display='block';
}

const fmtMin=m=>m>=60?Math.floor(m/60)+' h'+(m%60?' '+String(m%60).padStart(2,'0'):''):m+' min';
function rDa(){
  const t=Date.now(),n=new Date(),hol=isHol(iso(n)),nm=n.getHours()*60+n.getMinutes(),tm=x=>{const[h,m]=x.split(':');return+h*60+ +m};
  const cls=hol?[]:A.timetable.filter(c=>curIds().has(c.moduleId)&&c.day===TOD()&&(c.week==='all'||c.week===curWeek())).sort((a,b)=>a.startTime.localeCompare(b.startTime));
  const due=A.tasks.filter(x=>curIds().has(x.moduleId)&&!x.completed&&new Date(x.dueDate).getTime()<t+7*864e5).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  const nFc=A.flashcards.filter(f=>curIds().has(f.moduleId)&&(!f.nextRev||f.nextRev<=t)).length,nx=cls.find(c=>tm(c.endTime)>nm);
  const hist=A.quizHist,avgQ=hist.length?Math.round(hist.reduce((s,x)=>s+x.sc/x.n,0)/hist.length*100):null,focus=Math.round(A.modules.reduce((s,m)=>s+(m.pomo||0),0)/60);
  const gr=n.getHours()<12?'Bonjour':n.getHours()<18?'Bon après-midi':'Bonsoir';
  return `<div class="g"><div class="hero"><small>${gr} 👋 · ${n.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})} · Sem. ${curWeek()}</small><b>${hol?'🌴 Vacances aujourd\'hui':nx?(tm(nx.startTime)<=nm?'En cours : ':'Prochain : ')+esc(modName(nx.moduleId)):'Plus de cours aujourd\'hui'}</b>${nx&&!hol?`<small>${esc(nx.startTime)} – ${esc(nx.endTime)} · 📍 ${esc(nx.room)}${tm(nx.startTime)>nm?' · dans '+fmtMin(tm(nx.startTime)-nm):''}</small>`:''}</div>
  <div class="c tod"><h4>📚 Cours du jour</h4>${cls.map(c=>`<div class="cl" data-a="cls" data-i="${c.id}" style="${tint(modCol(c.moduleId))}"><small class="br">${esc(c.startTime)} – ${esc(c.endTime)}</small><b>${esc(modName(c.moduleId))}</b><small class="mu">📍 ${esc(c.room)}</small></div>`).join('')||`<p class="mu e">${hol?'🌴 Vacances aujourd\'hui':'Aucun cours aujourd\'hui'}</p>`}</div>
  <div class="c"><h4>⚠️ Échéances (7 jours)</h4>${due.map(x=>{const h=Math.floor((new Date(x.dueDate)-n)/36e5);return`<div class="cl" data-a="go" data-i="ag" style="${tint(modCol(x.moduleId))}"><small class="br">${h<0?'En retard':h<24?'Dans '+h+' h':'Dans '+Math.floor(h/24)+' j'}</small><b>${x.type==='exam'?'🚨':'📝'} ${esc(x.title)}</b><small class="mu">${esc(modName(x.moduleId))}</small></div>`}).join('')||'<p class="mu e">Rien dans les 7 jours</p>'}</div>
  <div class="c"><h4>🧠 Réviser</h4><div class="e" style="padding:14px"><b style="font-size:30px;color:var(--br)">${nFc}</b><small class="mu">fiche(s) à réviser aujourd'hui</small></div><div class="row" style="justify-content:center"><button class="b" data-a="go" data-i="fc">🃏 Fiches</button><button class="b p" data-a="go" data-i="qz">🧠 Quiz</button></div></div>

function rTT(){
  const nowD=new Date(),nowM=nowD.getHours()*60+nowD.getMinutes(),tmin=x=>{const[h,m]=x.split(':');return+h*60+ +m},wk=curWeek(),ids=mods().map(m=>m.id),tt=A.timetable.filter(c=>ids.includes(c.moduleId)&&(c.week==='all'||c.week===wk));

  days.map(d=>`<div class="c${d===TOD()?' tod':''}"><h4>${d}${d===TOD()?' · aujourd’hui':''}</h4>`+(tt.filter(c=>c.day===d).sort((a,b)=>a.startTime.localeCompare(b.startTime)).map(c=>{
    const n=A.notes.some(x=>x.classId===c.id&&(x.text||(x.photos||[]).length));
    const live=c.day===TOD()&&!isHol(iso(nowD))&&nowM>=tmin(c.startTime)&&nowM<tmin(c.endTime);
    return`<div class="cl${n?' nt':''}${live?' live':''}" data-a="cls" data-i="${c.id}" style="${tint(modCol(c.moduleId))}"><small class="br">${esc(c.startTime)} – ${esc(c.endTime)}${live?' · En cours':''}</small><b>${esc(modName(c.moduleId))}</b><small class="mu">📍 ${esc(c.room)}${n?' 📝':''}</small></div>`}).join('')||`<p class="mu e">${tr('Aucune séance')}</p>`)+'</div>').join('')+'</div>';

/* Vue grille horaire (flexbox : chaque jour contient son propre en-tete + sa piste,
   donc l'alignement en-tete/colonne ne peut pas se decaler, contrairement a une grille CSS implicite) */
function rTTGrid(tt,days,nowD,nowM,tmin){
  if(!tt.length)return `<p class="mu e">${tr('Aucune séance')}</p>`;
  let mn=Math.min(...tt.map(c=>tmin(c.startTime))),mx=Math.max(...tt.map(c=>tmin(c.endTime)));
  mn=Math.max(0,Math.floor(mn/60)*60-30);mx=Math.min(24*60,Math.ceil(mx/60)*60+30);
  const span=Math.max(60,mx-mn),PX=60,H=Math.round(span/60*PX);
  let hours='';for(let h=Math.ceil(mn/60);h<=Math.floor(mx/60);h++)hours+=`<div class="hourlbl" style="top:${Math.round((h*60-mn)/span*H)}px">${String(h).padStart(2,'0')}:00</div>`;
  const cols=days.map(d=>{
    let evs='';
    tt.filter(c=>c.day===d).sort((a,b)=>a.startTime.localeCompare(b.startTime)).forEach(c=>{
      const s=tmin(c.startTime),e=tmin(c.endTime),top=Math.round((s-mn)/span*H),h=Math.max(26,Math.round((e-s)/span*H)),col=modCol(c.moduleId);
      const live=d===TOD()&&!isHol(iso(nowD))&&nowM>=s&&nowM<e,n=A.notes.some(x=>x.classId===c.id&&(x.text||(x.photos||[]).length));
      evs+=`<div class="ev${live?' live':''}" data-a="cls" data-i="${c.id}" style="top:${top}px;height:${h}px;${tint(col)}"><small class="br">${esc(c.startTime)}${h>38?'–'+esc(c.endTime):''}${live?' · ●':''}</small><b>${esc(modName(c.moduleId))}</b>${h>56?`<small class="mu">📍 ${esc(c.room)}${n?' 📝':''}</small>`:''}</div>`;
    });
    return `<div class="daycol2"><div class="gh2${d===TOD()?' today':''}">${d.slice(0,3)}${d===TOD()?' •':''}</div><div class="track" style="height:${H}px">${evs}</div></div>`;
  }).join('');
  return `<div class="gridwrap"><div class="tgrid2"><div class="hourcol2"><div class="gh2">&nbsp;</div><div class="track" style="height:${H}px">${hours}</div></div>${cols}</div></div>`;
}

function rCal(){
  const ids=mods().map(m=>m.id),m0=new Date(calMonth.getFullYear(),calMonth.getMonth(),1),today=iso(new Date());
  const byDay={};A.tasks.filter(x=>ids.includes(x.moduleId)).forEach(x=>{const d=iso(x.dueDate);(byDay[d]=byDay[d]||[]).push(x)});
  const lead=(m0.getDay()+6)%7,days=new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate();
  let cells=`<div class="top" style="margin:0 0 8px"><button class="b" data-a="calNav" data-i="-1">‹</button><b>${m0.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</b><button class="b" data-a="calNav" data-i="1">›</button></div><div class="cal">`;
  cells+=['L','M','M','J','V','S','D'].map(d=>`<div class="cw">${d}</div>`).join('');
  for(let i=0;i<lead;i++)cells+='<div class="cd off"></div>';
  for(let d=1;d<=days;d++){const ds=iso(new Date(m0.getFullYear(),m0.getMonth(),d)),tx=byDay[ds]||[];
    cells+=`<div class="cd${ds===today?' today':''}${tx.length?' has':''}" title="${esc(tx.map(x=>x.title).join(', '))}" data-a="calDay" data-i="${ds}">${d}</div>`}
  cells+='</div>';
  const sel=byDay[lastCalDay]||[];
  return cells+(lastCalDay?`<h4 style="margin-top:14px">${new Date(lastCalDay+'T00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h4>`+(sel.length?sel.map(x=>`<div class="c t${x.type==='exam'?' x':''}"><div><b>${x.type==='exam'?'🚨 ':'📝 '}${esc(x.title)}</b><small class="mu">${esc(modName(x.moduleId))}</small></div></div>`).join(''):`<p class="mu e">${tr('Aucune échéance')}</p>`):'');
}

    <div class="row" style="margin:6px 0;justify-content:space-between;align-items:center"><span class="chip" style="margin:0;font-weight:700${a==null?'':';background:'+(a>=10?'var(--ok)':'var(--er)')+';color:#fff'}">Moy : ${av}/20</span><button class="b" data-a="chhal" data-i="${m.id}" style="padding:4px 8px;font-size:11px">🎯 Note à viser</button></div>
    ${passedByRat?`<span class="badge-ok">✅ ${tr('Admis après rattrapage')}</span>`:''}
    ${a0!=null&&a0<10?`<div class="rat"><span>📘 ${tr('Rattrapage')}</span><input type="number" min="0" max="20" step="0.25" placeholder="-" value="${m.nrat!=null?m.nrat:''}" onchange="act.sRat('${m.id}',this.value)"><small class="mu">/20</small></div>`:''}
    <div class="n3">${inp('ncc','ccc','CC')}${inp('ntp','ctp','TP')}${inp('nex','cex','Examen')}</div>`+
    CATS.map(([k,t])=>{const r=(m.resources||[]).filter(x=>x.type===k);return`<div class="rs"><small class="mu"><b>${t} (${r.length})</b></small>${r.map(x=>`<div>${x.isLocal?`<button class="l" data-a="openRes" data-i="${esc(x.localFileId)}">📄 ${esc(x.title)}</button>`:`<a href="${esc(x.url)}" target="_blank" rel="noopener">🔗 ${esc(x.title)}</a>`}<button class="x-btn" data-a="delRes" data-i="${m.id}|${x.id}" aria-label="Supprimer">✕</button></div>`).join('')}</div>`}).join('')+'</div>'
  }).join(''):`<p class="mu e" style="grid-column:1/-1">Aucun module dans ${A.activeSemester}</p>`;

function rMo(){const sv=calcSem();return pills()+`<div class="top"><div><h2>${tr('Modules & Cours')}</h2><small class="br">Moyenne ${A.activeSemester} : ${sv==='-'?'-':sv+'/20 '+(sv>=10?'✅':'❌')}</small></div><div><button class="b" data-a="recolor" title="${tr('🎨 Varier les couleurs')}">🎨</button><button class="b" data-a="bilan">${tr('📊 Bilan annuel')}</button><button class="b p" data-a="addMod">${tr('+ Module')}</button></div></div><input type="search" placeholder="Filtrer les modules..." value="${esc(q)}" oninput="q=this.value;$('mg').innerHTML=mgrid()" style="margin:0 0 12px"><div class="g" id="mg">${mgrid()}</div>`}

const PM={work:[1500,'Concentration','Travail (25m)'],short:[300,'Pause','Pause (5m)'],long:[900,'Longue pause','Longue (15m)']};
let P={mode:'work',left:1500,total:1500,end:0,t:null,mod:''};
function rPo(){return`<div class="c pm"><div class="row">${Object.keys(PM).map(k=>`<button class="b${P.mode===k?' p':''}" data-a="pmode" data-i="${k}">${PM[k][2]}</button>`).join('')}</div><select id="pms" onchange="P.mod=this.value" style="margin-top:12px"><option value="">Focus libre</option>${mods().map(m=>`<option value="${m.id}"${P.mod===m.id?' selected':''}>${esc(m.name)} (total : ${Math.round((m.pomo||0)/60)} min)</option>`).join('')}</select><div class="ring"><svg viewBox="0 0 100 100" width="220" height="220"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--in)" stroke-width="5"/><circle id="pp" cx="50" cy="50" r="45" fill="none" stroke="var(--br)" stroke-width="5" stroke-linecap="round" stroke-dasharray="283"/></svg><div><b id="pt"></b><small class="mu" id="pl"></small></div></div><div class="row"><button class="b p" id="pb" data-a="ptoggle" style="min-width:56px">▶</button><button class="b" data-a="preset" aria-label="Réinitialiser">↻</button></div></div>`}
function ppaint(){if(!$('pt'))return;$('pt').textContent=String(Math.floor(P.left/60)).padStart(2,'0')+':'+String(P.left%60).padStart(2,'0');$('pl').textContent=PM[P.mode][1];$('pp').style.strokeDashoffset=283-((P.total-P.left)/P.total)*283;$('pb').textContent=P.t?'⏸':'▶'}

  if(!P.left){clearInterval(P.t);P.t=null;P.left=P.total;

let QZ=null,QT=null;const qcfg={mod:'all',n:10,mode:'qcm',timer:false};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const qTimerStop=()=>{clearInterval(QT);QT=null};
function qTimerStart(){qTimerStop();if(!QZ||QZ.done||!qcfg.timer||QZ.res.length>QZ.i||QZ.qs[QZ.i].k!=='qcm')return;QZ.left=20;
  QT=setInterval(()=>{QZ.left--;const e=$('qt');if(e)e.textContent=QZ.left+' s';if(QZ.left<=0)qAnswer('')},1000)}
function qStreak(){const days=new Set(A.quizHist.map(h=>iso(h.d)));let n=0,d=new Date();if(!days.has(iso(d)))d.setDate(d.getDate()-1);while(days.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function qPool(){
  const ids=mods().filter(m=>qcfg.mod==='all'||m.id===qcfg.mod).map(m=>m.id),out=[];
  const allAns=[...new Set(A.flashcards.map(f=>f.a.trim()).filter(Boolean))];
  A.flashcards.filter(f=>ids.includes(f.moduleId)).forEach(f=>{
    const right=f.a.trim(),wrong=shuf(allAns.filter(x=>x!==right)).slice(0,3);
    out.push(qcfg.mode==='qcm'&&wrong.length===3?{k:'qcm',card:f.id,moduleId:f.moduleId,q:f.q,opts:shuf([right,...wrong]),right,exp:''}:{k:'self',card:f.id,moduleId:f.moduleId,q:f.q,right});
  });
  A.quizQs.filter(x=>ids.includes(x.moduleId)).forEach(x=>{const right=x.opts[x.ans];
    out.push(qcfg.mode==='qcm'?{k:'qcm',ai:x.id,moduleId:x.moduleId,q:x.q,opts:shuf(x.opts),right,exp:x.exp||''}:{k:'self',ai:x.id,moduleId:x.moduleId,q:x.q,right:right+(x.exp?' — '+x.exp:'')})});
  return shuf(out).slice(0,qcfg.n);
}
function qStart(list){if(!list.length)return toast('Aucune question : créez des fiches ou un quiz IA','er');
  QZ={qs:list,i:0,sc:0,res:[],pick:null,shown:false,t0:Date.now(),left:20,done:false};qTimerStart();render()}
function qAnswer(txt,selfOk){
  if(!QZ||QZ.res.length>QZ.i)return;const q=QZ.qs[QZ.i],ok=q.k==='self'?!!selfOk:(txt!==''&&txt===q.right);
  QZ.pick=txt;QZ.res.push({q,ok,pick:txt});if(ok)QZ.sc++;qTimerStop();
  const c=q.card&&A.flashcards.find(f=>f.id===q.card);if(c&&!ok){c.nextRev=Date.now();c.repetition=0;c.interval=0}
  save();render();
}
function qFinish(){QZ.done=true;qTimerStop();A.quizHist.push({d:Date.now(),sc:QZ.sc,n:QZ.qs.length,mod:qcfg.mod});A.quizHist=A.quizHist.slice(-60);save();render()}
function rQz(){
  if(QZ&&QZ.done)return qResult();
  if(QZ){if(!QT)qTimerStart();return qPlay()}
  return qHome();
}
function qHome(){

  <div class="st" style="margin-bottom:12px"><div><b>${qStreak()}🔥</b><small class="mu">série (jours)</small></div><div><b>${avgQ==null?'-':avgQ+'%'}</b><small class="mu">moyenne</small></div><div><b>${best==null?'-':best+'%'}</b><small class="mu">meilleur</small></div></div>
  <div class="c"><h4>Nouveau quiz</h4>
  <label>Module<select onchange="qcfg.mod=this.value"><option value="all">Tous les modules</option>${ms.map(m=>`<option value="${m.id}"${qcfg.mod===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
  <label>Mode<select onchange="qcfg.mode=this.value"><option value="qcm"${qcfg.mode==='qcm'?' selected':''}>QCM (4 choix)</option><option value="self"${qcfg.mode==='self'?' selected':''}>Autoévaluation (je me teste)</option></select></label>

  <div class="row"><button class="b p" data-a="qgo">▶ Commencer</button></div></div>

function qPlay(){
  const q=QZ.qs[QZ.i],n=QZ.qs.length,done=QZ.res.length>QZ.i,last=QZ.res[QZ.i];
  let body;
  if(q.k==='qcm')body=q.opts.map((o,i)=>`<button class="opt${done?(o===q.right?' ok':o===QZ.pick?' no':''):''}" data-a="qpick" data-i="${i}"${done?' disabled':''}>${esc(o)}</button>`).join('')+(done?`<p class="${last.ok?'okt':'bad'}">${last.ok?'✅ Bonne réponse !':QZ.pick===''?'⏱ Temps écoulé':'❌ Mauvaise réponse'}</p>`:'');
  else body=QZ.shown?`<div class="rs" style="font-size:14px"><small class="br">RÉPONSE</small>${esc(q.right)}</div>`+(done?`<p class="${last.ok?'okt':'bad'}">${last.ok?'✅ Bien joué !':'📌 À revoir'}</p>`:`<div class="row" style="justify-content:center"><button class="b" data-a="qself" data-i="0">À revoir</button><button class="b p" data-a="qself" data-i="1">Je savais</button></div>`):`<div class="row" style="justify-content:center"><button class="b p" data-a="qshow">Voir la réponse</button></div>`;
  return `<div class="top"><small class="br">Question ${QZ.i+1} / ${n}</small>${qcfg.timer&&q.k==='qcm'&&!done?`<b id="qt" class="br">${QZ.left} s</b>`:''}<button class="b" data-a="qquit" aria-label="Quitter">✕</button></div><div class="bar"><i style="width:${(QZ.i/n)*100}%"></i></div>

  ${done&&q.exp?`<div class="rs" style="font-size:13px">💡 ${esc(q.exp)}</div>`:''}
  ${done?`<div class="row" style="justify-content:center"><button class="b p" data-a="qnext">${QZ.i+1>=n?'Voir le résultat':'Suivant →'}</button></div>`:''}</div>`;
}
function qResult(){
  const n=QZ.qs.length,p=Math.round(QZ.sc/n*100),wrong=QZ.res.filter(r=>!r.ok);
  const msg=p>=90?'Excellent ! 🏆':p>=70?'Très bien 👏':p>=50?'Pas mal, continue 💪':'À retravailler 📚';
  return `<div class="c pm"><h2>${msg}</h2><div style="margin:14px 0"><b style="font-size:56px;color:var(--br)">${p}%</b><small class="mu">${QZ.sc} / ${n} bonnes réponses · ${Math.round((Date.now()-QZ.t0)/1000)} s</small></div>
  ${wrong.length?`<h4>À revoir (${wrong.length})</h4>${wrong.map(r=>`<div class="rs" style="text-align:left;display:block"><b>${esc(r.q.q)}</b><small class="mu">✅ ${esc(r.q.right)}</small></div>`).join('')}`:'<p class="okt">Aucune erreur 🎉</p>'}

}

    <div class="row"><button type="button" class="b" onclick="$('dlg').close()">Annuler</button><button class="b p" name="go">${up?'Créer mon compte':'Se connecter'}</button></div></form>
    ${up?'':'<div class="row" style="justify-content:flex-start;margin-top:4px"><button type="button" class="b" data-a="acForgot">Mot de passe oublié ?</button></div>'}
    <small class="mu" style="margin-top:8px">Ton compte sert à sauvegarder et synchroniser tes données entre tes appareils. L'application reste utilisable sans compte.</small>`;
    $('acf').onsubmit=async e=>{
      e.preventDefault();const f=e.target.elements,em=f.email.value.trim(),pw=f.pw.value,er=$('acerr');er.textContent='';
      if(!em||!pw){er.textContent='Remplis l\'email et le mot de passe';return}
      if(up&&pw.length<8){er.textContent=FBM['auth/weak-password'];return}
      if(up&&pw!==f.pw2.value){er.textContent='Les deux mots de passe sont différents';return}
      f.go.disabled=true;
      try{await fbLoad();
        if(up){const c=await fb.auth.createUserWithEmailAndPassword(em,pw);try{await c.user.sendEmailVerification()}catch(x){}}
        else await fb.auth.signInWithEmailAndPassword(em,pw);
        acEmail='';$('dlg').close();toast(up?'Compte créé ✔ Vérifie ta boîte mail (et les spams)':'Connecté ✔','ok')}
      catch(x){er.textContent=fbMsg(x);f.go.disabled=false}};
  }
  d.oncancel=null;if(!d.open)d.showModal();
}
const askPw=(title,cb)=>ask(title,[{k:'pw',l:'Mot de passe',t:'password',r:1}],v=>cb(v.pw));
Object.assign(act,{
  acct:()=>{acMode='in';acEmail='';acctDlg()},
  acMode:i=>{const f=$('acf');if(f)acEmail=f.elements.email.value;acMode=i;acctDlg()},
  nudgeOff:()=>{LS('eduVault_nudge','1');render()},
  acSync:async()=>{try{await fbLoad();await fbSync()}catch(e){fbErr=fbMsg(e)}toast(fbErr||'Synchronisé ✔',fbErr?'er':'ok');acctDlg()},
  acForgot:async()=>{const f=$('acf'),em=f?f.elements.email.value.trim():'';if(!em)return toast('Écris d\'abord ton email','er');
    try{await fbLoad();await fb.auth.sendPasswordResetEmail(em);toast('Email envoyé : vérifie ta boîte mail (et les spams)','ok')}catch(e){toast(fbMsg(e),'er')}},
  acReset:async()=>{try{await fbLoad();await fb.auth.sendPasswordResetEmail(fbUser.email);toast('Email de changement de mot de passe envoyé','ok')}catch(e){toast(fbMsg(e),'er')}},
  acOut:async()=>{try{await fbSync()}catch(e){}intentional=true;try{await fb.auth.signOut()}catch(e){intentional=false;return toast(fbMsg(e),'er')}$('dlg').close();toast('Déconnecté. Tes données restent dans ton compte.')},
  acWipe:async()=>{if(!confirm('Se déconnecter et effacer toutes les données de cet appareil ? (elles restent dans ton compte)'))return;
    try{await fbSync()}catch(e){}const uid=UID;wipeNext=uid;intentional=true;
    try{await fb.auth.signOut()}catch(e){wipeNext=null;intentional=false;return toast(fbMsg(e),'er')}
    setTimeout(()=>{if(wipeNext===uid){wipeLocal(uid);wipeNext=null}},3000);$('dlg').close();toast('Appareil effacé')},
  acDel:()=>{if(!confirm('Supprimer définitivement ton compte ET toutes tes données dans le cloud ? Cette action est irréversible.'))return;
    $('dlg').close();askPw('Confirme avec ton mot de passe',async pw=>{
      const uid=UID;try{
        await fbLoad();await fbUser.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(fbUser.email,pw));
        await fbDeleteCloud();wipeNext=uid;intentional=true;await fbUser.delete();
        setTimeout(()=>{if(wipeNext===uid){wipeLocal(uid);wipeNext=null}},3000);toast('Compte supprimé','ok')}
      catch(e){wipeNext=null;intentional=false;toast(fbMsg(e),'er')}})}
});
function acctBoot(){
  paintAcct();
  if(UID)fbLoad().catch(()=>{});
  addEventListener('online',()=>{if(UID){if(!fb)fbLoad().catch(()=>{});else fbSchedule(500)}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&fbUser&&(A.updatedAt||0)>(+LS(fbTsKey())||0)){clearTimeout(fbT);fbSync()}});

const fired=new Set();

  if(d>0&&d<=36e5&&!fired.has(t.id+'h')){fired.add(t.id+'h');notify('Rappel : '+t.title,"Échéance dans moins d'une heure !",t.id)}
  if(d>36e5&&d<=864e5&&n.getHours()>=18&&!fired.has(t.id+'d')){fired.add(t.id+'d');notify('Demain : '+t.title,'Révisez ce soir !',t.id)}})}
navigator.serviceWorker&&navigator.serviceWorker.addEventListener('message',e=>{
  if(e.data&&e.data.type==='TASK_DONE'){const task=A.tasks.find(x=>x.id===e.data.id);if(task&&!task.completed){task.completed=true;upd();toast('Marqué comme terminé ✔','ok')}}
});

const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const EMO_SRC='('+Object.keys(EMO).join('|')+')\uFE0F?',EMO_T=new RegExp(EMO_SRC),SKIPN=new Set(['SCRIPT','STYLE','TEXTAREA','OPTION','SELECT','INPUT','TITLE','svg']);
function iconize(root){
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>SKIPN.has(n.parentNode&&n.parentNode.nodeName)||!EMO_T.test(n.nodeValue)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}),list=[];
  while(tw.nextNode())list.push(tw.currentNode);
  list.forEach(n=>{const re=new RegExp(EMO_SRC,'g'),v=n.nodeValue,fr=document.createDocumentFragment();let last=0,m;
    while((m=re.exec(v))){if(m.index>last)fr.append(v.slice(last,m.index));const t=document.createElement('template');t.innerHTML=ic(EMO[m[1]]);fr.append(t.content);last=m.index+m[0].length}
    if(last<v.length)fr.append(v.slice(last));n.replaceWith(fr)});
}
{const pend=new Set();let raf=0;
 new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>pend.add(n)));
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;[...pend].forEach(n=>{if(!n.isConnected)return;if(n.nodeType===3)n=n.parentNode;if(n&&n.nodeType===1)iconize(n)});pend.clear()})
 }).observe(document.body,{childList:true,subtree:true});}

$('fcf').onchange=e=>{const f=e.target.files[0],target=fcTarget;if(!f||!target)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result),cards=Array.isArray(o)?o:Array.isArray(o.cards)?o.cards:null;
    if(!cards)throw 0;let n=0;cards.forEach(c=>{if(c&&c.q&&c.a){A.flashcards.push(newCard({moduleId:target,q:String(c.q),a:String(c.a)}));n++}});
    if(!n)throw 0;upd();toast(n+' fiches importées','ok')}catch(x){toast('Fichier de fiches invalide','er')}};
  r.readAsText(f);e.target.value='';fcTarget=null};

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{
      if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdateToast(reg)})});
    setInterval(()=>reg.update().catch(()=>{}),6*60000);
  }).catch(()=>{});
  let swRefreshing=false;const hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swRefreshing||!hadCtrl)return;swRefreshing=true;location.reload()});
}
function showUpdateToast(reg){
  const e=document.createElement('div');e.style.cssText='cursor:pointer;pointer-events:auto';e.textContent='🔄 '+(LANG()==='ar'?'تحديث جديد متوفر، اضغط للتحديث!':'Mise à jour disponible, touchez pour actualiser.');
  e.onclick=()=>{reg.waiting&&reg.waiting.postMessage({type:'SKIP_WAITING'})};$('ts').append(e);setTimeout(()=>e.remove(),20000);
}
if(!A.settings.level)onboard();
function chkCls(){
  const mins=+(localStorage.getItem('eduVault_clsRem')||10);if(!mins)return;
  const n=new Date();if(isHol(iso(n)))return;
  const nm=n.getHours()*60+n.getMinutes(),ids=curIds(),k=iso(n);
  A.timetable.filter(c=>ids.has(c.moduleId)&&c.day===TOD()&&(c.week==='all'||c.week===curWeek())).forEach(c=>{
    const[h,m]=c.startTime.split(':'),st=+h*60+ +m,key=k+c.id;
    if(st-nm>0&&st-nm<=mins&&!fired.has(key)){fired.add(key);notify(modName(c.moduleId)+' · dans '+(st-nm)+' min','📍 '+(c.room||'')+' · '+c.startTime)}})}
setInterval(()=>{chk();chkCls();if(!document.hidden&&(tab==='da'||tab==='tt'))render()},6e4);chk();chkCls();
