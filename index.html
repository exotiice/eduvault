<style>

.dark{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--ln:#374151;--bs:#1e3a8a66;--in:#374151}
*{box-sizing:border-box;margin:0}
body{font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}

h1{font-size:18px;font-weight:800;color:var(--br)}h2{font-size:17px}h3{margin-bottom:6px}h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:8px}
main{max-width:1000px;margin:auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;font-weight:700;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:19px}nav .on{color:var(--br)}
.b{border:0;border-radius:12px;padding:8px 12px;background:var(--in);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}.p{background:var(--br);color:#fff}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.top>div:last-child{display:flex;gap:6px}
.br{color:var(--br);font-weight:700}.mu{color:var(--mu)}small{font-size:11px;display:block}
.cl{background:var(--bs);border-radius:12px;padding:9px;margin-bottom:8px;cursor:pointer;border:1px solid transparent}.cl.nt{border-color:#f59e0b}.cl b{display:block}
.e{text-align:center;border:1px dashed var(--ln);border-radius:12px;padding:10px;font-size:12px}
.up{background:linear-gradient(90deg,#f59e0b,#ea580c);color:#fff;border-radius:16px;padding:12px;font-weight:700;margin-bottom:12px;cursor:pointer}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.pills .b.p{box-shadow:0 2px 8px #2563eb55}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}.row input{flex:1;min-width:0;margin:0}
.t{display:flex;align-items:center;gap:10px;margin-bottom:8px}.t>div{flex:1}.t.x{border-color:#f87171}.t.d>div{opacity:.5;text-decoration:line-through}.t input{width:18px;margin:0}
.x-btn{border:0;background:none;color:var(--mu);cursor:pointer;font-size:15px}
.rs{background:var(--in);border-radius:12px;padding:8px;margin-top:6px;font-size:12px}.rs div{display:flex;justify-content:space-between;gap:6px;background:var(--card);border-radius:8px;padding:5px 8px;margin-top:4px}.rs a,.rs button.l{color:var(--br);background:none;border:0;font:inherit;text-align:left;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.chip{display:inline-flex;gap:6px;background:var(--in);border-radius:8px;padding:3px 8px;font-size:11px;margin:3px 3px 0 0}
.fc{perspective:900px;height:240px;cursor:pointer}.fi{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}.fc.fl .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:14px;border-radius:16px;border:1px solid var(--ln);background:var(--card);overflow:auto;display:flex;flex-direction:column;justify-content:space-between}
.fb{transform:rotateY(180deg);background:var(--bs);border:2px solid var(--br)}
.pm{max-width:420px;margin:auto;text-align:center}.pm .row{justify-content:center}.ring{position:relative;width:220px;height:220px;margin:18px auto}.ring svg{transform:rotate(-90deg)}.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring b{font-size:44px}
dialog{border:0;border-radius:20px;padding:18px;width:min(440px,94vw);max-height:88vh;background:var(--card);color:var(--tx)}dialog::backdrop{background:#0009}
label{display:block;font-size:12px;font-weight:600;margin:8px 0;color:var(--mu)}
input,select,textarea{width:100%;margin-top:4px;padding:10px;border:0;border-radius:12px;background:var(--in);color:var(--tx);font:inherit}
.ph{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.ph div{position:relative;flex:none}.ph img{width:64px;height:64px;object-fit:cover;border-radius:10px}.ph button{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;border:0;background:var(--er);color:#fff;font-size:11px}
#ts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:6px;pointer-events:none;width:92%;max-width:420px}#ts div{color:#fff;border-radius:99px;padding:9px 14px;font-weight:700;font-size:12px;text-align:center;background:#111827}
#ts .er{background:var(--er)}#ts .ok{background:var(--ok)}
.tod{border-color:var(--br);box-shadow:0 0 0 1px var(--br)}
:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.s-bar{flex:1;position:relative;margin:0 4px;min-width:0}.s-bar input{margin:0;padding:7px 12px;width:100%;border-radius:20px}
#s-res{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--br);border-radius:12px;margin-top:4px;padding:8px;display:none;max-height:60vh;overflow-y:auto;box-shadow:0 10px 25px #0005}
h1{cursor:pointer}.n3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--in);padding:8px;border-radius:12px;margin:0 0 8px;font-size:11px}.n3 label{margin:0}.n3 input{padding:6px;margin-top:2px;background:var(--card)}
input[type=color]{height:42px;padding:3px}
html{color-scheme:light}html.dark{color-scheme:dark}
html[data-th=emerald]{--br:#059669;--bs:#d1fae5}html[data-th=violet]{--br:#7c3aed;--bs:#ede9fe}html[data-th=rose]{--br:#e11d48;--bs:#ffe4e6}html[data-th=orange]{--br:#ea580c;--bs:#ffedd5}html[data-th=slate]{--br:#475569;--bs:#e2e8f0}
html.dark[data-th=emerald]{--bs:#05966a40}html.dark[data-th=violet]{--bs:#7c3aed40}html.dark[data-th=rose]{--bs:#e11d4840}html.dark[data-th=orange]{--bs:#ea580c40}html.dark[data-th=slate]{--br:#94a3b8;--bs:#94a3b833}
.c{box-shadow:0 1px 3px #0000001a}.b{transition:transform .12s,opacity .12s}.b:active{transform:scale(.96)}
nav{overflow-x:auto;gap:2px}nav button{min-width:54px;border-radius:12px}nav .on{background:var(--bs)}
dialog[open]{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@media(prefers-reduced-motion:reduce){dialog[open]{animation:none}.b{transition:none}}
.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--br),#0006);background-color:var(--br);color:#fff;border-radius:18px;padding:16px;display:grid;gap:2px}.hero b{font-size:19px}.hero small{opacity:.9;font-size:12px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0;cursor:pointer}.sw.sel{border-color:var(--tx)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st>div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px;text-align:center}.st b{display:block;font-size:20px;color:var(--br)}
.bar{height:6px;border-radius:9px;background:var(--in);overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--br);transition:width .3s}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;margin-bottom:8px;font:inherit;font-weight:600;cursor:pointer}
.opt:not(:disabled):hover{border-color:var(--br)}.opt.ok{border-color:var(--ok);background:#05966926}.opt.no{border-color:var(--er);background:#dc262626}.opt:disabled{cursor:default;color:var(--tx)}
.okt{color:var(--ok);font-weight:700}.bad{color:var(--er);font-weight:700}
.mh{flex-wrap:wrap;align-items:flex-start}.mh>div:first-child{flex:1 1 140px;min-width:0}.mh>div:last-child{flex-wrap:wrap}.mh b{overflow-wrap:anywhere}
dialog textarea{min-height:140px}
/* ===== design moderne ===== */
:root{--r:20px;--sh:0 10px 30px -16px rgba(15,23,42,.4)}
.dark{--bg:#0a1020;--card:#111a2f;--ln:#1f2b47;--in:#182440;--mu:#94a3b8}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;font-size:15px;letter-spacing:-.005em;
 background:radial-gradient(900px 420px at 50% -140px,color-mix(in srgb,var(--br) 20%,transparent),transparent),var(--bg);background-repeat:no-repeat;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
header{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);padding:10px 14px}
h1{display:flex;align-items:center;gap:8px;font-size:19px;letter-spacing:-.02em}
h1 .ic{width:30px;height:30px;padding:5px;border-radius:10px;background:var(--br);color:#fff;stroke-width:2.1}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
h3{font-size:18px;letter-spacing:-.01em}h4{display:flex;align-items:center;gap:6px;font-size:11.5px}
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
.c{border-radius:var(--r);padding:14px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
@media(hover:hover){.c:hover{transform:translateY(-2px)}}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:9px 14px;border:1px solid var(--ln);background:var(--card)}
.b.p{border-color:transparent;background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 70%,#000));box-shadow:0 8px 18px -8px var(--br)}
.pills .b{padding:7px 16px;border-radius:99px;flex:none}.pills .b.cur::after{content:"";width:6px;height:6px;border-radius:50%;background:#f59e0b;margin-left:2px}
nav{left:50%;right:auto;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(580px,calc(100% - 20px));border:1px solid var(--ln);border-radius:26px;padding:6px;
 background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 18px 44px -14px rgba(0,0,0,.5)}
nav button{padding:7px 2px 6px;font-size:10.5px;border-radius:18px;gap:3px}nav button span{display:flex}nav .ic{width:23px;height:23px}
nav .on{background:var(--bs);color:var(--br)}
.cl{border-radius:14px;padding:11px 12px;transition:filter .12s}.cl:hover{filter:brightness(1.04)}
.x-btn{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;transition:background .12s}.x-btn:hover{background:var(--in)}.x-btn .ic{width:18px;height:18px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 55%,#000))}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;background:#ffffff22}.hero b{font-size:21px;letter-spacing:-.02em}
input,select,textarea{border-radius:14px;border:1px solid transparent;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--br);box-shadow:0 0 0 3px color-mix(in srgb,var(--br) 25%,transparent)}
dialog{border-radius:26px;padding:20px;box-shadow:0 30px 80px -20px #000b}dialog::backdrop{background:#0b122099;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.st>div{border-radius:18px}.opt{border-radius:16px}.fa,.fb{border-radius:20px}
#ts div{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 10px 24px -10px #0008}
.top{margin-bottom:14px}.rs{border-radius:14px}.e{border-radius:14px}

/* ===== v3 : identite visuelle (icone) ===== */
:root{--br:#2f6fe4;--bs:#e6efff;--ac:#f59e0b;--r:22px}
.dark{--bg:#080e1d;--card:#0f1830;--ln:#1b2a4a;--in:#16223f;--bs:#2f6fe42b}
body{background:radial-gradient(1000px 460px at 50% -160px,color-mix(in srgb,var(--br) 26%,transparent),transparent),radial-gradient(500px 300px at 100% 30%,color-mix(in srgb,var(--ac) 7%,transparent),transparent),var(--bg);background-repeat:no-repeat}
h1 .logo{width:32px;height:32px;border-radius:10px;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--br) 70%,#000)}
header{border-bottom:1px solid color-mix(in srgb,var(--ln) 70%,transparent)}
nav{border-radius:28px;padding:6px 8px}
nav .on{background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 62%,#000));color:#fff;box-shadow:0 8px 18px -8px var(--br)}
nav button{transition:background .2s,color .2s,transform .15s}nav button:active{transform:scale(.92)}
nav .ic{fill:none}
.sbadge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;border-radius:18px;background:var(--bs);border:1px solid color-mix(in srgb,var(--br) 28%,transparent)}
.sbadge span{font-size:12px;font-weight:600;color:var(--mu)}.sbadge b{font-size:18px;color:#fff;background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 60%,#000));padding:2px 14px;border-radius:99px}.sbadge small{margin-left:auto}
.cl{position:relative;background:linear-gradient(135deg,var(--bs),transparent 85%),var(--card);border:1px solid var(--ln);box-shadow:0 6px 16px -12px #000}
.cl .br{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cl b{font-size:15px;margin:2px 0}
.tod{box-shadow:0 0 0 2px color-mix(in srgb,var(--br) 55%,transparent),var(--sh)}
h4{color:var(--mu);font-weight:800}
.top h2{font-size:23px}
.hero{background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 45%,#0b1b4a))}
.hero::before{content:"";position:absolute;left:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:color-mix(in srgb,var(--ac) 30%,transparent);filter:blur(2px)}
.c{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 100%,#fff 3%),var(--card));border:1px solid var(--ln)}
.chip{border:1px solid var(--ln)}
.up{background:linear-gradient(135deg,var(--ac),#ea580c);box-shadow:0 10px 24px -12px var(--ac)}
.pills{scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pills .b.p{box-shadow:0 8px 18px -8px var(--br)}
@media(min-width:900px){main{padding:22px}.g{gap:16px}}
@media print{header,nav,.b,.x-btn{display:none!important}body{background:#fff;color:#000}}

/* ===== v4 : rattrapage/bilan, calendrier, about, i18n (AR/RTL), son ===== */
html[dir="rtl"]{direction:rtl}
html[dir="rtl"] body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif}
html[dir="rtl"] .cl[style*="border-left"]{border-left:0!important}
.rat{display:flex;gap:8px;align-items:center;background:#fff7ed;border:1px solid #fdba74;border-radius:12px;padding:8px;margin:6px 0;font-size:12px}
.dark .rat{background:#78350f26;border-color:#b45309}
.rat input{margin:0;padding:6px;width:80px}
.badge-ok{display:inline-block;background:var(--ok);color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .cw{text-align:center;font-size:10px;font-weight:800;color:var(--mu);padding:4px 0}
.cal .cd{aspect-ratio:1;border-radius:10px;background:var(--in);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;position:relative}
.cal .cd.today{box-shadow:0 0 0 2px var(--br)}
.cal .cd.has::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--ac,var(--br))}
.cal .cd.off{opacity:.3;pointer-events:none}
.about a{display:inline-flex;align-items:center;gap:6px;margin:0 10px 6px 0;color:var(--br);text-decoration:none;font-weight:700}
.sheet{text-align:left;white-space:pre-wrap;font-size:13px;line-height:1.6;max-height:50vh;overflow-y:auto;background:var(--in);border-radius:14px;padding:12px}
.cl.live{box-shadow:0 0 0 2px #f59e0b}
.cl{color:var(--tx)}.cl b{color:var(--mc,inherit)}

/* ===== v8 : vue grille horaire (flexbox, pas de CSS Grid -> pas de desalignement) ===== */
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tgrid2{display:flex;align-items:flex-start;min-width:max-content}
.tgrid2 .gh2{height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--mu);position:sticky;top:0;background:var(--bg);z-index:2;white-space:nowrap}
.tgrid2 .gh2.today{color:var(--br)}
.hourcol2{flex:none;width:46px}
.hourcol2 .track{position:relative}
.hourcol2 .hourlbl{position:absolute;right:4px;transform:translateY(-50%);font-size:10px;color:var(--mu);white-space:nowrap}
.daycol2{flex:1 1 0;min-width:148px;border-left:1px solid var(--ln)}
.daycol2 .track{position:relative;background:repeating-linear-gradient(to bottom,transparent,transparent 59px,color-mix(in srgb,var(--ln) 70%,transparent) 60px)}
.tgrid2 .ev{position:absolute;left:3px;right:3px;border-radius:10px;padding:5px 7px;overflow:hidden;font-size:10.5px;line-height:1.25;cursor:pointer;box-shadow:0 2px 6px -2px #0006}
.tgrid2 .ev b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;margin:2px 0}
.tgrid2 .ev.live{box-shadow:0 0 0 2px #f59e0b}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--br);color:#fff;font-size:12px;font-weight:800;line-height:1}
.nudge{grid-column:1/-1;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bs);border:1px solid var(--br);border-radius:16px;padding:10px 12px;font-size:13px}
#dlg .bad{min-height:1.2em;margin:4px 0 0}

dialog{margin:auto}
/* ===== v9 : états vides, statistiques, visite guidée, partage, accessibilité ===== */
.emp{text-align:center;padding:26px 16px;border:1px dashed color-mix(in srgb,var(--br) 40%,var(--ln));border-radius:var(--r);background:color-mix(in srgb,var(--bs) 45%,transparent)}
.emp-i{font-size:38px;line-height:1;margin-bottom:8px;color:var(--br)}.emp-i .ic{width:46px;height:46px}
.emp b{display:block;font-size:17px;letter-spacing:-.01em}.emp p{max-width:38ch;margin:6px auto 0;font-size:13.5px}
.chart text{font:600 10px system-ui,sans-serif;fill:var(--mu)}.chart .v{font-size:10px;fill:var(--tx)}
.chart .ln{stroke:var(--ln);stroke-width:1}.chart .th{stroke:var(--mu);stroke-width:1;stroke-dasharray:3 3}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:6px;align-items:center}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.heat rect{rx:3}
.tour .dots{display:flex;gap:6px;justify-content:center;margin:12px 0 2px}.tour .dots i{width:8px;height:8px;border-radius:50%;background:var(--in)}.tour .dots i.on{background:var(--br);width:22px;border-radius:99px;transition:width .2s}
.tour .big{font-size:46px;text-align:center;margin:6px 0}.tour .big .ic{width:54px;height:54px;color:var(--br)}.tour p{line-height:1.55}
.code{font:800 28px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-align:center;padding:14px 8px;border-radius:16px;background:var(--bs);color:var(--br);user-select:all;direction:ltr}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.warn{background:#fffbeb;border:1px solid #f59e0b;color:#78350f;border-radius:12px;padding:8px 10px;font-size:12px;margin:8px 0}.dark .warn{background:#78350f33;color:#fde68a}
/* cibles tactiles >= 44 px sur téléphone / écran tactile */
@media(pointer:coarse),(max-width:560px){.b{min-height:44px}.x-btn{width:44px;height:44px}nav button{min-height:54px}.pills .b{min-height:44px}.t input[type=checkbox]{width:26px;height:26px}.cal .cd{min-height:42px}.sw{width:44px;height:44px}input:not([type=checkbox]):not([type=color]),select,textarea{min-height:44px}.chip .x-btn{width:36px;height:36px}}
/* mode gros texte */
html.big body{font-size:18.5px;line-height:1.5}html.big small{font-size:14.5px}html.big h4{font-size:13.5px}html.big h2,html.big .top h2{font-size:26px}html.big h3{font-size:21px}
html.big nav button{font-size:12.5px;min-width:64px}html.big nav .ic{width:27px;height:27px}html.big .b{font-size:17px;min-height:48px}html.big .cl b{font-size:17px}html.big label{font-size:14.5px}html.big .chip{font-size:13.5px}
html.big .tgrid2 .ev{font-size:13px}html.big .tgrid2 .ev b{font-size:13.5px}html.big .opt{font-size:17px}html.big .code{font-size:32px}
/* contraste élevé */
html.hc{--mu:#374151;--ln:#6b7280}html.hc.dark{--mu:#d1d5db;--ln:#94a3b8}
html.hc .c,html.hc .cl,html.hc .rs{border-width:2px}html.hc small.mu,html.hc .mu{color:var(--mu)}
html.hc .b.p{background:var(--br);box-shadow:none}html.hc .b.p,html.hc nav .on,html.hc .sbadge b,html.hc .av,html.hc h1 .ic{color:var(--onbr,#fff)}
html.hc nav .on{background:var(--br)}html.hc :focus-visible{outline:4px solid var(--tx);outline-offset:3px}

function mAvgF(m){const o=mAvg(m);if(o==null||m.nrat==null||!(m.cex>0))return o;
  let t=0,d=0;[['ncc','ccc'],['ntp','ctp']].forEach(([n,c])=>{if(m[n]!=null&&m[c]>0){t+=m[n]*m[c];d+=m[c]}});

/* Vue grille horaire (flexbox : chaque jour contient son propre en-tete + sa piste,
   donc l'alignement en-tete/colonne ne peut pas se decaler, contrairement a une grille CSS implicite) */
function rTTGrid(tt,days,nowD,nowM,tmin){
  if(!tt.length)return `<p class="mu e">${tr('Aucune séance')}</p>`;
  let mn=Math.min(...tt.map(c=>tmin(c.startTime))),mx=Math.max(...tt.map(c=>tmin(c.endTime)));
  mn=Math.max(0,Math.floor(mn/60)*60-30);mx=Math.min(24*60,Math.ceil(mx/60)*60+30);
  const span=Math.max(60,mx-mn),PX=60,H=Math.round(span/60*PX);
  let hours='';for(let h=Math.ceil(mn/60);h<=Math.floor(mx/60);h++)hours+=`<div class="hourlbl" style="top:${Math.round((h*60-mn)/span*H)}px">${String(h).padStart(2,'0')}:00</div>`;
  const cols=days.map(d=>{
    let evs='';
    tt.filter(c=>c.day===d).sort((a,b)=>a.startTime.localeCompare(b.startTime)).forEach(c=>{
      const s=tmin(c.startTime),e=tmin(c.endTime),top=Math.round((s-mn)/span*H),h=Math.max(26,Math.round((e-s)/span*H)),col=modCol(c.moduleId);
      const live=d===TOD()&&!isHol(iso(nowD))&&nowM>=s&&nowM<e,n=A.notes.some(x=>x.classId===c.id&&(x.text||(x.photos||[]).length));
      evs+=`<div class="ev${live?' live':''}" data-a="cls" data-i="${c.id}" style="top:${top}px;height:${h}px;${tint(col)}"><small class="br">${esc(c.startTime)}${h>38?'–'+esc(c.endTime):''}${live?' · ●':''}</small><b>${esc(modName(c.moduleId))}</b>${h>56?`<small class="mu">📍 ${esc(c.room)}${n?' 📝':''}</small>`:''}</div>`;
    });
    return `<div class="daycol2"><div class="gh2${d===TOD()?' today':''}">${d.slice(0,3)}${d===TOD()?' •':''}</div><div class="track" style="height:${H}px">${evs}</div></div>`;
  }).join('');
  return `<div class="gridwrap"><div class="tgrid2"><div class="hourcol2"><div class="gh2">&nbsp;</div><div class="track" style="height:${H}px">${hours}</div></div>${cols}</div></div>`;
}

/* ---------- quiz ---------- */
let QZ=null,QT=null;const qcfg={mod:'all',n:10,mode:'qcm',timer:false};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const qTimerStop=()=>{clearInterval(QT);QT=null};
function qTimerStart(){qTimerStop();if(!QZ||QZ.done||!qcfg.timer||QZ.res.length>QZ.i||QZ.qs[QZ.i].k!=='qcm')return;QZ.left=20;
  QT=setInterval(()=>{QZ.left--;const e=$('qt');if(e)e.textContent=QZ.left+' s';if(QZ.left<=0)qAnswer('')},1000)}
function qStreak(){const days=new Set(A.quizHist.map(h=>iso(h.d)));let n=0,d=new Date();if(!days.has(iso(d)))d.setDate(d.getDate()-1);while(days.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function qPool(){
  const ids=mods().filter(m=>qcfg.mod==='all'||m.id===qcfg.mod).map(m=>m.id),out=[];
  const allAns=[...new Set(A.flashcards.map(f=>f.a.trim()).filter(Boolean))];
  A.flashcards.filter(f=>ids.includes(f.moduleId)).forEach(f=>{
    const right=f.a.trim(),wrong=shuf(allAns.filter(x=>x!==right)).slice(0,3);
    out.push(qcfg.mode==='qcm'&&wrong.length===3?{k:'qcm',card:f.id,moduleId:f.moduleId,q:f.q,opts:shuf([right,...wrong]),right,exp:''}:{k:'self',card:f.id,moduleId:f.moduleId,q:f.q,right});
  });
  A.quizQs.filter(x=>ids.includes(x.moduleId)).forEach(x=>{const right=x.opts[x.ans];
    out.push(qcfg.mode==='qcm'?{k:'qcm',ai:x.id,moduleId:x.moduleId,q:x.q,opts:shuf(x.opts),right,exp:x.exp||''}:{k:'self',ai:x.id,moduleId:x.moduleId,q:x.q,right:right+(x.exp?' — '+x.exp:'')})});
  return shuf(out).slice(0,qcfg.n);
}
function qStart(list){if(!list.length)return toast('Aucune question : créez des fiches ou un quiz IA','er');
  QZ={qs:list,i:0,sc:0,res:[],pick:null,shown:false,t0:Date.now(),left:20,done:false};qTimerStart();render()}
function qAnswer(txt,selfOk){
  if(!QZ||QZ.res.length>QZ.i)return;const q=QZ.qs[QZ.i],ok=q.k==='self'?!!selfOk:(txt!==''&&txt===q.right);
  QZ.pick=txt;QZ.res.push({q,ok,pick:txt});if(ok)QZ.sc++;qTimerStop();
  const c=q.card&&A.flashcards.find(f=>f.id===q.card);if(c&&!ok){c.nextRev=Date.now();c.repetition=0;c.interval=0}
  save();render();
}
function qFinish(){QZ.done=true;qTimerStop();logAct('q',QZ.qs.length);A.quizHist.push({d:Date.now(),sc:QZ.sc,n:QZ.qs.length,mod:qcfg.mod});A.quizHist=A.quizHist.slice(-60);save();render()}
function rQz(){
  if(QZ&&QZ.done)return qResult();
  if(QZ){if(!QT)qTimerStart();return qPlay()}
  return qHome();
}
function qHome(){
  const ms=mods(),bank=A.quizQs.filter(x=>ms.some(m=>m.id===x.moduleId)).length,nCards=A.flashcards.filter(f=>ms.some(m=>m.id===f.moduleId)).length;
  const h=A.quizHist,avgQ=h.length?Math.round(h.reduce((s,x)=>s+x.sc/x.n,0)/h.length*100):null,best=h.length?Math.round(Math.max(...h.map(x=>x.sc/x.n))*100):null;
  return pills()+`<div class="top"><div><h2>Quiz</h2><small class="br">${nCards} fiches · ${bank} questions IA (${A.activeSemester})</small></div><div><button class="b" data-a="qgen">✨ Quiz IA</button></div></div>
  <div class="st" style="margin-bottom:12px"><div><b>${qStreak()}🔥</b><small class="mu">série (jours)</small></div><div><b>${avgQ==null?'-':avgQ+'%'}</b><small class="mu">moyenne</small></div><div><b>${best==null?'-':best+'%'}</b><small class="mu">meilleur</small></div></div>
  <div class="c"><h4>Nouveau quiz</h4>
  <label>Module<select onchange="qcfg.mod=this.value"><option value="all">Tous les modules</option>${ms.map(m=>`<option value="${m.id}"${qcfg.mod===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
  <label>Mode<select onchange="qcfg.mode=this.value"><option value="qcm"${qcfg.mode==='qcm'?' selected':''}>QCM (4 choix)</option><option value="self"${qcfg.mode==='self'?' selected':''}>Autoévaluation (je me teste)</option></select></label>
  <label>Nombre de questions<select onchange="qcfg.n=+this.value">${[5,10,20].map(n=>`<option${qcfg.n===n?' selected':''}>${n}</option>`).join('')}</select></label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0" ${qcfg.timer?'checked':''} onchange="qcfg.timer=this.checked"> Chrono de 20 s par question (QCM)</label>
  <div class="row"><button class="b p" data-a="qgo">▶ Commencer</button></div></div>
  ${h.length?`<div class="c" style="margin-top:12px"><h4>Derniers résultats</h4>${h.slice(-5).reverse().map(x=>`<div class="cl" style="cursor:default"><b>${Math.round(x.sc/x.n*100)}% <span class="mu">(${x.sc}/${x.n})</span></b><small class="mu">${new Date(x.d).toLocaleString(LOC())}</small></div>`).join('')}</div>`:''}
  ${bank?`<div class="row" style="justify-content:flex-start"><button class="b" data-a="qclear">🗑 Vider la banque IA</button></div>`:''}`;
}
function qPlay(){
  const q=QZ.qs[QZ.i],n=QZ.qs.length,done=QZ.res.length>QZ.i,last=QZ.res[QZ.i];
  let body;
  if(q.k==='qcm')body=q.opts.map((o,i)=>`<button class="opt${done?(o===q.right?' ok':o===QZ.pick?' no':''):''}" data-a="qpick" data-i="${i}"${done?' disabled':''}>${esc(o)}</button>`).join('')+(done?`<p class="${last.ok?'okt':'bad'}">${last.ok?'✅ Bonne réponse !':QZ.pick===''?'⏱ Temps écoulé':'❌ Mauvaise réponse'}</p>`:'');
  else body=QZ.shown?`<div class="rs" style="font-size:14px"><small class="br">RÉPONSE</small>${esc(q.right)}</div>`+(done?`<p class="${last.ok?'okt':'bad'}">${last.ok?'✅ Bien joué !':'📌 À revoir'}</p>`:`<div class="row" style="justify-content:center"><button class="b" data-a="qself" data-i="0">À revoir</button><button class="b p" data-a="qself" data-i="1">Je savais</button></div>`):`<div class="row" style="justify-content:center"><button class="b p" data-a="qshow">Voir la réponse</button></div>`;
  return `<div class="top"><small class="br">Question ${QZ.i+1} / ${n}</small>${qcfg.timer&&q.k==='qcm'&&!done?`<b id="qt" class="br">${QZ.left} s</b>`:''}<button class="b" data-a="qquit" aria-label="Quitter">✕</button></div><div class="bar"><i style="width:${(QZ.i/n)*100}%"></i></div>
  <div class="c"><small class="mu" style="color:${modCol(q.moduleId)}">● ${esc(modName(q.moduleId))}</small><h3 style="margin:8px 0 12px">${esc(q.q)}</h3>${body}
  ${done&&q.exp?`<div class="rs" style="font-size:13px">💡 ${esc(q.exp)}</div>`:''}
  ${done?`<div class="row" style="justify-content:center"><button class="b p" data-a="qnext">${QZ.i+1>=n?'Voir le résultat':'Suivant →'}</button></div>`:''}</div>`;
}
function qResult(){
  const n=QZ.qs.length,p=Math.round(QZ.sc/n*100),wrong=QZ.res.filter(r=>!r.ok);
  const msg=p>=90?'Excellent ! 🏆':p>=70?'Très bien 👏':p>=50?'Pas mal, continue 💪':'À retravailler 📚';
  return `<div class="c pm"><h2>${msg}</h2><div style="margin:14px 0"><b style="font-size:56px;color:var(--br)">${p}%</b><small class="mu">${QZ.sc} / ${n} bonnes réponses · ${Math.round((Date.now()-QZ.t0)/1000)} s</small></div>
  ${wrong.length?`<h4>À revoir (${wrong.length})</h4>${wrong.map(r=>`<div class="rs" style="text-align:left;display:block"><b>${esc(r.q.q)}</b><small class="mu">✅ ${esc(r.q.right)}</small></div>`).join('')}`:'<p class="okt">Aucune erreur 🎉</p>'}
  <div class="row">${wrong.length?'<button class="b" data-a="qredo">Revoir mes erreurs</button>':''}<button class="b" data-a="qgo">Rejouer</button><button class="b p" data-a="qquit">Terminer</button></div></div>`;
}

  qclear:()=>{if(!confirm('Supprimer toutes les questions générées par IA ?'))return;A.quizQs=[];upd()},
  qgen:()=>{if(needMod())return;
    ask('Quiz par IA',[{k:'moduleId',l:'Module',t:'select',o:modOpts()},{k:'n',l:'Nombre de questions',t:'select',o:[['5','5'],['8','8'],['10','10']],v:'8'},{k:'txt',l:'Texte du cours (copier-coller)',t:'textarea',r:1}],async v=>{
      const prov=localStorage.getItem('eduVault_aiProv')||'gemini',key=aiKey(prov);
      if(!key)return toast("Configurez d'abord l'IA : bouton ✨ IA dans Horaires",'er');

      try{
        const raw=(await aiCall(prov,key,aiModel(prov),[],'Crée '+v.n+' questions QCM en français à partir de ce cours. Réponds STRICTEMENT avec un tableau JSON valide, sans markdown : [{"q":"Question","opts":["A","B","C","D"],"ans":0,"exp":"Courte explication"}] où ans est l\'index (0 à 3) de la bonne proposition et opts contient exactement 4 propositions plausibles.\n\nCours :\n'+v.txt.slice(0,12000))).replace(/<think>[\s\S]*?<\/think>/g,''),a=raw.indexOf('['),b=raw.lastIndexOf(']');
        if(a<0||b<a)throw Error('réponse sans JSON valide');
        const qs=JSON.parse(raw.slice(a,b+1)).filter(x=>x&&x.q&&Array.isArray(x.opts)&&x.opts.length===4&&Number.isInteger(+x.ans)&&+x.ans>=0&&+x.ans<4);
        if(!qs.length)throw Error('aucune question valide');
        qs.forEach(x=>A.quizQs.push({id:uid('q'),moduleId:v.moduleId,q:String(x.q),opts:x.opts.map(String),ans:+x.ans,exp:String(x.exp||'')}));

async function toImages(f){
  if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
    await lib(PDFJS+'min.js');await lib(PDFJS+'worker.min.js').catch(()=>{});pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];
    for(let i=1;i<=Math.min(pdf.numPages,3);i++){const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1.5}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.push(c.toDataURL('image/jpeg',.85))}
    return out}

}
const normDay=s=>{const x=String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return DAYS.find(d=>d.toLowerCase()===x)};
const AI_PROMPT='Extrais l\'emploi du temps de ces images. Réponds STRICTEMENT avec un tableau JSON valide sans markdown : [{"jour":"LUNDI","debut":"08:30","fin":"10:30","matiere":"Nom du module","salle":"Amphi A"}]. Utilise les jours en français (LUNDI, MARDI, MERCREDI, JEUDI, VENDREDI, SAMEDI).';
async function postJSON(url,headers,body){
  let r,j;
  for(let t=1;t<=5;t++){
    r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...headers},body:JSON.stringify(body)});
    j=await r.json().catch(()=>({}));
    if(r.ok||![429,500,503,504].includes(r.status)||t===5)break;
    toast('IA occupée, nouvelle tentative '+t+'/4...');await new Promise(z=>setTimeout(z,t*3000));
  }
  return{ok:r.ok,status:r.status,j};
}
async function aiCall(prov,key,model,imgs,prompt=AI_PROMPT){
  imgs=imgs||[];
  if(prov==='groq'){
    const content=imgs.length?[{type:'text',text:prompt},...imgs.map(u=>({type:'image_url',image_url:{url:u}}))]:prompt;
    const call=m=>postJSON('https://api.groq.com/openai/v1/chat/completions',{Authorization:'Bearer '+key},{model:m,temperature:.1,max_completion_tokens:4096,messages:[{role:'user',content}]});
    let r=await call(model);
    if(!r.ok&&/model|not exist|access/i.test(r.j.error?.message||'')){
      /* modele inconnu pour cette cle : on liste les modeles du compte et on essaie les modeles vision */
      const ml=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+key}}).then(x=>x.json()).catch(()=>({})),
        ids=(ml.data||[]).map(x=>x.id),alt=ids.filter(i=>i!==model&&/llama-4|scout|maverick|vision|-vl|qwen/i.test(i)).slice(0,4);
      for(const m of alt){r=await call(m);if(r.ok){localStorage.setItem('eduVault_aiModel_groq',m);toast('Modèle utilisé : '+m,'ok');break}}
      if(!r.ok)throw Error((r.j.error?.message||'Erreur Groq')+(ids.length?' | Modèles disponibles : '+ids.slice(0,12).join(', '):''));
    }
    if(!r.ok)throw Error(r.j.error?.message||'Erreur Groq HTTP '+r.status);
    return r.j.choices?.[0]?.message?.content||'';
  }
  const r=await postJSON(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{},
    {contents:[{parts:[{text:prompt},...imgs.map(i=>({inline_data:{mime_type:'image/jpeg',data:i.split(',')[1]}}))]}],generationConfig:{temperature:.1}});
  if(!r.ok)throw Error(r.j.error?.message||'Erreur Gemini HTTP '+r.status);
  return(r.j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
}
const hm=t=>{const m=String(t||'').match(/(\d{1,2})\s*[:hH]\s*(\d{2})/);return m?m[1].padStart(2,'0')+':'+m[2]:null};
async function aiImport(v,fd){
  const f=fd.get('file');if(!f||!f.size)return toast('Sélectionnez un document','er');

    upd();toast(added+' séances importées'+(added<ss.length?' ('+(ss.length-added)+' déjà présentes)':'')+' !','ok');

async function syncFiles(){
  let n=0;
  for(const m of A.modules)for(const r of(m.resources||[])){
    if(!r.isLocal||r.driveId||r.skipSync)continue;
    const rec=await fst('get',r.localFileId).catch(()=>null);if(!rec)continue;
    const b=rec.blob||(rec.dataUrl?await(await fetch(rec.dataUrl)).blob():null);if(!b)continue;
    if(b.size>40*1048576){r.skipSync=true;continue}
    const form=new FormData();form.append('metadata',new Blob([JSON.stringify({name:'EduVault - '+m.name+' - '+r.title+' - '+(rec.name||''),mimeType:rec.type||b.type||'application/octet-stream'})],{type:'application/json'}));form.append('file',b);
    const res=await dfetch(GAPI+'upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',body:form});
    if(!res.ok)throw Error("Envoi du fichier '"+r.title+"' impossible");
    r.driveId=(await res.json()).id;n++}
  if(n){A.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}if(UID)fbSchedule(300);else await drvPut(await drvFind())}}

async function drvSync(o={}){
  if(!linked())return;if(!tok){armReconnect();return}
  if(drvBusy){drvQueued=true;return}
  drvBusy=true;paintDrive();
  try{
    if(UID){if(dfOn())await syncFiles();drvErr='';return}
    const f=await drvFind(),dirty=(A.updatedAt||0)>lastTs();

      if(o.force==='down'){if(confirm('Remplacer les données de cet appareil par la sauvegarde Drive du '+new Date(rts).toLocaleString(LOC())+' ?'))applyRemote(rm,rts,f)}
      else if(rts>lastTs()){if(!dirty||!hasData())applyRemote(rm,rts,f);else{mergeRemote(rm);await drvPut(f);toast('Données fusionnées avec Drive ✔','ok')}}
      else{LS('eduVault_remoteMod',f.modifiedTime||'');if(dirty)await drvPut(f)}}
    await syncFiles();drvErr=''}
  catch(e){if(e.code===401){armReconnect()}else drvErr=e instanceof TypeError?'Hors ligne : nouvelle tentative automatique':e.message}
  finally{drvBusy=false;paintDrive();if(drvQueued){drvQueued=false;drvSchedule()}}

  if(!m||!m.e)return true;if(ENC&&ENC.uid===fbUser.uid&&(ENC.s===m.s||ENC.mode==='enabling'))return true;ENC=null;
  try{const r=await kget(fbUser.uid);if(r&&r.s===m.s&&await decStr(r,m.kc,'eduvault:check')==='eduvault-ok'){ENC={uid:fbUser.uid,s:m.s,it:m.it||ENC_IT,kc:m.kc,aes:r.aes,mac:r.mac,mode:'on'};return true}}catch(e){}
  return false}
function encSection(){
  const st=ENCST;
  return `<div class="rs" style="display:block;margin:8px 0"><b>🔐 ${tr('Chiffrement')}</b><small class="mu">${st==='on'?Lg("Actif : tes données sont chiffrées sur ton appareil avant d'être envoyées. Sans ton mot de passe de chiffrement, personne (pas même l'administrateur du projet Firebase) ne peut les lire.",'Active: your data is encrypted on your device before upload. Without your encryption password nobody (not even the Firebase project admin) can read it.','مفعّل: تُشفَّر بياناتك على جهازك قبل إرسالها. بدون كلمة مرور التشفير لا يستطيع أحد قراءتها.'):st==='locked'?Lg('Tes données cloud sont chiffrées : saisis ton mot de passe de chiffrement pour les ouvrir sur cet appareil.','Your cloud data is encrypted: enter your encryption password to open it on this device.','بياناتك مشفرة: أدخل كلمة مرور التشفير لفتحها على هذا الجهاز.'):Lg("Désactivé : tes données sont stockées en clair dans Firebase (protégées uniquement par les règles d'accès).",'Off: your data is stored unencrypted in Firebase (protected only by access rules).','معطل: تُخزَّن بياناتك دون تشفير في Firebase (محمية بقواعد الوصول فقط).')}</small>
  <div class="row" style="justify-content:flex-start;margin:6px 0 0">${st==='on'?`<button class="b" data-a="encOn" data-i="change">${Lg('Changer le mot de passe de chiffrement','Change encryption password','تغيير كلمة مرور التشفير')}</button><button class="b" data-a="encOff">${tr('Désactiver le chiffrement')}</button>`:st==='locked'?`<button class="b p" data-a="encUnlock">${tr('Déverrouiller')}</button><button class="b" data-a="encForgot">${Lg('Mot de passe oublié','Forgot password','نسيت كلمة المرور')}</button>`:`<button class="b p" data-a="encOn">${tr('Activer le chiffrement')}</button>`}</div></div>`}
function encOnDlg(change){
  const d=$('dlg');
  d.innerHTML=`<h3>🔐 ${change?Lg('Nouveau mot de passe de chiffrement','New encryption password','كلمة مرور تشفير جديدة'):tr('Activer le chiffrement')}</h3>
  <p class="mu">${Lg("Tes données seront chiffrées sur cet appareil (AES-256) avant d'être envoyées au cloud. Ce mot de passe est différent de celui de ton compte et n'est jamais envoyé.","Your data will be encrypted on this device (AES-256) before it is sent to the cloud. This password is different from your account password and is never sent.",'ستُشفَّر بياناتك على هذا الجهاز (AES-256) قبل إرسالها. كلمة المرور هذه تختلف عن كلمة مرور حسابك ولا تُرسل أبدا.')}</p>
  <div class="warn">⚠️ ${Lg("Si tu l'oublies, tes données CLOUD sont perdues pour toujours : personne ne peut les récupérer (ni moi, ni Firebase). Les données déjà présentes sur tes appareils restent lisibles.","If you forget it, your CLOUD data is lost forever: nobody can recover it. Data already present on your devices stays readable.",'إذا نسيتها ستضيع بياناتك السحابية إلى الأبد ولا يمكن لأي أحد استرجاعها. البيانات الموجودة على أجهزتك تبقى مقروءة.')}</div>
  <form id="enf" novalidate><label>${Lg('Mot de passe de chiffrement (10 caractères minimum)','Encryption password (10 characters minimum)','كلمة مرور التشفير (10 أحرف على الأقل)')}<input name="p1" type="password" autocomplete="new-password" required minlength="10"></label>
  <label>${Lg('Confirmer','Confirm','تأكيد')}<input name="p2" type="password" autocomplete="new-password" required></label>
  <label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="ok" style="width:auto;margin:3px 0 0"> ${Lg("J'ai compris : sans ce mot de passe, mes données cloud sont irrécupérables.",'I understand: without this password my cloud data cannot be recovered.','فهمت: بدون كلمة المرور لا يمكن استرجاع بياناتي السحابية.')}</label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="rem" checked style="width:auto;margin:0"> ${Lg('Mémoriser sur cet appareil (clé non exportable)','Remember on this device (non-exportable key)','تذكر على هذا الجهاز (مفتاح غير قابل للتصدير)')}</label>
  <p class="bad" id="ener" role="alert"></p><small class="mu">${Lg("Les fichiers (PDF…) et la copie locale sur cet appareil ne sont pas concernés ; les partages par code sont publics par nature.","Files (PDF…) and the local copy on this device are not covered; code shares are public by nature.",'الملفات والنسخة المحلية على هذا الجهاز غير مشمولة؛ والمشاركات بالرمز عامة بطبيعتها.')}</small>
  <div class="row"><button type="button" class="b" onclick="$('dlg').close()">${tr('Annuler')}</button><button class="b p" name="go">${tr('Activer le chiffrement')}</button></div></form>`;
  const f=$('enf');f.onsubmit=async e=>{e.preventDefault();const el=f.elements,er=$('ener');er.textContent='';
    if(el.p1.value.length<10){er.textContent=Lg('10 caractères minimum','10 characters minimum','10 أحرف على الأقل');return}
    if(el.p1.value!==el.p2.value){er.textContent=Lg('Les deux mots de passe sont différents','The two passwords differ','كلمتا المرور مختلفتان');return}
    if(!el.ok.checked){er.textContent=Lg('Coche la case de confirmation','Tick the confirmation box','ضع علامة على مربع التأكيد');return}
    el.go.disabled=true;el.go.textContent=Lg('Calcul de la clé…','Deriving key…','جاري حساب المفتاح…');
    try{await encEnable(el.p1.value,el.rem.checked);$('dlg').close();toast(fbErr||Lg('Chiffrement activé ✔','Encryption enabled ✔','تم تفعيل التشفير ✔'),fbErr?'er':'ok')}
    catch(x){er.textContent=x.message||String(x);el.go.disabled=false;el.go.textContent=tr('Activer le chiffrement')}};
  d.oncancel=null;if(!d.open)d.showModal()}
async function encEnable(pass,remember){
  if(!fbUser||!fb)throw Error(Lg('Connecte-toi d\'abord','Sign in first','سجّل الدخول أولا'));
  const prev=ENC,salt=b64e(crypto.getRandomValues(new Uint8Array(16))),k=await encDerive(pass,salt,ENC_IT),kc=await encStr(k,'eduvault-ok','eduvault:check');
  ENC={uid:fbUser.uid,s:salt,it:ENC_IT,kc,aes:k.aes,mac:k.mac,mode:'enabling'};
  for(let i=0;i<60&&fbBusy;i++)await new Promise(r=>setTimeout(r,200));
  await fbSync({force:'up'});
  if(fbErr||ENC.mode!=='on'){ENC=prev;throw Error(fbErr||Lg('Synchronisation impossible, réessaie','Sync failed, try again','تعذرت المزامنة، أعد المحاولة'))}
  ENC.mode='on';ENCST='on';if(remember)await kput({id:fbUser.uid,s:salt,aes:k.aes,mac:k.mac}).catch(()=>{});else await kdel(fbUser.uid);paintAcct()}
function encUnlockDlg(m){
  if($('dlg').open&&!$('dlg').querySelector('#acf')&&!$('dlg').querySelector('[data-a=acSync]'))return;
  const d=$('dlg');
  d.innerHTML=`<h3>🔐 ${tr('Déverrouiller')}</h3><p class="mu">${Lg('Tes données cloud sont chiffrées. Saisis ton mot de passe de chiffrement (pas celui du compte).','Your cloud data is encrypted. Enter your encryption password (not your account password).','بياناتك السحابية مشفرة. أدخل كلمة مرور التشفير (وليس كلمة مرور الحساب).')}</p>
  <form id="enu" novalidate><label>${Lg('Mot de passe de chiffrement','Encryption password','كلمة مرور التشفير')}<input name="p" type="password" autocomplete="current-password" required></label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="rem" checked style="width:auto;margin:0"> ${Lg('Mémoriser sur cet appareil','Remember on this device','تذكر على هذا الجهاز')}</label><p class="bad" id="enuer" role="alert"></p>
  <div class="row"><button type="button" class="b" data-a="encForgot">${Lg('Mot de passe oublié','Forgot password','نسيت كلمة المرور')}</button><button type="button" class="b" onclick="$('dlg').close()">${Lg('Plus tard','Later','لاحقا')}</button><button class="b p" name="go">${tr('Déverrouiller')}</button></div></form>`;
  const f=$('enu');f.onsubmit=async e=>{e.preventDefault();const el=f.elements,er=$('enuer');er.textContent='';el.go.disabled=true;
    try{const mm=(await fbRef().get()).data()||m,k=await encDerive(el.p.value,mm.s,mm.it||ENC_IT);
      let ok=false;try{ok=(await decStr(k,mm.kc,'eduvault:check'))==='eduvault-ok'}catch(x){}
      if(!ok){er.textContent=Lg('Mot de passe de chiffrement incorrect','Wrong encryption password','كلمة مرور التشفير غير صحيحة');el.go.disabled=false;return}
      ENC={uid:fbUser.uid,s:mm.s,it:mm.it||ENC_IT,kc:mm.kc,aes:k.aes,mac:k.mac,mode:'on'};ENCST='on';fbErr='';
      if(el.rem.checked)await kput({id:fbUser.uid,s:mm.s,aes:k.aes,mac:k.mac}).catch(()=>{});
      $('dlg').close();toast(Lg('Données déverrouillées ✔','Data unlocked ✔','تم فتح البيانات ✔'),'ok');fbSync()}
    catch(x){er.textContent=fbMsg(x);el.go.disabled=false}};
  d.oncancel=null;if(!d.open)d.showModal()}

/* ---------- actions ---------- */
Object.assign(act,{
  stats:()=>{$('dlg').open&&$('dlg').close();stWk=0;go('st')},
  stWk:i=>{stWk=Math.min(0,stWk+(+i));render()},
  tour:()=>tourStart(),

  tourSkip:()=>{LS('eduVault_tour','1');$('dlg').close()},
  shHub:()=>shHub(),shTT:()=>shareTT(),shFc:()=>{$('dlg').open&&$('dlg').close();shareFc()},shJoin:()=>{$('dlg').open&&$('dlg').close();setTimeout(()=>joinAsk(),50)},
  shCopy:i=>{const[c,w]=i.split('|'),t=w==='l'?shLink(c):shFmt(c);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(tr('Copié'),'ok')).catch(()=>{const r=document.createRange();r.selectNodeContents($('shc'));const sl=getSelection();sl.removeAllRanges();sl.addRange(r);toast(Lg('Sélectionné : copie-le manuellement','Selected: copy it manually','تم التحديد: انسخه يدويا'))})},
  shNative:c=>{navigator.share({title:'EduVault',text:Lg('Rejoins ma classe sur EduVault avec le code '+shFmt(c),'Join my class on EduVault with code '+shFmt(c),'انضم إلى قسمي في EduVault بالرمز '+shFmt(c)),url:shLink(c)}).catch(()=>{})},
  shShow:c=>shCodeDlg(c,Lg('Code & lien','Code & link','الرمز والرابط')),
  shUpd:async c=>{const x=(A.settings.shares||[]).find(z=>z.c===c);if(!x||!(await needFb()))return;
    try{let p;if(x.k==='tt'){if(x.sem!==A.activeSemester)return toast(Lg('Passe d\'abord sur le semestre '+x.sem+' (onglet Horaires)','Switch to semester '+x.sem+' first (Timetable tab)','انتقل أولا إلى الفصل '+x.sem),'er');p=ttPayload()}else p=fcPayload((x.ids||[]).filter(id=>A.modules.some(m=>m.id===id)));
      if(x.k==='tt'?!p.t.length:!p.g.length)return toast(Lg('Rien à partager','Nothing to share','لا شيء للمشاركة'),'er');
      await shPublish(x.k,x.n,p,c);toast(Lg('Partage mis à jour ✔','Share updated ✔','تم تحديث المشاركة ✔'),'ok')}catch(e){toast(shErr(e),'er')}},
  shDel:async c=>{if(!confirm(Lg('Arrêter ce partage ? Le code ne fonctionnera plus pour les autres.','Stop this share? The code will stop working for others.','إيقاف هذه المشاركة؟ لن يعمل الرمز مع الآخرين.')))return;
    try{if(await needFb())await fb.db.collection('shares').doc(c).delete();A.settings.shares=(A.settings.shares||[]).filter(x=>x.c!==c);save();shHub()}catch(e){toast(shErr(e),'er')}},
  shSync:c=>{if(confirm(Lg('Mettre à jour les séances importées avec ce code ? (tes modifications sur ces séances seront remplacées)','Update sessions imported with this code? (your edits to those sessions will be replaced)','تحديث الحصص المستوردة بهذا الرمز؟ (ستُستبدل تعديلاتك عليها)')))joinFlow(c)},
  shLeave:c=>{A.settings.joined=(A.settings.joined||[]).filter(x=>x.c!==c);save();shHub()},
  joinGo:()=>{if(!joinCtx)return;const{code,x,p}=joinCtx;let msg;
    try{if(x.k==='tt'){const r=importTT(p,code);msg=Lg(r.add+' séance(s) ajoutée(s)'+(r.removed?', '+r.removed+' retirée(s)':''),r.add+' session(s) added'+(r.removed?', '+r.removed+' removed':''),'أضيفت '+r.add+' حصة'+(r.removed?'، وحُذفت '+r.removed:''))}
      else if(x.k==='fc'){const r=importFc(p);msg=Lg(r.nc+' fiche(s) et '+r.nq+' question(s) importées',r.nc+' card(s) and '+r.nq+' question(s) imported','استُوردت '+r.nc+' بطاقة و '+r.nq+' سؤال')}
      else throw Error('?');
      joinRemember(code,x);joinCtx=null;$('dlg').close();upd();toast(msg,'ok');if(x.k==='tt')go('tt')}catch(e){toast(Lg('Import impossible : partage invalide','Import failed: invalid share','فشل الاستيراد: مشاركة غير صالحة'),'er')}},
  encOn:i=>encOnDlg(i==='change'),
  encUnlock:async()=>{try{const m=(await fbRef().get()).data();if(m&&m.e)encUnlockDlg(m)}catch(e){toast(fbMsg(e),'er')}},
  encOff:async()=>{if(!ENC||!confirm(Lg('Désactiver le chiffrement ? Tes données cloud seront de nouveau stockées en clair.','Disable encryption? Your cloud data will be stored unencrypted again.','تعطيل التشفير؟ ستُخزَّن بياناتك السحابية دون تشفير من جديد.')))return;
    for(let i=0;i<60&&fbBusy;i++)await new Promise(r=>setTimeout(r,200));
    ENC.mode='disabling';await fbSync({force:'up'});if(fbErr||ENC.mode!=='off'){ENC.mode='on';return toast(fbErr||'Erreur','er')}
    ENC=null;ENCST='off';await kdel(fbUser.uid);toast(Lg('Chiffrement désactivé','Encryption disabled','تم تعطيل التشفير'),'ok');acctDlg()},
  encForgot:async()=>{if(!fbUser)return;
    if(!confirm(Lg("Mot de passe oublié : les données CLOUD chiffrées seront effacées définitivement. Les données encore présentes sur cet appareil seront renvoyées sans chiffrement. Continuer ?","Forgot password: the encrypted CLOUD data will be permanently erased. Data still present on this device will be re-uploaded unencrypted. Continue?",'نسيت كلمة المرور: ستُمحى البيانات السحابية المشفرة نهائيا. والبيانات الموجودة على هذا الجهاز ستُرسل من جديد دون تشفير. متابعة؟')))return;
    try{await fbDeleteCloud();ENC=null;ENCST='off';encAsked='';fbErr='';await kdel(fbUser.uid);LS(fbTsKey(),'0');$('dlg').close();await fbSync();toast(Lg('Chiffrement réinitialisé','Encryption reset','تمت إعادة ضبط التشفير'),'ok')}catch(e){toast(fbMsg(e),'er')}}
});

{const _del=fbDeleteCloud;fbDeleteCloud=async function(){try{const q=await fb.db.collection('shares').where('o','==',fbUser.uid).get();const b=fb.db.batch();q.docs.forEach(d=>b.delete(d.ref));if(q.size)await b.commit()}catch(e){}return _del()}}
