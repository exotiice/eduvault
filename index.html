.c{box-shadow:0 1px 3px #0000001a}.b{transition:transform .12s,opacity .12s}.b:active{transform:scale(.96)}

.okt{color:var(--ok);font-weight:700}.bad{color:var(--er);font-weight:700}

/* ===== design moderne ===== */
:root{--r:20px;--sh:0 10px 30px -16px rgba(15,23,42,.4)}
.dark{--bg:#0a1020;--card:#111a2f;--ln:#1f2b47;--in:#182440;--mu:#94a3b8}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;font-size:15px;letter-spacing:-.005em;
 background:radial-gradient(900px 420px at 50% -140px,color-mix(in srgb,var(--br) 20%,transparent),transparent),var(--bg);background-repeat:no-repeat;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
header{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);padding:10px 14px}
h1{display:flex;align-items:center;gap:8px;font-size:19px;letter-spacing:-.02em}
h1 .ic{width:30px;height:30px;padding:5px;border-radius:10px;background:var(--br);color:#fff;stroke-width:2.1}

h3{font-size:18px;letter-spacing:-.01em}h4{display:flex;align-items:center;gap:6px;font-size:11.5px}
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
.c{border-radius:var(--r);padding:14px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
@media(hover:hover){.c:hover{transform:translateY(-2px)}}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:9px 14px;border:1px solid var(--ln);background:var(--card)}
.b.p{border-color:transparent;background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 70%,#000));box-shadow:0 8px 18px -8px var(--br)}
.pills .b{padding:7px 16px;border-radius:99px;flex:none}.pills .b.cur::after{content:"";width:6px;height:6px;border-radius:50%;background:#f59e0b;margin-left:2px}
nav{left:50%;right:auto;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(580px,calc(100% - 20px));border:1px solid var(--ln);border-radius:26px;padding:6px;
 background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 18px 44px -14px rgba(0,0,0,.5)}
nav button{padding:7px 2px 6px;font-size:10.5px;border-radius:18px;gap:3px}nav button span{display:flex}nav .ic{width:23px;height:23px}
nav .on{background:var(--bs);color:var(--br)}
.cl{border-radius:14px;padding:11px 12px;transition:filter .12s}.cl:hover{filter:brightness(1.04)}
.x-btn{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;transition:background .12s}.x-btn:hover{background:var(--in)}.x-btn .ic{width:18px;height:18px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 55%,#000))}

input,select,textarea{border-radius:14px;border:1px solid transparent;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--br);box-shadow:0 0 0 3px color-mix(in srgb,var(--br) 25%,transparent)}

.st>div{border-radius:18px}.opt{border-radius:16px}.fa,.fb{border-radius:20px}

.top{margin-bottom:14px}.rs{border-radius:14px}.e{border-radius:14px}

/* ===== v3 : identite visuelle (icone) ===== */
:root{--br:#2f6fe4;--bs:#e6efff;--ac:#f59e0b;--r:22px}
.dark{--bg:#080e1d;--card:#0f1830;--ln:#1b2a4a;--in:#16223f;--bs:#2f6fe42b}
body{background:radial-gradient(1000px 460px at 50% -160px,color-mix(in srgb,var(--br) 26%,transparent),transparent),radial-gradient(500px 300px at 100% 30%,color-mix(in srgb,var(--ac) 7%,transparent),transparent),var(--bg);background-repeat:no-repeat}
h1 .logo{width:32px;height:32px;border-radius:10px;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--br) 70%,#000)}
header{border-bottom:1px solid color-mix(in srgb,var(--ln) 70%,transparent)}
nav{border-radius:28px;padding:6px 8px}
nav .on{background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 62%,#000));color:#fff;box-shadow:0 8px 18px -8px var(--br)}
nav button{transition:background .2s,color .2s,transform .15s}nav button:active{transform:scale(.92)}
nav .ic{fill:none}
.sbadge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;border-radius:18px;background:var(--bs);border:1px solid color-mix(in srgb,var(--br) 28%,transparent)}
.sbadge span{font-size:12px;font-weight:600;color:var(--mu)}.sbadge b{font-size:18px;color:#fff;background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 60%,#000));padding:2px 14px;border-radius:99px}.sbadge small{margin-left:auto}
.cl{position:relative;background:linear-gradient(135deg,var(--bs),transparent 85%),var(--card);border:1px solid var(--ln);box-shadow:0 6px 16px -12px #000}
.cl .br{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cl b{font-size:15px;margin:2px 0}
.tod{box-shadow:0 0 0 2px color-mix(in srgb,var(--br) 55%,transparent),var(--sh)}
h4{color:var(--mu);font-weight:800}
.top h2{font-size:23px}
.hero{background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 45%,#0b1b4a))}
.hero::before{content:"";position:absolute;left:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:color-mix(in srgb,var(--ac) 30%,transparent);filter:blur(2px)}
.c{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 100%,#fff 3%),var(--card));border:1px solid var(--ln)}
.chip{border:1px solid var(--ln)}
.up{background:linear-gradient(135deg,var(--ac),#ea580c);box-shadow:0 10px 24px -12px var(--ac)}
.pills{scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pills .b.p{box-shadow:0 8px 18px -8px var(--br)}
@media(min-width:900px){main{padding:22px}.g{gap:16px}}
@media print{header,nav,.b,.x-btn{display:none!important}body{background:#fff;color:#000}}

/* ===== v4 : rattrapage/bilan, calendrier, about, i18n (AR/RTL), son ===== */
html[dir="rtl"]{direction:rtl}
html[dir="rtl"] body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif}
html[dir="rtl"] .cl[style*="border-left"]{border-left:0!important}
.rat{display:flex;gap:8px;align-items:center;background:#fff7ed;border:1px solid #fdba74;border-radius:12px;padding:8px;margin:6px 0;font-size:12px}
.dark .rat{background:#78350f26;border-color:#b45309}
.rat input{margin:0;padding:6px;width:80px}
.badge-ok{display:inline-block;background:var(--ok);color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .cw{text-align:center;font-size:10px;font-weight:800;color:var(--mu);padding:4px 0}
.cal .cd{aspect-ratio:1;border-radius:10px;background:var(--in);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;position:relative}
.cal .cd.today{box-shadow:0 0 0 2px var(--br)}
.cal .cd.has::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--ac,var(--br))}
.cal .cd.off{opacity:.3;pointer-events:none}
.about a{display:inline-flex;align-items:center;gap:6px;margin:0 10px 6px 0;color:var(--br);text-decoration:none;font-weight:700}
.sheet{text-align:left;white-space:pre-wrap;font-size:13px;line-height:1.6;max-height:50vh;overflow-y:auto;background:var(--in);border-radius:14px;padding:12px}
.cl.live{box-shadow:0 0 0 2px #f59e0b}
.cl{color:var(--tx)}.cl b{color:var(--mc,inherit)}

.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tgrid2{display:flex;align-items:flex-start;min-width:max-content}
.tgrid2 .gh2{height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--mu);position:sticky;top:0;background:var(--bg);z-index:2;white-space:nowrap}
.tgrid2 .gh2.today{color:var(--br)}
.hourcol2{flex:none;width:46px}
.hourcol2 .track{position:relative}
.hourcol2 .hourlbl{position:absolute;right:4px;transform:translateY(-50%);font-size:10px;color:var(--mu);white-space:nowrap}
.daycol2{flex:1 1 0;min-width:148px;border-left:1px solid var(--ln)}

.nudge{grid-column:1/-1;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bs);border:1px solid var(--br);border-radius:16px;padding:10px 12px;font-size:13px}
#dlg .bad{min-height:1.2em;margin:4px 0 0}

dialog{margin:auto}
/* ===== v9 : états vides, statistiques, visite guidée, partage, accessibilité ===== */
.emp{text-align:center;padding:26px 16px;border:1px dashed color-mix(in srgb,var(--br) 40%,var(--ln));border-radius:var(--r);background:color-mix(in srgb,var(--bs) 45%,transparent)}
.emp-i{font-size:38px;line-height:1;margin-bottom:8px;color:var(--br)}.emp-i .ic{width:46px;height:46px}
.emp b{display:block;font-size:17px;letter-spacing:-.01em}.emp p{max-width:38ch;margin:6px auto 0;font-size:13.5px}
.chart text{font:600 10px system-ui,sans-serif;fill:var(--mu)}.chart .v{font-size:10px;fill:var(--tx)}
.chart .ln{stroke:var(--ln);stroke-width:1}.chart .th{stroke:var(--mu);stroke-width:1;stroke-dasharray:3 3}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:6px;align-items:center}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.heat rect{rx:3}
.tour .dots{display:flex;gap:6px;justify-content:center;margin:12px 0 2px}.tour .dots i{width:8px;height:8px;border-radius:50%;background:var(--in)}.tour .dots i.on{background:var(--br);width:22px;border-radius:99px;transition:width .2s}
.tour .big{font-size:46px;text-align:center;margin:6px 0}.tour .big .ic{width:54px;height:54px;color:var(--br)}.tour p{line-height:1.55}
.code{font:800 28px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-align:center;padding:14px 8px;border-radius:16px;background:var(--bs);color:var(--br);user-select:all;direction:ltr}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.warn{background:#fffbeb;border:1px solid #f59e0b;color:#78350f;border-radius:12px;padding:8px 10px;font-size:12px;margin:8px 0}.dark .warn{background:#78350f33;color:#fde68a}
/* cibles tactiles >= 44 px sur téléphone / écran tactile */
@media(pointer:coarse),(max-width:560px){.b{min-height:44px}.x-btn{width:44px;height:44px}nav button{min-height:54px}.pills .b{min-height:44px}.t input[type=checkbox]{width:26px;height:26px}.cal .cd{min-height:42px}.sw{width:44px;height:44px}input:not([type=checkbox]):not([type=color]),select,textarea{min-height:44px}.chip .x-btn{width:36px;height:36px}}
/* mode gros texte */
html.big body{font-size:18.5px;line-height:1.5}html.big small{font-size:14.5px}html.big h4{font-size:13.5px}html.big h2,html.big .top h2{font-size:26px}html.big h3{font-size:21px}
html.big nav button{font-size:12.5px;min-width:64px}html.big nav .ic{width:27px;height:27px}html.big .b{font-size:17px;min-height:48px}html.big .cl b{font-size:17px}html.big label{font-size:14.5px}html.big .chip{font-size:13.5px}
html.big .tgrid2 .ev{font-size:13px}html.big .tgrid2 .ev b{font-size:13.5px}html.big .opt{font-size:17px}html.big .code{font-size:32px}
/* contraste élevé */
html.hc{--mu:#374151;--ln:#6b7280}html.hc.dark{--mu:#d1d5db;--ln:#94a3b8}
html.hc .c,html.hc .cl,html.hc .rs{border-width:2px}html.hc small.mu,html.hc .mu{color:var(--mu)}
html.hc .b.p{background:var(--br);box-shadow:none}html.hc .b.p,html.hc nav .on,html.hc .sbadge b,html.hc .av,html.hc h1 .ic{color:var(--onbr,#fff)}
html.hc nav .on{background:var(--br)}html.hc :focus-visible{outline:4px solid var(--tx);outline-offset:3px}
@media(forced-colors:active){.b,.c,.cl{border:1px solid CanvasText}.b.p{forced-color-adjust:none;background:Highlight;color:HighlightText}}

/* ===== Réglages v11 : hub de tuiles + pages par section ===== */
dialog:has(.setw){padding:0;width:min(540px,96vw);overflow:hidden}
.setw{max-height:88vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.sethd{position:sticky;top:0;z-index:3;padding:14px 16px 16px;color:#fff;background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 50%,#a855f7));border-radius:0 0 26px 26px;box-shadow:0 14px 30px -20px #000c}
html.hc .sethd{color:var(--onbr,#fff)}
.seth1{display:flex;align-items:center;gap:10px}.seth1 h3{flex:1;margin:0;color:inherit;font-size:19px;letter-spacing:-.01em}
.setx{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ffffff26;color:inherit;font-size:18px;font-weight:800;-webkit-tap-highlight-color:transparent}
.setx:hover{background:#ffffff40}.setx:focus-visible,.tile:focus-visible,.nr:focus-visible{outline:3px solid var(--br);outline-offset:2px}.sethd .setx:focus-visible{outline-color:#fff}
.prof{display:flex;gap:12px;align-items:center;margin-top:14px}
.pav{flex:none;width:56px;height:56px;border-radius:20px;background:#ffffff2e;border:1px solid #ffffff55;display:grid;place-items:center;font:800 24px system-ui,sans-serif;text-transform:uppercase}
.pn{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prof small{display:block;opacity:.9;font-size:11.5px;color:inherit}
.xpbar{height:7px;border-radius:99px;background:#ffffff33;margin:6px 0 3px}.xpbar i{display:block;height:100%;border-radius:99px;background:#fff}
.pbtn{margin-top:12px;width:100%;background:#fff!important;color:#111827!important;border:0!important;box-shadow:0 8px 20px -10px #0008!important}
.setbody{padding:14px 14px 20px;animation:setin .22s ease-out}@keyframes setin{from{opacity:0;transform:translateX(12px)}}
html[dir=rtl] .setbody{animation-name:setinr}@keyframes setinr{from{opacity:0;transform:translateX(-12px)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:12px;padding:14px;min-height:120px;border-radius:22px;background:var(--in);border:1px solid var(--ln);transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset-inline-end:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 22%,transparent),transparent 70%)}
.tile:active{transform:scale(.97)}.tile:hover{box-shadow:0 14px 28px -18px var(--c1);border-color:color-mix(in srgb,var(--c1) 45%,var(--ln))}
.tile b{font-size:14.5px;display:block}.tile small{display:block;color:var(--mu);font-size:11.5px;line-height:1.35;margin-top:2px}
.ti{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:22px;color:#fff;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 18px -10px var(--c1)}
.ti .ic{width:24px;height:24px;color:#fff}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.sh{margin:18px 4px 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:800}
.sg{background:var(--in);border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.sg>label,.sg .sr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;padding:12px 14px;font-weight:700;font-size:13.5px;border-bottom:1px solid var(--ln)}
.sg>label:last-child,.sg>.sr:last-child{border-bottom:0}
.sg>label select,.sg .sr select{width:auto;max-width:56%;min-width:110px;margin:0}
.sg .sr.col{flex-direction:column;align-items:stretch;gap:10px}
.sg label>input[type=checkbox]{margin-inline-start:auto!important;order:2;flex:none}
.sg input[type=checkbox]{-webkit-appearance:none;appearance:none;width:46px!important;height:28px!important;border-radius:99px;background:var(--ln);position:relative;cursor:pointer;transition:background .2s;border:0;padding:0;min-height:0!important}
.sg input[type=checkbox]::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0004;transition:inset-inline-start .2s}
.sg input[type=checkbox]:checked{background:var(--br)}.sg input[type=checkbox]:checked::after{inset-inline-start:21px}.sg input[type=checkbox]:disabled{opacity:.45}
.sg.pad{padding:12px 14px}.sg.pad>*+*{margin-top:10px}.sg.pad>label{padding:0;border:0;justify-content:space-between;color:var(--tx)}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 14px;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-weight:700;font-size:13px;min-height:40px;display:inline-flex;align-items:center}
.seg button.on{background:var(--br);color:var(--onbr,#fff);border-color:transparent}.seg button:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.swr{display:flex;gap:10px;flex-wrap:wrap}
.nr{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-bottom:1px solid var(--ln);-webkit-tap-highlight-color:transparent}
.nr:last-child{border-bottom:0}.nr:hover{background:color-mix(in srgb,var(--br) 7%,transparent)}.nr:active{background:color-mix(in srgb,var(--br) 14%,transparent)}
.nr .ti{width:36px;height:36px;border-radius:12px;font-size:18px}.nr>span:nth-child(2){flex:1;min-width:0}.nr b{display:block;font-size:14px}.nr small{display:block;color:var(--mu);font-size:11.5px}
.chev{width:9px;height:9px;border-top:2.5px solid var(--mu);border-inline-end:2.5px solid var(--mu);transform:rotate(45deg);flex:none;opacity:.7;margin-inline-end:4px}html[dir=rtl] .chev{transform:rotate(-135deg)}
.sg>label,.sg .sr b,.sg.pad>label{color:var(--tx)}.sg label small{font-weight:500}
.setver{text-align:center;color:var(--mu);font-size:11px;margin-top:16px}

/* ===== profils (avatars prêts à choisir) ===== */
.pavx{display:inline-grid;place-items:center;width:var(--s,40px);height:var(--s,40px);border-radius:calc(var(--s,40px)*.34);font-size:calc(var(--s,40px)*.54);line-height:1;color:#fff;flex:none;box-shadow:0 8px 16px -10px #000a;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pavbtn{all:unset;box-sizing:border-box;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}.pavbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.pavbtn::after{content:"✎";position:absolute;inset-inline-end:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:#fff;color:#111827;font-size:11px;display:grid;place-items:center;box-shadow:0 2px 6px #0006}
.pprev{display:grid;place-items:center;margin:8px 0 10px}.pavx img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}.chav{flex:none;width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--in);align-self:flex-end}.chav img{width:100%;height:100%;object-fit:cover;display:block}.pfsh{display:flex;gap:8px;align-items:flex-start;margin:0 0 12px;font-size:12.5px;line-height:1.35}.pfsh input{width:auto;margin-top:2px}.pfbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 12px}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pgrid button{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1;display:grid;place-items:center;font-size:27px;border-radius:16px;background:var(--in);border:2px solid transparent;transition:transform .12s;-webkit-tap-highlight-color:transparent;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pgrid button:hover{transform:scale(1.08)}.pgrid button.on{border-color:var(--br);background:color-mix(in srgb,var(--br) 14%,var(--in))}
.pcols{display:flex;gap:10px;flex-wrap:wrap}.pcols button{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--card)}
.pcols button.on{border-color:var(--tx)}.pgrid button:focus-visible,.pcols button:focus-visible{outline:3px solid var(--br);outline-offset:2px}

/* ===== v13 : cartes intelligentes, priorité, concentration, examen blanc ===== */
.smart{display:flex;flex-direction:column;gap:10px}
.sc{display:flex;gap:12px;padding:13px 14px 13px 18px;border-radius:20px;background:var(--card);border:1px solid var(--ln);position:relative;overflow:hidden}
.sc::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:var(--cc,var(--br))}
.sc.red{--cc:#ef4444;background:color-mix(in srgb,#ef4444 9%,var(--card))}.sc.org{--cc:#f59e0b;background:color-mix(in srgb,#f59e0b 9%,var(--card))}.sc.blu{--cc:#3b82f6}.sc.grn{--cc:#10b981;background:color-mix(in srgb,#10b981 7%,var(--card))}
.sci{font-size:24px;line-height:1.1;flex:none}.scb{flex:1;min-width:0}.scb b{display:block;font-size:14.5px}.scb small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px;line-height:1.45}
.scx{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:10px;color:var(--mu);flex:none}.scx:hover{background:var(--in)}
.pr{display:inline-block;margin-inline-start:6px;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:800;vertical-align:1px}.pr.h{background:#fee2e2;color:#991b1b}.pr.m{background:#fef3c7;color:#92400e}.dark .pr.h{background:#7f1d1d55;color:#fecaca}.dark .pr.m{background:#78350f55;color:#fde68a}
html.fm header,html.fm nav,html.fm .nudge,html.fm .smart,html.fm #ban{display:none!important}
html.fm,html.fm body{background:#05070f!important;color:#e5e7eb}html.fm .c{background:#0b1020;border-color:#1e293b;color:#e5e7eb}html.fm #v{padding-top:8vh}
#fmx{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;z-index:99;padding:12px 22px;border-radius:99px;border:1px solid #334155;background:#0b1020;color:#cbd5e1;font-weight:700;cursor:pointer}
.mkt{font:800 26px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--br)}.mkt.low{color:var(--er)}
.mkbar{height:6px;border-radius:99px;background:var(--in);margin:10px 0}.mkbar i{display:block;height:100%;background:var(--br);border-radius:99px}
.mkgrid{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.mkgrid .b{min-width:40px;padding:8px 10px}.mkgrid .dn{border-color:var(--br)}.mkgrid .fl{outline:2px solid #f59e0b}
.opt.on{border-color:var(--br)!important;background:color-mix(in srgb,var(--br) 14%,var(--card))!important}
.mem{border:1px solid var(--ln);border-radius:14px;padding:10px 12px;background:var(--in);margin-top:8px}.mem pre{white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:6px 0 0}
.msg{display:flex;gap:8px;align-items:flex-end;margin:8px 0}.msg.me{flex-direction:row-reverse}.msg .bub{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--in);font-size:14px;line-height:1.4;word-break:break-word}.msg.me .bub{background:var(--br);color:var(--onbr,#fff)}.msg small{font-size:10.5px;opacity:.7;display:block;margin-bottom:2px}
.chatbox{max-height:46vh;overflow-y:auto;padding:4px}
#vdlg{border:0;border-radius:20px;padding:0;width:min(920px,96vw);max-height:92vh;background:var(--card);color:var(--tx);overflow:hidden;margin:auto}
#vdlg::backdrop{background:#000c}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--ln)}
.vhead b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
.vhead div{display:flex;gap:6px;align-items:center}
.vbody{padding:10px;max-height:80vh;overflow:auto;text-align:center}
.vbody img{max-width:100%;max-height:78vh;display:block;margin:auto;border-radius:10px;object-fit:contain;background:#000}
.vbody canvas{max-width:100%;height:auto;border-radius:8px;background:#fff}
.ph img{cursor:pointer}

/* ===== v14 : Réglages en pages + chat public ===== */
.stpage .sethd{position:relative;margin:0 0 14px;border-radius:26px}
.stpage .setbody{padding:0 0 24px}
.chpage .chbig{max-height:none;height:calc(100vh - 400px);min-height:230px;background:var(--in);border:1px solid var(--ln);border-radius:20px;padding:10px}
.chpage .sethd{position:relative;border-radius:26px;margin-bottom:12px}.chpage .sethd small{display:block;opacity:.92;margin-top:6px;color:inherit}
.chpage .msg .nm{font-weight:800}.chpage .rowbtn{display:inline-grid}

/* ===== v15 : Warm Paper / Minimal Academic (style éditorial façon Notion) ===== */
:root{--bg:#fbf9f5;--card:#ffffff;--tx:#1c1917;--mu:#78716c;--ln:#e7e5e4;--in:#f5f2ec;
 --br:#c2410c;--bs:#fbeee6;--ac:#b45309;--er:#b91c1c;--ok:#15803d;--r:12px;--rs:8px;--sh:none;
 --serif:Newsreader,Lora,Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.dark{--bg:#1a1714;--card:#231f1b;--tx:#f5f1ea;--mu:#a8a29e;--ln:#3a342e;--in:#2d2823;--bs:#c2410c26;--br:#ea6a2a;--ac:#d97706}
html[data-th=terra]{--br:#c2410c;--bs:#fbeee6}html[data-th=amber]{--br:#b45309;--bs:#fbf0dc}
html[data-th=emerald]{--br:#047857;--bs:#e3f3ec}html[data-th=violet]{--br:#6d28d9;--bs:#eee9fa}
html[data-th=rose]{--br:#be123c;--bs:#fbe7ec}html[data-th=slate]{--br:#44403c;--bs:#efece7}
html.dark[data-th=terra]{--br:#ea6a2a;--bs:#c2410c26}html.dark[data-th=amber]{--br:#e0932b;--bs:#b4530926}
html.dark[data-th=emerald]{--br:#34d399;--bs:#04785733}html.dark[data-th=violet]{--br:#a78bfa;--bs:#6d28d933}
html.dark[data-th=rose]{--br:#fb7185;--bs:#be123c33}html.dark[data-th=slate]{--br:#d6d3d1;--bs:#d6d3d122}
/* themes supplementaires */
html[data-th=ocean]{--bg:#f0f7fb;--card:#ffffff;--tx:#0c2230;--mu:#5b7384;--ln:#d9e8f0;--in:#e7f1f7;--br:#0369a1;--bs:#e0f2fe}html.dark[data-th=ocean]{--bg:#0b1620;--card:#12212e;--tx:#e6f1f8;--mu:#8fa7b8;--ln:#22364a;--in:#192c3c;--br:#38bdf8;--bs:#0369a133}
html[data-th=teal]{--br:#0f766e;--bs:#dcf5f1}html.dark[data-th=teal]{--br:#2dd4bf;--bs:#0f766e33}
html[data-th=indigo]{--br:#4338ca;--bs:#e8e9fb}html.dark[data-th=indigo]{--br:#818cf8;--bs:#4338ca33}
html[data-th=forest]{--bg:#f4f7f1;--card:#ffffff;--tx:#1b2a1a;--mu:#66745f;--ln:#dfe7d8;--in:#eaf0e4;--br:#2f7d4b;--bs:#e2f1e6}html.dark[data-th=forest]{--bg:#101612;--card:#18211a;--tx:#e8f2e8;--mu:#9bb09c;--ln:#2a392c;--in:#1f2b21;--br:#6ee7a0;--bs:#2f7d4b33}
html[data-th=sepia]{--bg:#f4ecd8;--card:#fbf5e6;--tx:#3b2f1a;--mu:#7a6a4b;--ln:#e0d3b4;--in:#efe4c9;--br:#8a5a2b;--bs:#f0e0c4}html.dark[data-th=sepia]{--bg:#1d1710;--card:#271f15;--tx:#f1e7d0;--mu:#b3a283;--ln:#3e3322;--in:#31291b;--br:#d9a066;--bs:#8a5a2b33}
html[data-th=lavender]{--bg:#f6f3fb;--card:#ffffff;--tx:#20183a;--mu:#6f6590;--ln:#e4def3;--in:#eee9f8;--br:#7c3aed;--bs:#ede5fd}html.dark[data-th=lavender]{--bg:#14111f;--card:#1c1830;--tx:#efeafc;--mu:#a59cc8;--ln:#2e2850;--in:#241f3e;--br:#b69cff;--bs:#7c3aed33}
html[data-th=sunset]{--bg:#fff7f0;--card:#ffffff;--tx:#2a1710;--mu:#8a6a58;--ln:#f3dfd0;--in:#fbeadd;--br:#e4572e;--bs:#ffe6dc}html.dark[data-th=sunset]{--bg:#1b1210;--card:#251915;--tx:#fbece4;--mu:#c0a090;--ln:#43291f;--in:#30201a;--br:#ff7a59;--bs:#e4572e33}
html[data-th=amoled]{--bg:#f5f5f5;--card:#ffffff;--tx:#111111;--mu:#6b7280;--ln:#e5e5e5;--in:#efefef;--br:#0e7490;--bs:#d9f1f7}html.dark[data-th=amoled]{--bg:#000000;--card:#0b0b0b;--tx:#f5f5f5;--mu:#9ca3af;--ln:#222222;--in:#161616;--br:#22d3ee;--bs:#22d3ee26}
body{font-family:var(--sans);font-size:15px;line-height:1.5;letter-spacing:0;background:var(--bg);background-image:none;-webkit-font-smoothing:antialiased}
h1,h2,h3,.top h2,.emp b,.hero b,.seth1 h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
h1{font-size:21px;color:var(--tx)}h2,.top h2{font-size:26px;font-weight:600}h3{font-size:19px}
h4,.sh{font-family:var(--sans);font-weight:600;letter-spacing:.08em}
/* header / nav : papier plat, filets fins */
header{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:1px solid var(--ln)}
h1 .ic{background:var(--br);border-radius:var(--rs)}h1 .logo{border-radius:var(--rs);box-shadow:none}
nav{left:0;right:0;transform:none;bottom:0;width:auto;border:0;border-top:1px solid var(--ln);border-radius:0;background:var(--bg);
 -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
nav button{border-radius:var(--rs)}
nav .on{background:var(--bs);color:var(--br);box-shadow:none}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
/* cartes : filet 1px, aucune ombre */
.c,.st>div,.sc,.opt,.fa,.fb,.sg,.tile,.mem,.rs,.e,.emp,.chip,.sbadge,.nudge,.rat,.warn,.cl,.sheet,.n3,.code,.seg button{box-shadow:none!important}
.c{background:var(--card);background-image:none;border:1px solid var(--ln);border-radius:var(--r);padding:14px}
@media(hover:hover){.c:hover{transform:none;border-color:color-mix(in srgb,var(--br) 40%,var(--ln))}}
.st>div,.opt,.sc,.sg,.tile,.fa,.fb,.cl,.sheet,.mem{border-radius:var(--r)}
.rs,.e,.chip,.rat,.warn,.n3,.nudge,.sbadge,.code,.cal .cd,.tgrid2 .ev,.ph img,.msg .bub,.chatbox,.chpage .chbig{border-radius:var(--rs)}
.emp{border-radius:var(--r);background:var(--card);border:1px dashed var(--ln)}
/* boutons */
.b{border:1px solid var(--ln);border-radius:var(--rs);background:var(--card);font-weight:600;transition:background .12s,border-color .12s}
.b:hover{background:var(--in)}
.b.p,.b.p:hover{background:var(--br);background-image:none;border-color:var(--br);color:#fff;box-shadow:none}
.b.p:hover{filter:brightness(.94)}
.pills .b{border-radius:var(--rs)}.pills .b.p{box-shadow:none}
.x-btn{border-radius:var(--rs)}
/* champs */
input,select,textarea{background:var(--card);border:1px solid var(--ln);border-radius:var(--rs)}
input:focus,select:focus,textarea:focus{border-color:var(--br);box-shadow:none;outline:2px solid color-mix(in srgb,var(--br) 30%,transparent);outline-offset:0}
.n3 input{background:var(--card)}
/* hero & bandeaux : aplat, plus de dégradé ni de halo */
.hero{background:var(--bs);background-image:none;color:var(--tx);border:1px solid color-mix(in srgb,var(--br) 28%,var(--ln));border-radius:var(--r);padding:18px}
.hero::before,.hero::after,.tile::before{display:none}
.hero b{font-size:22px;color:var(--br)}.hero small{opacity:1;color:var(--mu)}
.up{background:var(--bs);background-image:none;color:var(--tx);border:1px solid color-mix(in srgb,var(--ac) 45%,var(--ln));box-shadow:none;border-radius:var(--r)}
.sbadge{background:var(--bs);border:1px solid var(--ln)}
.sbadge b{background:var(--br);background-image:none;border-radius:var(--rs);color:#fff}
.cl{background:var(--bs);background-image:none;border:1px solid var(--ln)}
.cl.nt{border-color:var(--ac)}.tod{box-shadow:none;border-color:var(--br);outline:1px solid var(--br)}
.chip{background:var(--in)}
/* flashcards, quiz */
.fb{background:var(--bs);border:1px solid var(--br)}.opt{border-width:1px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.opt.no{border-color:var(--er);background:color-mix(in srgb,var(--er) 10%,var(--card))}
/* dialogues & réglages */
dialog{border:1px solid var(--ln);border-radius:var(--r);box-shadow:none;background:var(--card)}
dialog::backdrop{background:#1c191780;-webkit-backdrop-filter:none;backdrop-filter:none}
.sethd{background:var(--bg);background-image:none;color:var(--tx);border:1px solid var(--ln);border-radius:var(--r);box-shadow:none}
html.hc .sethd{color:var(--tx)}
.setx{background:var(--in);color:var(--tx);border-radius:var(--rs)}.setx:hover{background:var(--ln)}.sethd .setx:focus-visible{outline-color:var(--br)}
.pav{background:var(--in);border:1px solid var(--ln);border-radius:var(--rs);color:var(--br)}
.pbtn{background:var(--br)!important;color:#fff!important;box-shadow:none!important;border-radius:var(--rs)}
.xpbar{background:var(--ln)}.xpbar i{background:var(--br)}
.stpage .sethd,.chpage .sethd{border-radius:var(--r)}
.tile{background:var(--card);border:1px solid var(--ln)}.tile:hover{box-shadow:none;border-color:var(--br)}
.ti{background:var(--bs);background-image:none;color:var(--br);box-shadow:none;border-radius:var(--rs)}.ti .ic{color:var(--br)}
.sg{background:var(--card);border-radius:var(--r)}
.sg input[type=checkbox]::after{box-shadow:none}
.seg button{border-radius:var(--rs)}.seg button.on{background:var(--br);color:#fff}
.pavx{border-radius:var(--rs);box-shadow:none}.pgrid button,.pcols button{border-radius:var(--rs)}.pcols button{border-radius:50%}
/* cartes intelligentes */
.sc{background:var(--card)}.sc.red{background:color-mix(in srgb,var(--er) 6%,var(--card))}.sc.org{background:color-mix(in srgb,var(--ac) 7%,var(--card))}.sc.grn{background:color-mix(in srgb,var(--ok) 6%,var(--card))}
.sc::before{width:3px}
/* barres & stats */
.bar,.mkbar{background:var(--in)}.st b,.mkt{font-family:var(--serif);font-weight:600}
.cal .cd{background:var(--in)}.cal .cd.today{box-shadow:none;outline:2px solid var(--br)}
.tgrid2 .ev{box-shadow:none;border:1px solid color-mix(in srgb,#000 12%,transparent)}
.tgrid2 .gh2{background:var(--bg)}
/* toasts & recherche */
#ts div,#tsd div{border-radius:var(--rs);background:var(--tx);color:var(--bg);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#s-res{box-shadow:none;border:1px solid var(--ln);border-radius:var(--r)}
.msg.me .bub{background:var(--br);color:#fff}
/* accent / focus */
:focus-visible{outline:2px solid var(--br)}
.pr.h{background:#fde8e1;color:#9a3412}.pr.m{background:#fbefd5;color:#92400e}
@media print{body{background:#fff}}

/* ===== v16 : notes riches, Kanban, assistant, stats ===== */
.rich{line-height:1.6;overflow-wrap:anywhere}
.rich code{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--in);border:1px solid var(--ln);border-radius:6px;padding:1px 5px}
.rich pre.hl{position:relative;margin:8px 0;padding:12px;background:var(--in);border:1px solid var(--ln);border-radius:var(--rs);overflow-x:auto;text-align:left}
.rich pre.hl code{display:block;background:none;border:0;padding:0;font-size:12.5px;line-height:1.55;white-space:pre}
.hll{position:absolute;top:4px;inset-inline-end:8px;font:600 10px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.rich .rh{font-family:var(--serif);font-size:1.1em;display:block;margin:6px 0 2px}.rich .rli{display:block;padding-inline-start:4px}
.mathd{display:block;overflow-x:auto;margin:6px 0}.rich .katex{font-size:1.05em}.rich code.tex{color:var(--br)}
#ntv{margin:8px 0;padding:12px;background:var(--card);border:1px solid var(--ln);border-radius:var(--rs);max-height:42vh;overflow:auto}
.nbar{justify-content:flex-start!important;margin:8px 0 0}.nbar .b{min-height:36px;padding:5px 10px;font-size:13px}
/* couleurs de syntaxe (thème papier chaud, clair + sombre) */
:root{--h1:#b45309;--h2:#0f766e;--h3:#9a3412;--h4:#6d28d9;--h5:#a8a29e;--h6:#1d4ed8}
.dark{--h1:#f0a050;--h2:#5eead4;--h3:#fdba74;--h4:#c4b5fd;--h5:#78716c;--h6:#93c5fd}
.hljs-keyword,.hljs-built_in,.hljs-literal,.hljs-selector-tag,.hljs-meta .hljs-keyword{color:var(--h1);font-weight:600}
.hljs-string,.hljs-regexp,.hljs-meta .hljs-string,.hljs-template-variable{color:var(--h2)}
.hljs-number,.hljs-symbol,.hljs-bullet,.hljs-variable.constant_{color:var(--h3)}
.hljs-title,.hljs-title.function_,.hljs-section,.hljs-attr,.hljs-attribute{color:var(--h6)}
.hljs-type,.hljs-class .hljs-title,.hljs-title.class_,.hljs-params{color:var(--h4)}
.hljs-comment,.hljs-quote,.hljs-doctag{color:var(--h5);font-style:italic}
.hljs-meta,.hljs-meta-keyword{color:var(--h4)}.hljs-addition{color:var(--ok)}.hljs-deletion{color:var(--er)}
/* Kanban */
.kb{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.kbc{flex:1 0 260px;min-width:260px;background:var(--in);border:1px solid var(--ln);border-radius:var(--r);padding:10px;transition:border-color .12s,background .12s}
.kbc.over{border-color:var(--br);background:var(--bs)}
.kbc h4{display:flex;align-items:center;gap:6px;margin:0 0 8px}.kbn{background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:0 8px;font-size:11px;color:var(--tx)}
.kbl{display:flex;flex-direction:column;gap:8px;min-height:48px}.kbe{margin:0}
.kbk{background:var(--card);border:1px solid var(--ln);border-radius:var(--rs);padding:8px 10px}
.kbk.kbdrag{opacity:.35}.kbg{position:fixed;z-index:200;pointer-events:none;opacity:.95;transform:rotate(1.5deg);border-color:var(--br)}
.kbr{display:flex;align-items:center;gap:6px}.kbt{flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere}
.kbh{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--mu);font-size:18px;line-height:1;padding:6px 4px}.kbh:active{cursor:grabbing}
.kbd{margin:4px 0 0;display:block}.kbf{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px}
.kbm{display:inline-flex;gap:4px}.kbm .b{min-height:32px;padding:2px 12px}.kbm .b:disabled{opacity:.3;cursor:default}
.kbadd{width:100%;margin-top:8px;border-style:dashed;color:var(--mu)}
/* assistant */
.botfab{position:fixed;inset-inline-end:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;width:48px;height:48px;border-radius:var(--r);border:1px solid var(--ln);background:var(--card);font-size:22px;cursor:pointer;display:grid;place-items:center;padding:0}
.botfab:hover{border-color:var(--br)}html.fm .botfab{display:none}
.botd{position:fixed;inset-block:0;inset-inline-end:0;width:min(420px,100vw);z-index:30;background:var(--bg);border-inline-start:1px solid var(--ln);display:flex;flex-direction:column;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.botd[hidden],.botp[hidden]{display:none}
.bothd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--ln)}.bothb{display:flex;gap:2px}
.botl{flex:1;min-height:120px;overflow-y:auto;padding:8px 2px}.botd .botl{max-height:none}
.botf{display:flex;gap:8px;align-items:flex-end}.botf textarea{flex:1;margin:0;resize:none}.botf .b{min-height:44px}
.botn{margin-top:10px;padding:10px;border:1px solid var(--ln);border-radius:var(--r);background:var(--in)}
.botn .botl{max-height:34vh}.botn .bothd{padding-top:0}
.botctx{display:flex;gap:8px;align-items:center;font-size:12px;margin:6px 0;color:var(--mu)}.botctx input{width:auto;margin:0}
.msg .bub .rich{min-width:0}.msg .bub pre.hl{max-width:100%}
@media(min-width:900px){html.botopen body{padding-inline-end:420px}html.botopen .botfab{display:none}}
/* stats par matière */
.sbr{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}.sbn{flex:0 0 38%;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbn i{width:10px;height:10px;border-radius:3px;flex:none}.sbb{flex:1;height:8px;border-radius:99px;background:var(--in);overflow:hidden}.sbb i{display:block;height:100%;border-radius:99px}
.sbr b{flex:none;font-variant-numeric:tabular-nums}
.gcl{max-height:46vh;overflow:auto}.gcl .rs{margin-top:6px}.gcl a.b{text-decoration:none;flex:none;min-height:36px;padding:4px 10px}
nav .kbl_{font-style:normal}
.top .b{white-space:nowrap}

/* ===== v17 : animations, survols, ombres chaudes, petits effets ===== */
:root{--sh1:0 1px 2px rgba(60,40,20,.05),0 6px 18px -10px rgba(120,53,15,.20);
 --sh2:0 2px 4px rgba(60,40,20,.06),0 16px 34px -16px rgba(120,53,15,.32);
 --shb:0 6px 16px -8px color-mix(in srgb,var(--br) 65%,transparent);
 --ease:cubic-bezier(.22,.8,.3,1)}
.dark{--sh1:0 1px 2px rgba(0,0,0,.35),0 8px 20px -12px rgba(0,0,0,.6);--sh2:0 2px 4px rgba(0,0,0,.4),0 18px 36px -16px rgba(0,0,0,.75)}
html{scroll-behavior:smooth}
::selection{background:color-mix(in srgb,var(--br) 28%,transparent)}
body{animation:pagein .5s var(--ease) both}
@keyframes pagein{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes toastin{from{opacity:0;transform:translateY(-12px) scale(.96)}}
@keyframes fade{from{opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--br) 45%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes burst{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--rot))}}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}
/* entrée de page, en cascade (seulement au changement d'onglet) */
#v.enter>*,#v.enter .g>*,#v.enter .smart>*,#v.enter .kbc,#v.enter .st>div,#v.enter .tiles>*{animation:rise .5s var(--ease) both}
#v.enter>:nth-child(2),#v.enter .g>:nth-child(2),#v.enter .smart>:nth-child(2),#v.enter .kbc:nth-child(2),#v.enter .st>:nth-child(2){animation-delay:.05s}
#v.enter>:nth-child(3),#v.enter .g>:nth-child(3),#v.enter .smart>:nth-child(3),#v.enter .kbc:nth-child(3),#v.enter .st>:nth-child(3){animation-delay:.1s}
#v.enter>:nth-child(4),#v.enter .g>:nth-child(4),#v.enter .smart>:nth-child(4){animation-delay:.15s}
#v.enter>:nth-child(5),#v.enter .g>:nth-child(5),#v.enter .smart>:nth-child(5){animation-delay:.2s}
#v.enter>:nth-child(n+6),#v.enter .g>:nth-child(n+6),#v.enter .smart>:nth-child(n+6){animation-delay:.25s}
#v.enter .bar i,#v.enter .xpbar i,#v.enter .sbb i,#v.enter .mkbar i{transform-origin:left;animation:grow .9s var(--ease) .15s both}
html[dir=rtl] #v.enter .bar i,html[dir=rtl] #v.enter .xpbar i,html[dir=rtl] #v.enter .sbb i{transform-origin:right}
/* ombres douces (teintées chaud) au repos */
.c,.st>div,.sc,.tile,.sg,.fa,.opt,.kbk,.mem,.hero,.emp,.up,.cl{box-shadow:var(--sh1)!important}
.kbc{box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
header{transition:box-shadow .25s,background .25s}header.scrolled{box-shadow:0 8px 24px -14px rgba(120,53,15,.35)}
nav{box-shadow:0 -8px 24px -16px rgba(120,53,15,.25)}
.b.p{box-shadow:var(--shb)!important}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--br) 14%,transparent)!important}
dialog{box-shadow:0 30px 70px -24px rgba(60,30,10,.45)!important}
dialog::backdrop{animation:fade .2s ease-out}
#ts div,#tsd div{animation:toastin .3s var(--ease);box-shadow:var(--sh2)!important}
/* survols (souris) + retour au toucher */
.c,.st>div,.cl,.tile,.sc,.opt,.kbk,.fa,.nr,.b,.sw,.pgrid button,.seg button,.x-btn,.chip,.cal .cd,.tgrid2 .ev,.botfab{transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .18s,background .18s,color .18s,filter .18s}
@media(hover:hover){
 .c:hover,.st>div:hover,.tile:hover,.sc:hover,.kbk:hover,.mem:hover{transform:translateY(-3px);box-shadow:var(--sh2)!important;border-color:color-mix(in srgb,var(--br) 45%,var(--ln))}
 .cl:hover{transform:translateY(-2px) scale(1.01);box-shadow:var(--sh2)!important;filter:none}
 .tgrid2 .ev:hover{transform:scale(1.03);z-index:3;box-shadow:var(--sh2)}
 .b:hover{transform:translateY(-1px);box-shadow:var(--sh1)}.b.p:hover{box-shadow:0 10px 22px -8px color-mix(in srgb,var(--br) 75%,transparent)!important}
 .opt:not(:disabled):hover{transform:translateX(4px);box-shadow:var(--sh2)!important}
 .nr:hover{transform:translateX(3px)}html[dir=rtl] .nr:hover{transform:translateX(-3px)}
 .x-btn:hover{transform:scale(1.15) rotate(6deg)}
 .sw:hover,.pgrid button:hover{transform:scale(1.12)}.seg button:hover{transform:translateY(-1px);box-shadow:var(--sh1)}
 .cal .cd:hover{transform:scale(1.08);box-shadow:var(--sh1)}
 .chip:hover{transform:translateY(-1px)}
 nav button:hover{background:var(--bs);color:var(--br)}nav button:hover .ic{transform:translateY(-2px) scale(1.12)}
 h1:hover .logo,h1:hover .ic{animation:wiggle .5s}
 .botfab:hover{transform:scale(1.1) rotate(-6deg);box-shadow:var(--sh2)}
 .hero{position:relative;overflow:hidden}.hero::after{content:"";display:block!important;position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);transition:transform .9s var(--ease);pointer-events:none;width:auto;height:auto;border-radius:0}
 .hero:hover::after{transform:translateX(120%)}
 .fc:hover .fa{box-shadow:var(--sh2)!important}
}
.b:active,.opt:active,.cl:active,.tile:active,.nr:active,.kbk:active{transform:scale(.97)!important}
nav .ic{transition:transform .22s var(--ease)}nav .on .ic{transform:translateY(-1px) scale(1.1)}
h1 .logo,h1 .ic{transition:transform .25s var(--ease)}
/* éléments vivants */
.emp-i{animation:floaty 3.2s ease-in-out infinite;display:inline-block}
.botfab::after{content:"";position:absolute;inset:0;border-radius:inherit;animation:ring 1.8s ease-out 3 1s}
.t input[type=checkbox]{transition:transform .2s var(--ease)}.t input[type=checkbox]:checked{transform:scale(1.15)}
.t>div{transition:opacity .3s,text-decoration-color .3s}
.kbg{box-shadow:0 22px 40px -14px rgba(60,30,10,.5)!important;transform:rotate(2.5deg) scale(1.03)!important}
.kbc.over{box-shadow:inset 0 0 0 2px var(--br),var(--sh1)}
.pr,.badge-ok{animation:rise .4s var(--ease) both}
/* ondulation sur les boutons */
.b{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;width:24px;height:24px;margin:-12px 0 0 -12px;background:currentColor;opacity:.22;pointer-events:none;animation:ripple .6s ease-out forwards}
/* confettis */
.bst{position:fixed;z-index:400;width:8px;height:8px;border-radius:2px;pointer-events:none;animation:burst .9s cubic-bezier(.15,.7,.3,1) forwards}
/* barres de défilement fines */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mu) 45%,transparent) transparent}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== v18 : système de couleurs des modules ===== */
.mono{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:7px;margin-inline-end:9px;font:700 .82em var(--sans);vertical-align:.08em;flex:none}
.mname{display:block;font-weight:700;line-height:1.3}
html[dir=rtl] .cl[style*="border-left"],html[dir=rtl] .c[style*="border-left"],html[dir=rtl] .ev[style*="border-left"]{border-left:1px solid color-mix(in srgb,var(--mb) 24%,var(--ln))!important;border-right:6px solid var(--mb)!important}
.swp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 4px}
.sws{position:relative;aspect-ratio:1;min-height:36px;border-radius:var(--rs);border:2px solid transparent;background:var(--c);cursor:pointer;padding:0;transition:transform .15s var(--ease,ease),box-shadow .15s}
.sws:hover{transform:scale(1.08)}
.sws.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.sws.on::after{content:"";position:absolute;inset:0;margin:auto;width:9px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg);filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.sws.used::before{content:"";position:absolute;top:3px;inset-inline-end:3px;width:7px;height:7px;border-radius:50%;background:#fff;opacity:.9;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.swh{display:block;min-height:1.3em;color:var(--er)}

/* ===== v19 : icônes par format de fichier ===== */
.fr{align-items:center}
.rfb{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:var(--rs);border:1px solid transparent;background:none;text-align:start;text-decoration:none;color:var(--tx);cursor:pointer;font:inherit;transition:background .15s,border-color .15s,box-shadow .15s}
.rfb:hover{background:var(--in);border-color:var(--ln)}
.fx{flex:none;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:20px;line-height:1;background:color-mix(in srgb,var(--fxc,var(--mu)) 14%,var(--card));border:1px solid color-mix(in srgb,var(--fxc,var(--mu)) 30%,var(--ln));background-size:cover;background-position:center;overflow:hidden}
.fx.has{font-size:0}
.fxt{display:flex;flex-direction:column;min-width:0;gap:1px}.fxt b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fxt small{font-size:11px}
.fx-pdf,.fx-yt{--fxc:#dc2626}.fx-doc{--fxc:#2563eb}.fx-xls{--fxc:#16a34a}.fx-ppt{--fxc:#ea580c}.fx-img{--fxc:#9333ea}.fx-code{--fxc:#475569}.fx-zip{--fxc:#a16207}.fx-vid{--fxc:#db2777}.fx-aud{--fxc:#0891b2}.fx-3d{--fxc:#0284c7}.fx-sch{--fxc:#ca8a04}.fx-drv{--fxc:#15803d}.fx-txt{--fxc:#78716c}.fx-file{--fxc:#57534e}.fx-link{--fxc:#c2410c}
.fpv{display:flex;align-items:center;gap:10px;margin:6px 0;padding:8px;border:1px dashed var(--ln);border-radius:var(--rs);background:var(--in)}.fpv .fx{width:34px;height:34px}.fpv small{color:var(--mu)}
.rs button.l.rfb,.rs a.rfb{color:var(--tx);white-space:normal;overflow:visible}
.fxt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;overflow:hidden}

/* ===== v20 : Google Agenda ===== */
.gcst{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--ln);border-radius:var(--rs);background:var(--in)}
.gcr{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:500}.gcr input[type=checkbox]{width:auto;margin:0;flex:none}.gcr input[type=date]{width:auto;margin:0 0 0 6px}

/* ===== v21 ===== */
.rbq{display:block;border-inline-start:3px solid var(--ln);padding-inline-start:10px;color:var(--mu)}.rich a{color:var(--br);text-decoration:underline}.rich hr{border:0;border-top:1px solid var(--ln);margin:10px 0}
/* visionneuse */
.xv{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column}.xv[hidden]{display:none}
html.xvopen{overflow:hidden}
.xvh{display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px) 10px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--ln);background:var(--bg)}
.xvt{flex:1;min-width:0;display:flex;flex-direction:column}.xvt b{font:600 15px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xvt small{color:var(--mu);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xvt small[data-z]:not([data-z=""])::after{content:" · " attr(data-z)}
.xvtl{display:flex;gap:4px}
.xb{min-width:40px;min-height:40px;border:1px solid var(--ln);border-radius:var(--rs);background:var(--card);color:var(--tx);font:600 16px var(--sans);cursor:pointer;display:inline-grid;place-items:center;text-decoration:none;padding:0 8px}
.xb:hover{border-color:var(--br)}
.xvb{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;background:var(--in)}
.xvf{text-align:center;font-size:12px;color:var(--mu);padding:4px 0 calc(6px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--ln)}
.xn{position:absolute;top:50%;z-index:2;width:42px;height:64px;margin-top:-32px;border:1px solid var(--ln);background:color-mix(in srgb,var(--card) 90%,transparent);color:var(--tx);font-size:26px;border-radius:12px;cursor:pointer;opacity:.85}
.xn[hidden]{display:none}.xp{inset-inline-start:6px}.xq{inset-inline-end:6px}
@media(pointer:coarse){.xn{opacity:.55;width:34px}}
.xld{padding:40px 20px;text-align:center;color:var(--mu)}
.xzc{min-height:100%;display:flex;align-items:center;justify-content:center;padding:8px}.xim{max-width:100%;max-height:calc(100vh - 150px);border-radius:8px;background:#000;object-fit:contain}
.xpdf{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px}.xpg{background:#fff;box-shadow:var(--sh1);max-width:none;flex:none}
.xfr{width:100%;height:100%;border:0;background:#fff}
.xdoc{max-width:820px;margin:0 auto;padding:18px 16px;background:var(--card);min-height:100%;text-align:start}.xdoc img{max-width:100%}.xpre{white-space:pre-wrap;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.xtw{overflow:auto;max-width:100%}.xcsv{background:var(--card);min-height:100%}
.xt{border-collapse:collapse;font-size:13px;min-width:100%}.xt th,.xt td{border:1px solid var(--ln);padding:5px 9px;text-align:start;white-space:nowrap}.xt th{background:var(--in);position:sticky;top:0;font-weight:600}
.xdoc .xt td,.xdoc .xt th{white-space:normal}
.xmed{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}.xmi{font-size:64px}.xmed audio{width:min(480px,92%)}.xmed video{max-width:100%;max-height:100%;border-radius:8px;background:#000}
/* dictée & lecture */
.nbar select{min-height:36px;width:auto;margin:0;padding:2px 6px;font-size:12px}
#dictb.rec{background:#fde8e1;border-color:var(--er);animation:ring 1.4s infinite}
.ttsb{position:fixed;inset-inline:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;background:var(--card);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh2);padding:10px 12px;display:flex;flex-direction:column;gap:8px}.ttsb[hidden]{display:none}
.ttst small{color:var(--mu)}#ttsq{font-weight:600;max-height:4.6em;overflow:auto}.ttsc{display:flex;gap:6px;align-items:center;justify-content:center}.ttsc select{width:auto;margin:0;min-height:40px}
/* règles & simulateur */
.rlr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}.rlr input[type=number],.rlr select{width:96px;margin:0}.rlr select{width:auto;max-width:60%}.rlr input[type=checkbox]{width:auto;margin:0}.rlr input:not([type]),.rlr input[maxlength]{flex:1;margin:0}
.simm{border:1px solid var(--ln);border-inline-start:5px solid var(--mb);border-radius:var(--rs);padding:8px 10px;margin:8px 0;background:var(--card)}
.simi{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.simf{display:flex;flex-direction:column;font-size:11px;color:var(--mu);gap:2px}.simf input{width:78px;margin:0;min-height:36px}
.sst{padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--ln)}.s-V,.s-C{background:color-mix(in srgb,var(--ok) 14%,var(--card))}.s-R{background:color-mix(in srgb,var(--ac) 16%,var(--card))}.s-E{background:color-mix(in srgb,var(--er) 14%,var(--card))}
/* import ICS */
.icsl{max-height:52vh}.icsr{display:grid!important;grid-template-columns:1fr;gap:6px;margin-top:6px}.icsr select{margin:0}
/* cartes à trous / images masquées */
.fc .fb div{white-space:pre-line}
.ioc{margin:8px 0}.iob{position:relative;display:block;max-width:100%;line-height:0;border-radius:8px;overflow:hidden;border:1px solid var(--ln)}.iob img{width:100%;height:auto;display:block;max-height:300px;object-fit:contain;background:#fff}
.ioo{position:absolute;inset:0;cursor:crosshair;touch-action:none}
.iom{position:absolute;display:grid;place-items:center;background:#57534e;color:#fff;font:700 14px var(--sans);font-style:normal;border-radius:3px}
.iom.act{background:var(--br)}.ioo .iom{background:color-mix(in srgb,var(--br) 55%,transparent);outline:2px solid var(--br)}
.iom.off{display:none}.iom.rev{background:transparent;outline:3px solid var(--br)}
.fc .iob{margin:6px 0;max-height:200px}.fc .iob img{max-height:200px}

/* ===== v22 : ENIAD ===== */
.top{flex-wrap:wrap}.top>div:last-child{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.enc{display:flex;align-items:center;gap:12px;cursor:pointer;border-inline-start:6px solid var(--br)!important}.enc>span:nth-child(2){flex:1;display:flex;flex-direction:column}.enb{font-size:22px}
.enr{display:flex!important;justify-content:space-between;align-items:center;gap:10px}.enr>span{display:flex;flex-direction:column;min-width:0}
.enl{padding:6px 2px;border-bottom:1px solid var(--ln);font-size:13px;overflow-wrap:anywhere}.enl a{color:var(--tx);text-decoration:none}.enl a:hover{color:var(--br);text-decoration:underline}

function rTTGrid(tt,days,nowD,nowM,tmin){
  if(!tt.length)return `<p class="mu e">${tr('Aucune séance')}</p>`;
  let mn=Math.min(...tt.map(c=>tmin(c.startTime))),mx=Math.max(...tt.map(c=>tmin(c.endTime)));
  mn=Math.max(0,Math.floor(mn/60)*60-30);mx=Math.min(24*60,Math.ceil(mx/60)*60+30);
  const span=Math.max(60,mx-mn),PX=60,H=Math.round(span/60*PX);
  let hours='';for(let h=Math.ceil(mn/60);h<=Math.floor(mx/60);h++)hours+=`<div class="hourlbl" style="top:${Math.round((h*60-mn)/span*H)}px">${String(h).padStart(2,'0')}:00</div>`;
  const cols=days.map(d=>{
    let evs='';
    tt.filter(c=>c.day===d).sort((a,b)=>a.startTime.localeCompare(b.startTime)).forEach(c=>{
      const s=tmin(c.startTime),e=tmin(c.endTime),top=Math.round((s-mn)/span*H),h=Math.max(26,Math.round((e-s)/span*H)),col=modCol(c.moduleId);
      const live=d===TOD()&&!isHol(iso(nowD))&&nowM>=s&&nowM<e,n=A.notes.some(x=>x.classId===c.id&&(x.text||(x.photos||[]).length));
      evs+=`<div class="ev${live?' live':''}" data-a="cls" data-i="${c.id}" style="top:${top}px;height:${h}px;${tint(col)}"><small class="br">${esc(c.startTime)}${h>38?'–'+esc(c.endTime):''}${live?' · ●':''}</small><b>${esc(modName(c.moduleId))}</b>${h>56?`<small class="mu">📍 ${esc(c.room)}${n?' 📝':''}</small>`:''}</div>`;
    });
    return `<div class="daycol2"><div class="gh2${d===TOD()?' today':''}">${d.slice(0,3)}${d===TOD()?' •':''}</div><div class="track" style="height:${H}px">${evs}</div></div>`;
  }).join('');
  return `<div class="gridwrap"><div class="tgrid2"><div class="hourcol2"><div class="gh2">&nbsp;</div><div class="track" style="height:${H}px">${hours}</div></div>${cols}</div></div>`;
}

let QZ=null,QT=null;const qcfg={mod:'all',n:10,mode:'qcm',timer:false};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const qTimerStop=()=>{clearInterval(QT);QT=null};
function qTimerStart(){qTimerStop();if(!QZ||QZ.done||!qcfg.timer||QZ.res.length>QZ.i||QZ.qs[QZ.i].k!=='qcm')return;QZ.left=20;
  QT=setInterval(()=>{QZ.left--;const e=$('qt');if(e)e.textContent=QZ.left+' s';if(QZ.left<=0)qAnswer('')},1000)}
function qStreak(){const days=new Set(A.quizHist.map(h=>iso(h.d)));let n=0,d=new Date();if(!days.has(iso(d)))d.setDate(d.getDate()-1);while(days.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function qPool(){
  const ids=mods().filter(m=>qcfg.mod==='all'||m.id===qcfg.mod).map(m=>m.id),out=[];
  const allAns=[...new Set(A.flashcards.map(f=>f.a.trim()).filter(Boolean))];
  A.flashcards.filter(f=>ids.includes(f.moduleId)).forEach(f=>{
    const right=f.a.trim(),wrong=shuf(allAns.filter(x=>x!==right)).slice(0,3);
    out.push(qcfg.mode==='qcm'&&wrong.length===3?{k:'qcm',card:f.id,moduleId:f.moduleId,q:f.q,opts:shuf([right,...wrong]),right,exp:''}:{k:'self',card:f.id,moduleId:f.moduleId,q:f.q,right});
  });
  A.quizQs.filter(x=>ids.includes(x.moduleId)).forEach(x=>{const right=x.opts[x.ans];
    out.push(qcfg.mode==='qcm'?{k:'qcm',ai:x.id,moduleId:x.moduleId,q:x.q,opts:shuf(x.opts),right,exp:x.exp||''}:{k:'self',ai:x.id,moduleId:x.moduleId,q:x.q,right:right+(x.exp?' — '+x.exp:'')})});
  return shuf(out).slice(0,qcfg.n);
}
function qStart(list){if(!list.length)return toast('Aucune question : créez des fiches ou un quiz IA','er');
  QZ={qs:list,i:0,sc:0,res:[],pick:null,shown:false,t0:Date.now(),left:20,done:false};qTimerStart();render()}
function qAnswer(txt,selfOk){
  if(!QZ||QZ.res.length>QZ.i)return;const q=QZ.qs[QZ.i],ok=q.k==='self'?!!selfOk:(txt!==''&&txt===q.right);
  QZ.pick=txt;QZ.res.push({q,ok,pick:txt});if(ok)QZ.sc++;qTimerStop();
  const c=q.card&&A.flashcards.find(f=>f.id===q.card);if(c&&!ok){c.nextRev=Date.now();c.repetition=0;c.interval=0}
  save();render();
}
function qFinish(){QZ.done=true;qTimerStop();logAct('q',QZ.qs.length);QZ.qs.forEach(q=>logMod(q.moduleId,.5));QZ.res.forEach(r=>{const c=r.q.card&&A.flashcards.find(f=>f.id===r.q.card);if(c)c.lr=Date.now()});A.quizHist.push({d:Date.now(),sc:QZ.sc,n:QZ.qs.length,mod:qcfg.mod});A.quizHist=A.quizHist.slice(-60);save();render()}
function rQz(){
  if(QZ&&QZ.done)return qResult();
  if(QZ){if(!QT)qTimerStart();return qPlay()}
  return qHome();
}
function qHome(){
  const ms=mods(),bank=A.quizQs.filter(x=>ms.some(m=>m.id===x.moduleId)).length,nCards=A.flashcards.filter(f=>ms.some(m=>m.id===f.moduleId)).length;
  const h=A.quizHist,avgQ=h.length?Math.round(h.reduce((s,x)=>s+x.sc/x.n,0)/h.length*100):null,best=h.length?Math.round(Math.max(...h.map(x=>x.sc/x.n))*100):null;
  return pills()+`<div class="top"><div><h2>Quiz</h2><small class="br">${nCards} fiches · ${bank} questions IA (${A.activeSemester})</small></div><div><button class="b" data-a="photo" title="${Lg('Photo → notes + fiches','Photo → notes + cards','صورة ← ملاحظات + بطاقات')}">📸</button><button class="b" data-a="pdfc" title="${Lg('PDF → fiches / quiz','PDF → cards / quiz','PDF ← بطاقات / اختبار')}">📄</button><button class="b" data-a="qgen">✨ Quiz IA</button></div></div>
  <div class="st" style="margin-bottom:12px"><div><b>${qStreak()}🔥</b><small class="mu">série (jours)</small></div><div><b>${avgQ==null?'-':avgQ+'%'}</b><small class="mu">moyenne</small></div><div><b>${best==null?'-':best+'%'}</b><small class="mu">meilleur</small></div></div>
  <div class="c"><h4>Nouveau quiz</h4>
  <label>Module<select onchange="qcfg.mod=this.value"><option value="all">Tous les modules</option>${ms.map(m=>`<option value="${m.id}"${qcfg.mod===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
  <label>Mode<select onchange="qcfg.mode=this.value"><option value="qcm"${qcfg.mode==='qcm'?' selected':''}>QCM (4 choix)</option><option value="self"${qcfg.mode==='self'?' selected':''}>Autoévaluation (je me teste)</option></select></label>
  <label>Nombre de questions<select onchange="qcfg.n=+this.value">${[5,10,20].map(n=>`<option${qcfg.n===n?' selected':''}>${n}</option>`).join('')}</select></label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0" ${qcfg.timer?'checked':''} onchange="qcfg.timer=this.checked"> Chrono de 20 s par question (QCM)</label>
  <div class="row"><button class="b p" data-a="qgo">▶ Commencer</button></div></div>
  ${h.length?`<div class="c" style="margin-top:12px"><h4>Derniers résultats</h4>${h.slice(-5).reverse().map(x=>`<div class="cl" style="cursor:default"><b>${Math.round(x.sc/x.n*100)}% <span class="mu">(${x.sc}/${x.n})</span></b><small class="mu">${new Date(x.d).toLocaleString(LOC())}</small></div>`).join('')}</div>`:''}
  ${bank?`<div class="row" style="justify-content:flex-start"><button class="b" data-a="qclear">🗑 Vider la banque IA</button></div>`:''}`;
}
function qPlay(){
  const q=QZ.qs[QZ.i],n=QZ.qs.length,done=QZ.res.length>QZ.i,last=QZ.res[QZ.i];
  let body;
  if(q.k==='qcm')body=q.opts.map((o,i)=>`<button class="opt${done?(o===q.right?' ok':o===QZ.pick?' no':''):''}" data-a="qpick" data-i="${i}"${done?' disabled':''}>${esc(o)}</button>`).join('')+(done?`<p class="${last.ok?'okt':'bad'}">${last.ok?'✅ Bonne réponse !':QZ.pick===''?'⏱ Temps écoulé':'❌ Mauvaise réponse'}</p>`:'');
  else body=QZ.shown?`<div class="rs" style="font-size:14px"><small class="br">RÉPONSE</small>${esc(q.right)}</div>`+(done?`<p class="${last.ok?'okt':'bad'}">${last.ok?'✅ Bien joué !':'📌 À revoir'}</p>`:`<div class="row" style="justify-content:center"><button class="b" data-a="qself" data-i="0">À revoir</button><button class="b p" data-a="qself" data-i="1">Je savais</button></div>`):`<div class="row" style="justify-content:center"><button class="b p" data-a="qshow">Voir la réponse</button></div>`;
  return `<div class="top"><small class="br">Question ${QZ.i+1} / ${n}</small>${qcfg.timer&&q.k==='qcm'&&!done?`<b id="qt" class="br">${QZ.left} s</b>`:''}<button class="b" data-a="qquit" aria-label="Quitter">✕</button></div><div class="bar"><i style="width:${(QZ.i/n)*100}%"></i></div>
  <div class="c"><small class="mu" style="color:${modCol(q.moduleId)}">● ${esc(modName(q.moduleId))}</small><h3 style="margin:8px 0 12px">${esc(q.q)}</h3>${body}
  ${done&&q.exp?`<div class="rs" style="font-size:13px">💡 ${esc(q.exp)}</div>`:''}
  ${done?`<div class="row" style="justify-content:center"><button class="b p" data-a="qnext">${QZ.i+1>=n?'Voir le résultat':'Suivant →'}</button></div>`:''}</div>`;
}
function qResult(){
  const n=QZ.qs.length,p=Math.round(QZ.sc/n*100),wrong=QZ.res.filter(r=>!r.ok);
  const msg=p>=90?'Excellent ! 🏆':p>=70?'Très bien 👏':p>=50?'Pas mal, continue 💪':'À retravailler 📚';
  return `<div class="c pm"><h2>${msg}</h2><div style="margin:14px 0"><b style="font-size:56px;color:var(--br)">${p}%</b><small class="mu">${QZ.sc} / ${n} bonnes réponses · ${Math.round((Date.now()-QZ.t0)/1000)} s</small></div>
  ${wrong.length?`<h4>À revoir (${wrong.length})</h4>${wrong.map(r=>`<div class="rs" style="text-align:left;display:block"><b>${esc(r.q.q)}</b><small class="mu">✅ ${esc(r.q.right)}</small></div>`).join('')}`:'<p class="okt">Aucune erreur 🎉</p>'}
  <div class="row">${wrong.length?'<button class="b" data-a="qredo">Revoir mes erreurs</button>':''}<button class="b" data-a="qgo">Rejouer</button><button class="b p" data-a="qquit">Terminer</button></div></div>`;
}

/* ---------- AI import ---------- */
async function toImages(f){
  if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
    await lib(PDFJS+'min.js');await lib(PDFJS+'worker.min.js').catch(()=>{});pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];
    for(let i=1;i<=Math.min(pdf.numPages,3);i++){const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1.5}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.push(c.toDataURL('image/jpeg',.85))}
    return out}
  return[await shrink(f,1600,.85)];
}
const normDay=s=>{const x=String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return DAYS.find(d=>d.toLowerCase()===x)};
const AI_PROMPT='Extrais l\'emploi du temps de ces images. Réponds STRICTEMENT avec un tableau JSON valide sans markdown : [{"jour":"LUNDI","debut":"08:30","fin":"10:30","matiere":"Nom du module","salle":"Amphi A"}]. Utilise les jours en français (LUNDI, MARDI, MERCREDI, JEUDI, VENDREDI, SAMEDI).';
async function postJSON(url,headers,body){
  let r,j;
  for(let t=1;t<=5;t++){
    r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...headers},body:JSON.stringify(body)});
    j=await r.json().catch(()=>({}));
    if(r.ok||![429,500,503,504].includes(r.status)||t===5)break;
    toast('IA occupée, nouvelle tentative '+t+'/4...');await new Promise(z=>setTimeout(z,t*3000));
  }
  return{ok:r.ok,status:r.status,j};
}
async function aiCall(prov,key,model,imgs,prompt=AI_PROMPT){
  imgs=imgs||[];
  if(prov==='groq'){
    const content=imgs.length?[{type:'text',text:prompt},...imgs.map(u=>({type:'image_url',image_url:{url:u}}))]:prompt;
    const call=m=>postJSON('https://api.groq.com/openai/v1/chat/completions',{Authorization:'Bearer '+key},{model:m,temperature:.1,max_completion_tokens:4096,messages:[{role:'user',content}]});
    let r=await call(model);
    if(!r.ok&&/model|not exist|access/i.test(r.j.error?.message||'')){
      /* modele inconnu pour cette cle : on liste les modeles du compte et on essaie les modeles vision */
      const ml=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+key}}).then(x=>x.json()).catch(()=>({})),
        ids=(ml.data||[]).map(x=>x.id),alt=ids.filter(i=>i!==model&&/llama-4|scout|maverick|vision|-vl|qwen/i.test(i)).slice(0,4);
      for(const m of alt){r=await call(m);if(r.ok){localStorage.setItem('eduVault_aiModel_groq',m);toast('Modèle utilisé : '+m,'ok');break}}
      if(!r.ok)throw Error((r.j.error?.message||'Erreur Groq')+(ids.length?' | Modèles disponibles : '+ids.slice(0,12).join(', '):''));
    }
    if(!r.ok)throw Error(r.j.error?.message||'Erreur Groq HTTP '+r.status);
    return r.j.choices?.[0]?.message?.content||'';
  }
  const r=await postJSON(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{},
    {contents:[{parts:[{text:prompt},...imgs.map(i=>({inline_data:{mime_type:'image/jpeg',data:i.split(',')[1]}}))]}],generationConfig:{temperature:.1}});
  if(!r.ok)throw Error(r.j.error?.message||'Erreur Gemini HTTP '+r.status);
  return(r.j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
}
const hm=t=>{const m=String(t||'').match(/(\d{1,2})\s*[:hH]\s*(\d{2})/);return m?m[1].padStart(2,'0')+':'+m[2]:null};
async function aiImport(v,fd){
  const f=fd.get('file');if(!f||!f.size)return toast('Sélectionnez un document','er');
  const prov=AI[v.prov]?v.prov:'gemini',key=v.key.trim(),model=v.model.trim();
  localStorage.setItem('eduVault_aiProv',prov);localStorage.setItem('eduVault_aiKey_'+prov,key);localStorage.setItem('eduVault_aiModel_'+prov,model);
  toast('Analyse en cours ('+AI[prov].n+')...');
  try{
    const raw=(await aiCall(prov,key,model,await toImages(f))).replace(/<think>[\s\S]*?<\/think>/g,'').replace(/```(?:json)?/g,''),a=raw.indexOf('['),b=raw.lastIndexOf(']');
    if(a<0||b<a)throw Error("L'IA n'a pas renvoyé de JSON valide.");
    const ss=JSON.parse(raw.slice(a,b+1)).map(s=>({...s,debut:hm(s.debut),fin:hm(s.fin)})).filter(s=>s.matiere&&s.debut&&s.fin&&s.fin>s.debut&&normDay(s.jour));
    if(!ss.length)throw Error('Aucun cours trouvé dans ce document.');
    let added=0;
    ss.forEach(s=>{const name=String(s.matiere).trim(),day=normDay(s.jour);
      let m=A.modules.find(x=>x.semester===A.activeSemester&&x.name.toLowerCase()===name.toLowerCase());
      if(!m){m={id:uid('m'),semester:A.activeSemester,name,prof:s.prof||'',coeff:1,color:nextModColor(),ccc:0,ctp:0,cex:1,ncc:null,ntp:null,nex:null,absences:0,pomo:0,resources:[]};A.modules.push(m)}
      if(!A.timetable.some(c=>c.moduleId===m.id&&c.day===day&&c.startTime===s.debut&&c.endTime===s.fin)){A.timetable.push({id:uid('c'),moduleId:m.id,day,week:'all',startTime:s.debut,endTime:s.fin,room:s.salle||'Salle'});added++}});
    upd();toast(added+' séances importées'+(added<ss.length?' ('+(ss.length-added)+' déjà présentes)':'')+' !','ok');
  }catch(e){toast(e instanceof TypeError?'Connexion impossible (internet, Brave Shields, VPN)':'Erreur IA : '+e.message,'er')}
}

/* la session Google expire apres 1 h : au prochain toucher/clic on se reconnecte silencieusement */
function armReconnect(){
  if(!linked()||tok||armed)return;armed=true;paintDrive();
  const run=()=>{armed=false;['pointerup','keydown'].forEach(t=>document.removeEventListener(t,run,true));
    if(!linked())return;
    drvAuth().then(()=>drvSync()).catch(()=>{paintDrive();setTimeout(armReconnect,60000)})};
  ['pointerup','keydown'].forEach(t=>document.addEventListener(t,run,true));
}
function drvSchedule(){if(!linked())return;if(!tok){armReconnect();return}clearTimeout(syncT);syncT=setTimeout(()=>drvSync(),4000)}

async function dfetch(url,opt={}){
  if(!tok){const e=Error('Drive non connecté');e.code=401;throw e}
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+tok}});
  if(r.status===401){tok=null;paintDrive();const e=Error('Session Drive expirée');e.code=401;throw e}
  return r}
async function drvFind(){

  if(!r.ok)throw Error('Lecture Drive impossible ('+r.status+')');
  return((await r.json()).files||[])[0]||null}
async function drvGet(f){const o=await(await dfetch(GAPI+'drive/v3/files/'+f.id+'?alt=media')).json();if(!o||!Array.isArray(o.modules))throw Error('Sauvegarde Drive invalide');return o}
async function drvPut(f){

function dFolder(name,parent){

    const q="mimeType='application/vnd.google-apps.folder' and name='"+dQ(name)+"' and '"+(parent||'root')+"' in parents and trashed=false";

function dPlan(m,r){
  const ext=dExt(r.fname)||r.dExt||'';
  let base=dSan(r.title);if(ext&&base.toLowerCase().endsWith(ext.toLowerCase()))base=base.slice(0,-ext.length);

  return{name,path,sig:path.join('/')+'/'+name}}

/* fichiers "locaux" : envoyes aussi sur Drive (ranges par semestre / module / categorie) pour etre disponibles sur les autres appareils */
async function syncFiles(){
  let n=0;
  for(const m of A.modules)for(const r of(m.resources||[])){
    if(!r.isLocal||r.skipSync)continue;
    if(r.driveId){
      /* deja envoye : on le range / renomme si le titre, le module, le semestre ou la categorie a change */
      let pl=dPlan(m,r);if(r.dSig===pl.sig)continue;
      const g=await dfetch(GAPI+'drive/v3/files/'+r.driveId+'?fields=parents,name');
      if(g.status===404){r.dSig=pl.sig;continue}
      if(!g.ok)throw Error("Rangement du fichier '"+r.title+"' impossible ("+g.status+")");
      const gi=await g.json();if(!dExt(r.fname)&&!r.dExt){r.dExt=dExt(gi.name);pl=dPlan(m,r);if(r.dSig===pl.sig)continue}
      const dest=await dPlace(pl.path),old=(gi.parents||[]).filter(x=>x!==dest).join(',');
      const u=await dfetch(GAPI+'drive/v3/files/'+r.driveId+'?addParents='+encodeURIComponent(dest)+(old?'&removeParents='+encodeURIComponent(old):'')+'&fields=id',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:pl.name})});
      if(!u.ok)throw Error("Rangement du fichier '"+r.title+"' impossible ("+u.status+")");
      r.dSig=pl.sig;n++;continue}
    const rec=await fst('get',r.localFileId).catch(()=>null);if(!rec)continue;
    const b=rec.blob||(rec.dataUrl?await(await fetch(rec.dataUrl)).blob():null);if(!b)continue;
    if(b.size>40*1048576){r.skipSync=true;continue}
    if(!r.fname&&rec.name)r.fname=rec.name;
    const pl=dPlan(m,r);let res;
    for(let t=0;t<2;t++){
      const dest=await dPlace(pl.path),form=new FormData();
      form.append('metadata',new Blob([JSON.stringify({name:pl.name,mimeType:rec.type||b.type||'application/octet-stream',parents:[dest]})],{type:'application/json'}));form.append('file',b);
      res=await dfetch(GAPI+'upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',body:form});
      if(res.status===404&&!t){for(const k in DRVF)delete DRVF[k];continue}break}
    if(!res.ok)throw Error("Envoi du fichier '"+r.title+"' impossible");
    r.driveId=(await res.json()).id;r.dSig=pl.sig;n++}
  if(n){A.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}if(UID)fbSchedule(300);else await drvPut(await drvFind())}}
