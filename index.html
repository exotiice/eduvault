  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' } } } }
    }
  </script>

    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

  <script>
    /* ==========================================================================
       !!! CONFIGURATION GOOGLE DRIVE !!!
       ========================================================================== */
    const CLIENT_ID = '786113410432-5c5gh5craje2k8aq6jbgjd35jn7f1eur.apps.googleusercontent.com';
    let tokenClient = null;
    let driveAccessToken = null;

    /* ==========================================================================
       1. INDEXEDDB LOCAL FILE STORAGE
       ========================================================================== */
    const DB_NAME = 'EduVaultLocalFiles';
    let dbInstance = null;

    function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          if (!e.target.result.objectStoreNames.contains('files')) {
            e.target.result.createObjectStore('files', { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(dbInstance = req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function storeLocalFile(id, file) {
      if (!dbInstance) await initIndexedDB();
      return new Promise((resolve, reject) => {
        const tx = dbInstance.transaction('files', 'readwrite');
        const reader = new FileReader();
        reader.onload = e => {
          tx.objectStore('files').put({ id, name: file.name, type: file.type, dataUrl: e.target.result });
          resolve();
        };
        reader.readAsDataURL(file);
      });
    }

    async function openLocalFile(id) {
      if (!dbInstance) await initIndexedDB();
      const req = dbInstance.transaction('files', 'readonly').objectStore('files').get(id);
      req.onsuccess = () => {
        if (!req.result) return showToast('Fichier non trouvé', 'error');
        const win = window.open();
        win ? win.document.write(`<iframe src="${req.result.dataUrl}" style="border:0;width:100%;height:100%;"></iframe>`) : showToast('Bloqué par le navigateur', 'warning');
      };
    }

    /* ==========================================================================
       2. GOOGLE DRIVE GIS AUTH & UPLOAD
       ========================================================================== */
    function initDriveClient() {
      if (window.google?.accounts?.oauth2) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (res) => {
            if (res.error) return showToast('Erreur Drive: ' + res.error, 'error');
            driveAccessToken = res.access_token;
            updateDriveUI(true);
            showToast('Connecté à Google Drive !', 'success');
          }
        });
      } else {
        setTimeout(initDriveClient, 800);
      }
    }

    function toggleDriveAuth() {
      if (!tokenClient) return showToast("API Google en cours de chargement...", 'warning');
      if (driveAccessToken) {
        driveAccessToken = null;
        updateDriveUI(false);
        showToast('Déconnecté de Drive', 'info');
      } else {
        tokenClient.requestAccessToken();
      }
    }

    function updateDriveUI(connected) {
      document.getElementById('driveStatusText').innerText = connected ? 'Drive Connecté' : 'Drive Cloud';
      document.getElementById('driveDot').className = connected ? 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' : 'w-2 h-2 rounded-full bg-red-500';
    }

    /* ==========================================================================
       3. APP STATE & RENDERING
       ========================================================================== */
    let appState = { activeSemester: 'S1', activeTab: 'modulesView', taskFilter: 'all', modules: [], tasks: [], flashcards: [] };

    window.addEventListener('DOMContentLoaded', async () => {
      await initIndexedDB().catch(console.warn);
      loadData();
      initTheme();
      initDriveClient();
      renderSemesterPills();
      renderModules();
      renderTasks();
      renderFlashcards();
      initPomodoro();
    });

    function loadData() {
      const saved = localStorage.getItem('eduVaultData_v4');
      if (saved) appState = Object.assign(appState, JSON.parse(saved));
      calculateSemesterAverage();
    }
    function saveData() {
      localStorage.setItem('eduVaultData_v4', JSON.stringify(appState));
      calculateSemesterAverage();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.view-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('text-brand-600', 'bg-brand-50', 'dark:bg-brand-900/30'));
      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById('tab-' + tabId).classList.add('text-brand-600', 'bg-brand-50', 'dark:bg-brand-900/30');
      appState.activeTab = tabId;
    }

    function renderSemesterPills() {
      document.getElementById('semesterPills').innerHTML = ['S1', 'S2', 'S3', 'S4', 'S5', 'S6'].map(s => `
        <button onclick="setSemester('${s}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${
          appState.activeSemester === s ? 'bg-brand-600 text-white' : 'bg-gray-100 dark:bg-gray-700'
        }">${s}</button>
      `).join('');
    }
    function setSemester(sem) { appState.activeSemester = sem; renderSemesterPills(); renderModules(); }

    function calculateSemesterAverage() {
      const currentMods = appState.modules.filter(m => m.semester === appState.activeSemester && m.grade);
      const avgDisp = document.getElementById('semAverageDisplay');
      if (!currentMods.length) return avgDisp.innerText = '-- / 20';
      let totalPts = 0, totalCoef = 0;
      currentMods.forEach(m => { totalPts += (m.grade * m.coeff); totalCoef += m.coeff; });
      avgDisp.innerText = (totalPts / totalCoef).toFixed(2) + ' / 20';
    }

    function renderModules() {
      const container = document.getElementById('modulesGrid');
      const query = (document.getElementById('moduleSearch')?.value || '').toLowerCase();
      const filtered = appState.modules.filter(m => m.semester === appState.activeSemester && m.name.toLowerCase().includes(query));

      container.innerHTML = filtered.map(m => `
        <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-5 shadow-sm space-y-4">
          <div class="flex items-start justify-between">
            <div>
              <span class="text-[10px] font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded-md">${m.semester} | Note: ${m.grade || '-'}</span>
              <h3 class="font-bold text-base mt-1">${m.name}</h3>
            </div>
            <div class="flex space-x-1">
              <button onclick="openAddResourceModal('${m.id}')" class="text-brand-600 hover:bg-gray-100 p-1.5 rounded"><i class="fa-solid fa-file-circle-plus"></i></button>
              <button onclick="deleteModule('${m.id}')" class="text-red-400 hover:bg-gray-100 p-1.5 rounded"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
          <div class="space-y-2 text-xs">
            ${renderResList('📚 Cours', m.resources?.filter(r=>r.type==='cours'), m.id)}
            ${renderResList('📝 TD', m.resources?.filter(r=>r.type==='td'), m.id)}
            ${renderResList('🎯 Exam', m.resources?.filter(r=>r.type==='examen'), m.id)}
          </div>
        </div>
      `).join('');
    }

    function renderResList(title, list=[], modId) {
      return `
        <div class="bg-gray-50 dark:bg-gray-900/50 rounded-xl p-2.5">
          <span class="text-[11px] font-semibold text-gray-500">${title}</span>
          ${list.map(r => `
            <div class="flex justify-between py-1 px-2 mt-1 bg-white dark:bg-gray-800 border rounded-lg">
              ${r.isLocal ? `<button onclick="openLocalFile('${r.localFileId}')" class="text-brand-600 truncate"><i class="fa-solid fa-file-pdf mr-1"></i>${r.title}</button>` 
                         : `<a href="${r.url}" target="_blank" class="text-blue-500 truncate"><i class="fa-solid fa-link mr-1"></i>${r.title}</a>`}
              <button onclick="deleteRes('${modId}', '${r.id}')" class="text-red-400 ml-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
          `).join('')}
        </div>`;
    }

    let currentResTab = 'local';
    function switchResourceTab(t) {
      currentResTab = t;
      ['local', 'drive', 'manual'].forEach(tab => {
        document.getElementById('resTab-'+tab).className = `flex-1 py-2 font-bold border-b-2 ${tab===t ? 'border-brand-600 text-brand-600' : 'border-transparent text-gray-400'}`;
        document.getElementById('resPanel-'+tab).classList.toggle('hidden', tab!==t);
      });
    }

    async function saveResource(e) {
      e.preventDefault();
      const modId = document.getElementById('resModuleId').value;
      const title = document.getElementById('resTitle').value;
      const cat = document.getElementById('resCategory').value;
      const mod = appState.modules.find(m => m.id === modId);
      if(!mod.resources) mod.resources = [];
      const btn = document.getElementById('saveResBtn'); btn.disabled = true;

      try {
        if(currentResTab === 'local') {
          const file = document.getElementById('resLocalFileInput').files[0];
          const localId = 'file_' + Date.now();
          await storeLocalFile(localId, file);
          mod.resources.push({ id: 'r_'+Date.now(), title, type: cat, isLocal: true, localFileId: localId });
        } 
        else if (currentResTab === 'drive') {
          const file = document.getElementById('resDriveFileInput').files[0];
          if(!driveAccessToken) throw new Error("Connectez-vous à Drive d'abord");
          
          const meta = { name: `${title} - ${file.name}`, mimeType: file.type };
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(meta)], {type: 'application/json'}));
          form.append('file', file);
          
          const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST', headers: { 'Authorization': 'Bearer ' + driveAccessToken }, body: form
          });
          const data = await res.json();
          if(!data.id) throw new Error("Erreur Upload");
          mod.resources.push({ id: 'r_'+Date.now(), title, type: cat, isLocal: false, url: `https://drive.google.com/file/d/${data.id}/view` });
        }
        else {
          mod.resources.push({ id: 'r_'+Date.now(), title, type: cat, isLocal: false, url: document.getElementById('resUrlInput').value });
        }
        saveData(); renderModules(); closeModal('resourceModal'); showToast('Ajouté!');
      } catch(err) { showToast(err.message, 'error'); } 
      finally { btn.disabled = false; }
    }

    function deleteRes(mId, rId) {
      const mod = appState.modules.find(m => m.id === mId);
      mod.resources = mod.resources.filter(r => r.id !== rId);
      saveData(); renderModules();
    }

    // Modal, Toast & Basics
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function backdropClose(e, id) { if(e.target.id===id) closeModal(id); }
    function showToast(msg, type='info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `px-4 py-2 rounded-xl text-xs text-white shadow-xl ${type==='error'?'bg-red-600':type==='success'?'bg-emerald-600':'bg-gray-800'}`;
      t.innerText = msg;
      c.appendChild(t);
      setTimeout(()=>t.remove(), 3000);
    }
    
    // Theme
    function initTheme() { if(localStorage.getItem('eduTheme')==='light') document.documentElement.classList.remove('dark'); }
    function toggleTheme() { 
      document.documentElement.classList.toggle('dark'); 
      localStorage.setItem('eduTheme', document.documentElement.classList.contains('dark') ? 'dark':'light'); 
    }

    // MODULE CRUD 
    function openAddModuleModal() { document.getElementById('moduleForm').reset(); openModal('moduleModal'); }
    function saveModule(e) {
      e.preventDefault();
      appState.modules.push({
        id: 'm_'+Date.now(), semester: document.getElementById('moduleSemester').value,
        name: document.getElementById('moduleName').value, coeff: Number(document.getElementById('moduleCoeff').value),
        grade: Number(document.getElementById('moduleGrade').value), resources: []
      });
      saveData(); renderModules(); closeModal('moduleModal');
    }
    function deleteModule(id) { appState.modules = appState.modules.filter(m=>m.id!==id); saveData(); renderModules(); }
    function openAddResourceModal(id) { document.getElementById('resModuleId').value = id; openModal('resourceModal'); switchResourceTab('local'); }

    // TASKS & FLASHCARDS (Simplified for integration)
    function openAddTaskModal() { openModal('taskModal'); }
    function saveTask(e) { e.preventDefault(); appState.tasks.push({id:'t_'+Date.now(), title:document.getElementById('taskTitle').value, dueDate:document.getElementById('taskDueDate').value}); saveData(); renderTasks(); closeModal('taskModal'); }
    function renderTasks() { document.getElementById('tasksList').innerHTML = appState.tasks.map(t=>`<div class="p-3 bg-white dark:bg-gray-800 rounded-lg border flex justify-between"><span>${t.title}</span><button onclick="appState.tasks=appState.tasks.filter(x=>x.id!=='${t.id}');saveData();renderTasks()">❌</button></div>`).join(''); }
    
    function openAddFlashcardModal() { openModal('flashcardModal'); }
    function saveFlashcard(e) { e.preventDefault(); appState.flashcards.push({id:'f_'+Date.now(), q:document.getElementById('cardQuestion').value, a:document.getElementById('cardAnswer').value}); saveData(); renderFlashcards(); closeModal('flashcardModal'); }
    function renderFlashcards() { document.getElementById('flashcardsGrid').innerHTML = appState.flashcards.map(f=>`<div class="p-4 bg-white dark:bg-gray-800 rounded-lg border"><b>Q: ${f.q}</b><hr class="my-2"><p>${f.a}</p><button onclick="appState.flashcards=appState.flashcards.filter(x=>x.id!=='${f.id}');saveData();renderFlashcards()" class="text-red-500 text-xs mt-2">Supprimer</button></div>`).join(''); }

    // POMODORO
    let pTime=25*60, pInt;
    function setPomodoroMode(m) { clearInterval(pInt); pTime = m==='work'?25*60:m==='short'?5*60:15*60; updPomo(); }
    function togglePomodoro() { 
      if(pInt){ clearInterval(pInt); pInt=null; }
      else { pInt = setInterval(()=>{ pTime--; updPomo(); if(pTime<=0){clearInterval(pInt); showToast('Terminé!','success');} }, 1000); }
    }
    function resetPomodoro() { clearInterval(pInt); pInt=null; pTime=25*60; updPomo(); }
    function updPomo() { document.getElementById('timerDisplay').innerText = `${String(Math.floor(pTime/60)).padStart(2,'0')}:${String(pTime%60).padStart(2,'0')}`; }
  </script>
</body>
</html>
