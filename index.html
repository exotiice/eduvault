<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>EduVault Pro</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#6b7280;--ln:#e5e7eb;--br:#2563eb;--bs:#e0edff;--er:#dc2626;--ok:#059669;--in:#f3f4f6}
.dark{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--ln:#374151;--bs:#1e3a8a66;--in:#374151}
*{box-sizing:border-box;margin:0}
body{font:14px/1.4 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--ln);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.s-bar{flex:1;position:relative;margin:0 10px}.s-bar input{margin:0;padding:6px 12px;width:100%;border-radius:20px;background:var(--in);color:var(--tx);border:0}
#s-res{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--br);border-radius:12px;margin-top:4px;padding:8px;display:none;max-height:60vh;overflow-y:auto;box-shadow:0 10px 25px #0005}
h1{font-size:18px;font-weight:800;color:var(--br)}h2{font-size:17px;margin-bottom:8px}h3{margin-bottom:6px}h4{font-size:11px;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
main{max-width:1000px;margin:auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;font-weight:700;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:19px}nav .on{color:var(--br)}
.b{border:0;border-radius:12px;padding:8px 12px;background:var(--in);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}.p{background:var(--br);color:#fff}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px;position:relative;overflow:hidden}
.c-col{position:absolute;left:0;top:0;bottom:0;width:4px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.top>div:last-child{display:flex;gap:6px}
.br{color:var(--br);font-weight:700}.mu{color:var(--mu)}small{font-size:11px;display:block}
.cl{background:var(--bs);border-radius:12px;padding:9px;margin-bottom:8px;cursor:pointer;border:1px solid transparent}.cl.nt{border-color:#f59e0b}.cl b{display:block}
.e{text-align:center;border:1px dashed var(--ln);border-radius:12px;padding:10px;font-size:12px}
.up{background:linear-gradient(90deg,#f59e0b,#ea580c);color:#fff;border-radius:16px;padding:12px;font-weight:700;margin-bottom:12px;cursor:pointer}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.pills .b.p{box-shadow:0 2px 8px #2563eb55}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}.row input{flex:1;min-width:0;margin:0}
.t{display:flex;align-items:center;gap:10px;margin-bottom:8px}.t>div{flex:1}.t.x{border-color:#f87171}.t.d>div{opacity:.5;text-decoration:line-through}.t input{width:18px;margin:0}
.x-btn{border:0;background:none;color:var(--mu);cursor:pointer;font-size:15px}
.fc{perspective:900px;height:220px;cursor:pointer}.fi{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}.fc.fl .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:14px;border-radius:16px;border:1px solid var(--ln);background:var(--card);overflow:auto;display:flex;flex-direction:column;justify-content:space-between}
.fb{transform:rotateY(180deg);background:var(--bs);border:2px solid var(--br)}
.pm{max-width:420px;margin:auto;text-align:center}.pm .row{justify-content:center}.ring{position:relative;width:220px;height:220px;margin:18px auto}.ring svg{transform:rotate(-90deg)}.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring b{font-size:44px}
dialog{border:0;border-radius:20px;padding:18px;width:min(440px,94vw);max-height:88vh;background:var(--card);color:var(--tx)}dialog::backdrop{background:#0009}
label{display:block;font-size:12px;font-weight:600;margin:8px 0;color:var(--mu)}
input,select,textarea{width:100%;margin-top:4px;padding:10px;border:0;border-radius:12px;background:var(--in);color:var(--tx);font:inherit}
#ts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:6px;pointer-events:none;width:92%;max-width:420px}#ts div{color:#fff;border-radius:99px;padding:9px 14px;font-weight:700;font-size:12px;text-align:center;background:#111827}
#ts .er{background:var(--er)}#ts .ok{background:var(--ok)}
.tod{border-color:var(--br);box-shadow:0 0 0 1px var(--br)}
.bdg{display:inline-block;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:800;color:#fff}
.bdg.ok{background:var(--ok)}.bdg.ko{background:var(--er)}
.mcrd{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--in);padding:8px;border-radius:12px;font-size:12px}
.mcrd input{padding:4px 8px;font-size:12px;margin:0}
</style>
</head>
<body>
<header>
  <h1 onclick="go('da')" style="cursor:pointer">🎓 EduVault</h1>
  <div class="s-bar"><input type="search" id="sq" placeholder="Rechercher..." oninput="doSearch()"><div id="s-res"></div></div>
  <div style="display:flex;gap:6px;align-items:center">
    <button class="b" data-a="theme" title="Thème">🌓</button>
  </div>
</header>
<main id="v"></main>
<nav id="nav">
  <button data-t="da" class="on"><span>🏠</span>Auj.</button>
  <button data-t="tt"><span>🗓</span>Horaires</button>
  <button data-t="ag"><span>🔔</span>Agenda</button>
  <button data-t="mo"><span>📚</span>Cours</button>
  <button data-t="fc"><span>🃏</span>Fiches</button>
  <button data-t="po"><span>⏱</span>Focus</button>
  <button data-a="set"><span>⚙️</span>Plus</button>
</nav>
<dialog id="dlg"></dialog>
<div id="ts" aria-live="polite"></div>

<script>
/* --- Setup PWA dynamically --- */
const mfest = {"name":"EduVault Pro","short_name":"EduVault","start_url":".","display":"standalone","background_color":"#111827","theme_color":"#2563eb","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>","sizes":"192x192","type":"image/svg+xml"}]};
document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="data:application/json;charset=utf-8,${encodeURIComponent(JSON.stringify(mfest))}">`);
if('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(new Blob(["self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))))"],{type:'application/javascript'}))).catch(()=>{});

const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LV={CP1:['S1','S2'],CP2:['S3','S4'],CI1:['S5','S6'],CI2:['S7','S8'],CI3:['S9','S10']};
const ALLS=Object.values(LV).flat();
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const TOD=()=>DAYS[(new Date().getDay()+6)%7];
const GEMINI_MODEL='gemini-2.5-flash';
const KEY='eduVaultData_vFinal3';

let A={activeSemester:'S1',settings:{level:null,currentWeek:'A',weekRef:'',holidays:[]},modules:[],tasks:[],flashcards:[],timetable:[],notes:[]};
let tab='da',filt='all',cardMod='all',q='',cur={},tok=null,tc=null;

const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const sems=()=>LV[A.settings.level]||LV.CP1;
const mods=()=>A.modules.filter(m=>m.semester===A.activeSemester);
const modName=id=>A.modules.find(m=>m.id===id)?.name||'?';
const modCol=id=>A.modules.find(m=>m.id===id)?.color||'#2563eb';
function toast(m,t=''){const e=document.createElement('div');e.className=t;e.textContent=m;$('ts').append(e);setTimeout(()=>e.remove(),3500)}

function load(o){
  try{Object.assign(A,o||JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
  for(const k of ['modules','tasks','flashcards','timetable','notes'])if(!Array.isArray(A[k]))A[k]=[];
  A.modules.forEach(m=>{
    m.absences=m.absences||0; m.pomo=m.pomo||0; m.color=m.color||'#2563eb';
    m.ccc=m.ccc??0; m.ctp=m.ctp??0; m.cex=m.cex??1; // coeffs
    m.ncc=m.ncc??null; m.ntp=m.ntp??null; m.nex=m.nex??null; // notes
  });
  A.flashcards.forEach(f=>{ f.efactor=f.efactor||2.5; f.interval=f.interval||0; f.repetition=f.repetition||0; f.nextRev=f.nextRev||0; });
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){toast('Erreur de stockage','er')}}
function upd(){save();render()}

function curWeek(){const s=A.settings,c=s.currentWeek||'A';if(!s.weekRef)return c;const k=Math.round((monday(new Date())-monday(new Date(s.weekRef+'T00:00')))/6048e5);return Math.abs(k)%2===0?c:(c==='A'?'B':'A')}
const isHol=d=>A.settings.holidays.includes(d);

function ask(title,fields,ok){
  const d=$('dlg');
  d.innerHTML=`<form><h3>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.l)}${
    f.t==='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}"${o[0]==f.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:
    f.t==='textarea'?`<textarea name="${f.k}" rows="3"${f.r?' required':''}>${esc(f.v)}</textarea>`:
    `<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}"${f.r?' required':''}${f.a||''}>`}</label>`).join('')}
    <div class="row"><button type="button" class="b" onclick="$('dlg').close()">Annuler</button><button class="b p">OK</button></div></form>`;
  d.querySelector('form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);d.close();ok(Object.fromEntries(fd),fd)};
  d.showModal();
}

/* --- Views --- */
const pills=()=>`<div class="pills">${ALLS.map(s=>`<button class="b${s===A.activeSemester?' p':''}" data-a="sem" data-i="${s}">${s}</button>`).join('')}</div>`;

function calcSem(){
  const ms=mods(); let tt=0, cc=0;
  ms.forEach(m=>{
    const d=(m.ccc+m.ctp+m.cex);
    if(d>0 && (m.ncc!=null||m.ntp!=null||m.nex!=null)){
      const n= ((m.ncc||0)*m.ccc + (m.ntp||0)*m.ctp + (m.nex||0)*m.cex) / d;
      tt+=n*(m.coeff||1); cc+=(m.coeff||1);
    }
  });
  return cc>0 ? (tt/cc).toFixed(2) : '-';
}

function rDa(){
  const t=Date.now(), n=new Date();
  const tdsCls=A.timetable.filter(c=>c.day===TOD() && (c.week==='all'||c.week===curWeek())).sort((a,b)=>a.startTime.localeCompare(b.startTime));
  const dueTs=A.tasks.filter(x=>!x.completed && new Date(x.dueDate).getTime()<t+7*86400000).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  const dueFc=A.flashcards.filter(f=>!f.nextRev || f.nextRev<=t);
  
  return `<div class="top"><h2>☀️ Aujourd'hui</h2><small class="br">${n.toLocaleDateString('fr-FR')} · Sem. ${curWeek()}</small></div>
  <div class="g">
    <div class="c tod"><h4>📚 Cours du jour</h4>
      ${tdsCls.map(c=>`<div class="cl" data-a="cls" data-i="${c.id}" style="border-left:4px solid ${modCol(c.moduleId)}"><small class="br">${esc(c.startTime)} – ${esc(c.endTime)}</small><b>${esc(modName(c.moduleId))}</b><small class="mu">📍 ${esc(c.room)}</small></div>`).join('') || '<p class="mu e">Aucun cours aujourd\'hui</p>'}
    </div>
    <div class="c"><h4>⚠️ Échéances proches</h4>
      ${dueTs.map(t=>{const h=Math.floor((new Date(t.dueDate)-n)/36e5); return `<div class="cl" style="border-left:4px solid ${modCol(t.moduleId)}"><small class="br">${h<24?`Dans ${h}h`:`Dans ${Math.floor(h/24)}j`}</small><b>${t.type==='exam'?'🚨':'📝'} ${esc(t.title)}</b><small class="mu">${esc(modName(t.moduleId))}</small></div>`}).join('') || '<p class="mu e">Rien dans les 7 jours</p>'}
    </div>
    <div class="c"><h4>🧠 Révision Spacée (SM-2)</h4>
      <div class="e" style="padding:20px;cursor:pointer" onclick="go('fc')"><b style="font-size:24px;color:var(--br)">${dueFc.length}</b><br><small class="mu">Fiches à réviser lyoum</small></div>
    </div>
  </div>`;
}

function rTT(){
  const wk=curWeek(), ids=mods().map(m=>m.id), tt=A.timetable.filter(c=>ids.includes(c.moduleId)&&(c.week==='all'||c.week===wk));
  return pills()+`<div class="top"><h2>Emploi du temps</h2><div><button class="b p" data-a="addCls">+ Séance</button></div></div><div class="g">`+
  DAYS.filter((d,i)=>i<6||tt.some(c=>c.day===d)).map(d=>`<div class="c${d===TOD()?' tod':''}"><h4>${d}</h4>`+(tt.filter(c=>c.day===d).sort((a,b)=>a.startTime.localeCompare(b.startTime)).map(c=>
    `<div class="cl" data-a="cls" data-i="${c.id}" style="border-left:4px solid ${modCol(c.moduleId)}"><small class="br">${esc(c.startTime)} – ${esc(c.endTime)}</small><b>${esc(modName(c.moduleId))}</b><small class="mu">📍 ${esc(c.room)}</small></div>`).join('')||'<p class="mu e">Vide</p>')+'</div>').join('')+'</div>';
}

function rAg(){
  const ids=mods().map(m=>m.id), l=A.tasks.filter(t=>ids.includes(t.moduleId)&&(filt==='all'||t.type===filt)).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  return pills()+`<div class="top"><h2>Agenda</h2><div><button class="b p" data-a="addTask">+ Échéance</button></div></div><div class="pills">${[['all','Tous'],['exam','Examens'],['homework','Devoirs']].map(f=>`<button class="b${filt===f[0]?' p':''}" data-a="flt" data-i="${f[0]}">${f[1]}</button>`).join('')}</div>`+
  (l.length?l.map(t=>`<div class="c t${t.type==='exam'?' x':''}${t.completed?' d':''}"><input type="checkbox" ${t.completed?'checked':''} data-a="done" data-i="${t.id}"><div><b>${t.type==='exam'?'🚨 ':'📝 '}${esc(t.title)}</b><small class="mu">${esc(modName(t.moduleId))} • ${new Date(t.dueDate).toLocaleString('fr-FR')}</small></div><button class="x-btn" data-a="editTask" data-i="${t.id}">✏️</button><button class="x-btn" data-a="delTask" data-i="${t.id}">🗑</button></div>`).join(''):'<p class="mu e">Aucune échéance</p>');
}

function rMo(){
  const avg=calcSem();
  let h=`${pills()}<div class="top"><div><h2>Modules</h2><small class="br">Moyenne estimée : ${avg}/20 ${avg>=10?'✅':'❌'}</small></div><div><button class="b p" data-a="addMod">+ Module</button></div></div><div class="g">`;
  h+=mods().map(m=>{
    const d=(m.ccc+m.ctp+m.cex);
    const n=(d>0&& (m.ncc!=null||m.ntp!=null||m.nex!=null)) ? (((m.ncc||0)*m.ccc + (m.ntp||0)*m.ctp + (m.nex||0)*m.cex) / d).toFixed(2) : '-';
    return `<div class="c" style="border-left:4px solid ${m.color}"><div class="top" style="margin:0"><div><b>${esc(m.name)}</b><small class="mu">Coef: ${m.coeff} · Absences: <span style="color:${m.absences>=3?'var(--er)':'inherit'}">${m.absences}</span></small></div>
    <div><button class="x-btn" data-a="abs" data-i="${m.id}|1" title="+ Absence">👨‍🦯</button><button class="x-btn" data-a="editMod" data-i="${m.id}">✏️</button><button class="x-btn" data-a="delMod" data-i="${m.id}">🗑</button></div></div>
    <div class="row" style="margin-bottom:8px;justify-content:space-between"><span class="bdg ${n>=10?'ok':'ko'}">Moy: ${n}/20</span><button class="b" data-a="chhal" data-i="${m.id}" style="padding:2px 8px;font-size:10px">🎯 Examen?</button></div>
    <div class="mcrd"><label>CC (c:${m.ccc})<input type="number" step="0.25" placeholder="-" value="${m.ncc!==null?m.ncc:''}" onchange="act.sNote('${m.id}','ncc',this.value)"></label><label>TP (c:${m.ctp})<input type="number" step="0.25" placeholder="-" value="${m.ntp!==null?m.ntp:''}" onchange="act.sNote('${m.id}','ntp',this.value)"></label>
    <label style="grid-column:1/-1">Examen (c:${m.cex})<input type="number" step="0.25" placeholder="-" value="${m.nex!==null?m.nex:''}" onchange="act.sNote('${m.id}','nex',this.value)"></label></div>
    <div class="row"><button class="b" data-a="aiFc" data-i="${m.id}">✨ IA Fiches</button><button class="b" data-a="addRes" data-i="${m.id}">📎 Doc</button></div></div>`;
  }).join('')+'</div>'; return h;
}

function rFc(){
  const t=Date.now(), ms=mods(), ids=ms.map(m=>m.id);
  const l=A.flashcards.filter(f=>ids.includes(f.moduleId) && (cardMod==='all'||f.moduleId===cardMod) && (!f.nextRev||f.nextRev<=t));
  return pills()+`<div class="top"><h2>Active Recall (A réviser lyoum)</h2><div><button class="b p" data-a="addFc">+ Créer</button></div></div><select onchange="cardMod=this.value;render()" style="margin:0 0 12px"><option value="all">Tous les modules</option>${ms.map(m=>`<option value="${m.id}"${cardMod===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select><div class="g">`+
  (l.length?l.map(f=>`<div class="fc" data-a="flip"><div class="fi"><div class="fa"><div><div class="top" style="margin:0"><small class="mu">${esc(modName(f.moduleId))}</small><span><button class="x-btn" data-a="editFc" data-i="${f.id}">✏️</button><button class="x-btn" data-a="delFc" data-i="${f.id}">🗑</button></span></div><b>${esc(f.q)}</b></div><small class="br">↻ Touchez pour la réponse</small></div>
  <div class="fb"><div><small class="br">RÉPONSE</small>${esc(f.a)}</div><div class="row" style="justify-content:center"><button class="b" style="background:#fecaca;color:#991b1b" data-a="sm2" data-i="${f.id}|1">Difficile</button><button class="b" style="background:#bbf7d0;color:#166534" data-a="sm2" data-i="${f.id}|2">Correct</button><button class="b p" data-a="sm2" data-i="${f.id}|3">Facile</button></div></div></div></div>`).join(''):'<p class="mu e" style="grid-column:1/-1">Aucune fiche prévue pour aujourd\'hui. Reposez-vous !</p>')+'</div>';
}

/* --- Pomodoro --- */
const PM={work:[1500,'Travail (25m)'],short:[300,'Pause (5m)'],long:[900,'Longue (15m)']};
let P={mode:'work',left:1500,total:1500,end:0,t:null};
function rPo(){return`<div class="c pm"><div class="row" style="justify-content:center">${Object.keys(PM).map(k=>`<button class="b${P.mode===k?' p':''}" data-a="pmode" data-i="${k}">${PM[k][1]}</button>`).join('')}</div><select id="pms" style="margin-top:12px"><option value="">Focus libre</option>${mods().map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><div class="ring"><svg viewBox="0 0 100 100" width="220" height="220"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--in)" stroke-width="5"/><circle id="pp" cx="50" cy="50" r="45" fill="none" stroke="var(--br)" stroke-width="5" stroke-linecap="round" stroke-dasharray="283"/></svg><div><b id="pt"></b></div></div><div class="row" style="justify-content:center"><button class="b p" id="pb" data-a="ptoggle" style="min-width:56px">▶</button><button class="b" data-a="preset">↻</button></div></div>`}
function ppaint(){if(!$('pt'))return;$('pt').textContent=String(Math.floor(P.left/60)).padStart(2,'0')+':'+String(P.left%60).padStart(2,'0');$('pp').style.strokeDashoffset=283-((P.total-P.left)/P.total)*283;$('pb').textContent=P.t?'⏸':'▶'}
function ptick(){
  P.left=Math.max(0,Math.round((P.end-Date.now())/1000)); ppaint();
  if(!P.left){
    clearInterval(P.t);P.t=null;P.left=P.total;
    if(P.mode==='work'&&$('pms').value){ const m=A.modules.find(x=>x.id===$('pms').value); if(m) {m.pomo+=PM.work[0]; save();} }
    toast('Session terminée !','ok'); ppaint();
  }
}

const R={da:rDa, tt:rTT, ag:rAg, mo:rMo, fc:rFc, po:rPo};
function render(){$('v').innerHTML=R[tab](); ppaint();}
function go(t){tab=t;document.querySelectorAll('#nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();}

/* --- Search --- */
function doSearch(){
  const q=$('sq').value.toLowerCase(); const res=$('s-res');
  if(!q){res.style.display='none';return;}
  let html='';
  A.modules.filter(m=>m.name.toLowerCase().includes(q)).forEach(m=>html+=`<div class="cl" onclick="go('mo');$('sq').value='';$('s-res').style.display='none'">📚 ${esc(m.name)}</div>`);
  A.flashcards.filter(f=>f.q.toLowerCase().includes(q)||f.a.toLowerCase().includes(q)).forEach(f=>html+=`<div class="cl" onclick="go('fc');$('sq').value='';$('s-res').style.display='none'">🃏 ${esc(f.q)}</div>`);
  A.tasks.filter(t=>t.title.toLowerCase().includes(q)).forEach(t=>html+=`<div class="cl" onclick="go('ag');$('sq').value='';$('s-res').style.display='none'">📝 ${esc(t.title)}</div>`);
  res.innerHTML=html||'<small class="mu">Aucun résultat</small>'; res.style.display='block';
}

/* --- Actions --- */
function modForm(m){ask(m?'Modifier le module':'Nouveau module',[
  {k:'semester',l:'Semestre',t:'select',o:ALLS.map(s=>[s,s]),v:m?.semester||A.activeSemester},
  {k:'name',l:'Nom du module',r:1,v:m?.name},{k:'coeff',l:'Coeff Global',t:'number',a:' min="0.5" step="0.5"',v:m?.coeff??1},
  {k:'color',l:'Couleur',t:'color',v:m?.color||'#2563eb'},
  {k:'ccc',l:'Coeff CC',t:'number',a:' step="0.5"',v:m?.ccc??0},{k:'ctp',l:'Coeff TP',t:'number',a:' step="0.5"',v:m?.ctp??0},{k:'cex',l:'Coeff Examen',t:'number',a:' step="0.5"',v:m?.cex??1}
],v=>{
  const o={semester:v.semester,name:v.name.trim(),color:v.color,coeff:+v.coeff||1,ccc:+v.ccc,ctp:+v.ctp,cex:+v.cex};
  m?Object.assign(m,o):A.modules.push({id:uid('m'),resources:[],...o});upd();toast('Module enregistré','ok')})
}
const modOpts=()=>mods().map(m=>[m.id,m.name]);

const act={
  sem:i=>{A.activeSemester=i;cardMod='all';upd()}, flt:i=>{filt=i;render()},
  theme:()=>{document.documentElement.classList.toggle('dark');localStorage.setItem('eduTheme',document.documentElement.classList.contains('dark')?'dark':'light')},
  set:()=>{
    const d=$('dlg'); d.innerHTML=`<h3>⚙️ Réglages</h3>
    <div class="row" style="margin-bottom:12px;justify-content:flex-start">
      <button class="b" data-a="expics">📅 Exporter ICS (Google Calendar)</button>
      <button class="b" data-a="exp">⬇ Sauvegarder JSON</button>
      <label class="b" style="margin:0;cursor:pointer">⬆ Restaurer JSON<input type="file" id="jf" accept=".json" hidden></label>
    </div>
    <div class="row"><button class="b p" onclick="$('dlg').close()">Fermer</button></div>`;
    $('jf').onchange=e=>{const r=new FileReader();r.onload=()=>{try{load(JSON.parse(r.result));upd();$('dlg').close();toast('Restauré !','ok')}catch(x){toast('Erreur','er')}};r.readAsText(e.target.files[0])};
    d.showModal();
  },
  sNote:(id,k,v)=>{const m=A.modules.find(x=>x.id===id); if(m){m[k]=v!==''?+v:null; upd();} },
  abs:(i)=>{const [id,v]=i.split('|'); const m=A.modules.find(x=>x.id===id); if(m){m.absences=Math.max(0,m.absences+(+v)); upd();} },
  chhal:(i)=>{
    const m=A.modules.find(x=>x.id===i); if(!m||m.cex===0) return toast("Coefficient examen invalide",'er');
    const tot=(m.ccc+m.ctp+m.cex), act=(m.ncc||0)*m.ccc + (m.ntp||0)*m.ctp;
    const req=((10*tot - act)/m.cex).toFixed(2);
    alert(req>20 ? `Impossible de valider (il te faut ${req}/20)` : req<=0 ? `Déjà validé ! (il te faut ${req}/20)` : `Il te faut ${req}/20 à l'examen pour valider à 10 de moyenne.`);
  },
  addMod:()=>modForm(), editMod:i=>modForm(A.modules.find(m=>m.id===i)),
  delMod:i=>{if(confirm('Supprimer ce module ?')){A.modules=A.modules.filter(x=>x.id!==i);upd()}},
  addCls:()=>{ask('Séance',[{k:'moduleId',l:'Module',t:'select',o:modOpts()},{k:'day',l:'Jour',t:'select',o:DAYS.map(d=>[d,d])},{k:'week',l:'Semaine',t:'select',o:[['all','Toutes'],['A','A'],['B','B']]},{k:'startTime',l:'Début',t:'time',r:1},{k:'endTime',l:'Fin',t:'time',r:1},{k:'room',l:'Salle',r:1}],v=>{A.timetable.push({id:uid('c'),...v});upd()})},
  addTask:()=>{ask('Échéance',[{k:'title',l:'Titre',r:1},{k:'moduleId',l:'Module',t:'select',o:modOpts()},{k:'type',l:'Type',t:'select',o:[['exam','Examen'],['homework','Devoir']]},{k:'dueDate',l:'Date',t:'datetime-local',r:1}],v=>{A.tasks.push({id:uid('t'),...v,completed:false});upd()})},
  editTask:i=>{const t=A.tasks.find(x=>x.id===i);ask('Modif',[{k:'title',l:'Titre',r:1,v:t.title},{k:'dueDate',l:'Date',t:'datetime-local',r:1,v:t.dueDate}],v=>{Object.assign(t,v);upd()})},
  done:i=>{const t=A.tasks.find(x=>x.id===i);if(t){t.completed=!t.completed;upd()}}, delTask:i=>{A.tasks=A.tasks.filter(x=>x.id!==i);upd()},
  addFc:()=>{ask('Fiche',[{k:'moduleId',l:'Module',t:'select',o:modOpts()},{k:'q',l:'Question',t:'textarea',r:1},{k:'a',l:'Réponse',t:'textarea',r:1}],v=>{A.flashcards.push({id:uid('f'),efactor:2.5,interval:0,repetition:0,nextRev:Date.now(),...v});upd()})},
  editFc:i=>{const f=A.flashcards.find(x=>x.id===i);ask('Fiche',[{k:'q',l:'Q',t:'textarea',v:f.q},{k:'a',l:'R',t:'textarea',v:f.a}],v=>{Object.assign(f,v);upd()})},
  delFc:i=>{A.flashcards=A.flashcards.filter(x=>x.id!==i);upd()},
  flip:(i,b)=>b.classList.toggle('fl'),
  sm2:(i,ev)=>{
    ev.stopPropagation(); const [id,q]=i.split('|'); const c=A.flashcards.find(f=>f.id===id);
    if(+q===1){c.repetition=0; c.interval=1;}
    else{
      if(c.repetition===0) c.interval=1;
      else if(c.repetition===1) c.interval=6;
      else c.interval=Math.round(c.interval*c.efactor);
      c.repetition++;
    }
    c.efactor=Math.max(1.3, c.efactor+(0.1-(3-(+q))*(0.08+(3-(+q))*0.02)));
    c.nextRev=Date.now()+c.interval*86400000;
    toast(`Planifié dans ${c.interval} j`,'ok'); upd();
  },
  aiFc:async(id)=>{
    const key = localStorage.getItem('eduVault_aiKey') || prompt("Entrez votre clé API Gemini (aistudio.google.com/apikey) :");
    if(!key) return; localStorage.setItem('eduVault_aiKey', key);
    const txt = prompt("Collez le texte du cours pour générer les fiches :"); if(!txt) return;
    toast("Génération par IA en cours...");
    try{
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:`Génère 5 flashcards Q/R en JSON strict : [{"q":"Question","a":"Réponse"}]. Texte: ${txt}`}]}],generationConfig:{temperature:0.2}})});
      const j = await res.json(), raw = j.candidates[0].content.parts[0].text;
      const cards = JSON.parse(raw.slice(raw.indexOf('['), raw.lastIndexOf(']')+1));
      cards.forEach(c => A.flashcards.push({id:uid('f'),moduleId:id,q:c.q,a:c.a,efactor:2.5,interval:0,repetition:0,nextRev:Date.now()}));
      toast(`${cards.length} fiches IA générées !`,'ok'); upd();
    }catch(e){toast("Erreur IA",'er')}
  },
  pmode:i=>{clearInterval(P.t);P.t=null;P.mode=i;P.total=P.left=PM[i][0];render()}, ptoggle:()=>{if(P.t){clearInterval(P.t);P.t=null;}else{P.end=Date.now()+P.left*1000;P.t=setInterval(ptick,300)}ppaint()}, preset:()=>{clearInterval(P.t);P.t=null;P.left=P.total;ppaint()},
  exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(A)],{type:'application/json'}));a.download='EduVault_Backup.json';a.click()},
  expics:()=>{
    let ics="BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//EduVault//FR\n";
    const now=new Date(), p=(n)=>String(n).padStart(2,'0');
    A.timetable.forEach(c=>{
      const d=DAYS.indexOf(c.day)+1; const dt=`202610${p(4+d)}`; // Simulation starting a Monday
      ics+=`BEGIN:VEVENT\nSUMMARY:${modName(c.moduleId)}\nRRULE:FREQ=WEEKLY;BYDAY=${c.day.substring(0,2).toUpperCase()}\nDTSTART;TZID=Europe/Paris:${dt}T${c.startTime.replace(':','')}00\nDTEND;TZID=Europe/Paris:${dt}T${c.endTime.replace(':','')}00\nEND:VEVENT\n`;
    });
    ics+="END:VCALENDAR";
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='EmploiDuTemps.ics';a.click(); toast("Calendrier exporté !");
  }
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.i,b)});
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)go(b.dataset.t)});
load(); if(localStorage.getItem('eduTheme')==='light')document.documentElement.classList.remove('dark'); go('da');
</script>
</body>
