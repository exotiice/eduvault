  const tk=++TTS.tok;ttsPaint();
  if(synth)synth.cancel();
  const txt=TTS.step===0?spoken(c.q):spoken(c.a);
  const ok=say(txt,TTS.rate,()=>{if(tk!==TTS.tok||!TTS.on)return;
    if(TTS.step===0){TTS.step=1;TTS.tm=setTimeout(ttsRun,Math.round(2600/TTS.rate))}else{TTS.step=0;TTS.i++;TTS.tm=setTimeout(ttsRun,900)}});
  if(ok===false&&!TTS.warned){TTS.warned=1;toast(Lg("Aucune voix arabe installée sur cet appareil (Réglages > Synthèse vocale).","No Arabic voice installed on this device (Settings > Text-to-speech).","لا يوجد صوت عربي مثبت على هذا الجهاز (الإعدادات > تحويل النص إلى كلام)."),'er')}}
function ttsStop(){TTS.on=false;TTS.tok++;clearTimeout(TTS.tm);if(synth)synth.cancel();TTS.q=[];const b=$('ttsb');if(b)b.hidden=true;try{TTS.wl&&TTS.wl.release()}catch(e){}TTS.wl=null}
Object.assign(act,{
  listen:async()=>{if(!synth)return toast(Lg("La lecture vocale n'est pas disponible sur ce navigateur.","Text-to-speech isn't available in this browser.","القراءة الصوتية غير متاحة في هذا المتصفح."),'er');
    const q=ttsCards();if(!q.length)return toast(Lg('Aucune fiche à écouter','No cards to listen to','لا توجد بطاقات للاستماع'),'er');
    TTS.q=q;TTS.i=0;TTS.step=0;TTS.on=true;TTS.warned=0;try{TTS.wl=await navigator.wakeLock.request('screen')}catch(e){}ttsRun()},
  ttsPlay:()=>{if(TTS.on){TTS.on=false;TTS.tok++;clearTimeout(TTS.tm);if(synth)synth.cancel();ttsPaint()}else{TTS.on=true;ttsRun()}},
  ttsNext:()=>{TTS.step=0;TTS.i=Math.min(TTS.q.length,TTS.i+1);if(TTS.on)ttsRun();else ttsPaint()},
  ttsPrev:()=>{TTS.step=0;TTS.i=Math.max(0,TTS.i-1);if(TTS.on)ttsRun();else ttsPaint()},
  ttsRate:v=>{TTS.rate=+v||1;if(TTS.on)ttsRun()},ttsStop,
  readNote:()=>{const nt=$('nt');if(!nt||!synth)return;if(synth.speaking){synth.cancel();return}
    const parts=chunks(spoken(nt.value.replace(/```[\s\S]*?```/g,' ')));let k=0;const nx=()=>{if(k<parts.length)say(parts[k++],1,nx)};nx()}
});
if(synth&&synth.addEventListener)synth.addEventListener('voiceschanged',()=>{});
/* boutons micro / lecture / langue dans la fenêtre de notes */
const _cls=window.clsDlg;
window.clsDlg=function(id){_cls.apply(this,arguments);const bar=document.querySelector('#dlg .nbar'),nt=$('nt');if(!bar||!nt)return;
  const lg=dictLang(),opt=(v,l)=>`<option value="${v}"${lg===v?' selected':''}>${l}</option>`;
  bar.insertAdjacentHTML('beforeend',`<button type="button" class="b" id="dictb" aria-label="${Lg('Dictée vocale','Voice dictation','إملاء صوتي')}">🎤</button><select id="dictl" aria-label="${Lg('Langue de dictée','Dictation language','لغة الإملاء')}">${opt('ar-MA','العربية (المغرب)')}${opt('ar-SA','العربية')}${opt('fr-FR','Français')}${opt('en-US','English')}</select><button type="button" class="b" data-a="readNote" aria-label="${Lg('Lire à voix haute','Read aloud','قراءة بصوت عال')}">🔊</button><small id="dictv" class="mu" style="flex-basis:100%"></small>`);
  $('dictb').onclick=()=>dictToggle(nt,$('dictb'),$('dictv'));$('dictl').onchange=e=>{LS('eduVault_dictLang',e.target.value);if(rec)rec.stop()};
  $('dlg').addEventListener('close',()=>{if(rec)rec.stop();if(synth)synth.cancel()},{once:true})};

/* ================= 7. Cartes à trous {{c1::mot}} + images avec zones masquées ================= */
const CZ=/\{\{c(\d+)::(.+?)(?:::(.+?))?\}\}/g;
const czIdx=src=>{const s=new Set();String(src).replace(CZ,(x,k)=>s.add(+k));return[...s].sort((a,b)=>a-b)};
const czFront=(src,n)=>String(src).replace(CZ,(x,k,a,h)=>+k===n?'[…]'+(h?' ('+h+')':''):a);
const czAns=(src,n)=>{const o=[];String(src).replace(CZ,(x,k,a)=>{if(+k===n)o.push(a)});return o.join(' ; ')};
const czFull=src=>String(src).replace(CZ,'$2');
function czSave(g,moduleId,src,extra){
  const idx=czIdx(src),old=A.flashcards.filter(f=>f.cz&&f.cz.g===g);
  idx.forEach(n=>{const o=old.find(f=>f.cz.n===n),a=czAns(src,n)+'\n\n'+czFull(src)+(extra?'\n'+extra:''),data={moduleId,q:czFront(src,n),a,cz:{g,n,src,extra:extra||''}};
    if(o)Object.assign(o,data);else A.flashcards.push(newCard(data))});
  A.flashcards=A.flashcards.filter(f=>!(f.cz&&f.cz.g===g&&!idx.includes(f.cz.n)));return idx.length}
function czForm(c){
  const g=c?c.cz.g:uid('cz'),first=c?c:null;
  ask(c?Lg('Modifier la carte à trous','Edit cloze card','تعديل بطاقة الفراغات'):Lg('Carte à trous','Cloze card','بطاقة الفراغات'),[
    {k:'moduleId',l:Lg('Module','Module','المادة'),t:'select',o:modOpts(),v:first&&first.moduleId},
    {k:'src',l:Lg('Texte avec {{c1::mot caché}}','Text with {{c1::hidden word}}','النص مع {{c1::كلمة مخفية}}'),t:'textarea',r:1,v:first&&first.cz.src},
    {k:'extra',l:Lg('Remarque (optionnel)','Note (optional)','ملاحظة (اختياري)'),t:'textarea',v:first&&first.cz.extra}],
    v=>{const n=czSave(g,v.moduleId,v.src.trim(),(v.extra||'').trim());if(!n)return toast(Lg("Aucun trou : écris par exemple {{c1::mot}}","No blank: write for example {{c1::word}}","لا فراغ: اكتب مثلا {{c1::كلمة}}"),'er');upd();toast(n+' '+Lg('fiche(s) créée(s)','card(s) saved','بطاقة محفوظة'),'ok')});
  const ta=document.querySelector('#dlg textarea[name=src]');if(!ta)return;
  const bar=document.createElement('div');bar.className='row';bar.style.justifyContent='flex-start';
  bar.innerHTML=`<button type="button" class="b" id="czw">{{…}} ${Lg('Masquer la sélection','Hide selection','إخفاء المحدد')}</button><small class="mu">${Lg('Même numéro = masqués ensemble, numéros différents = une fiche chacun.','Same number = hidden together; different numbers = one card each.','نفس الرقم = يخفيان معا، أرقام مختلفة = بطاقة لكل رقم.')}</small>`;
  ta.closest('label').after(bar);
  $('czw').onclick=()=>{const a=ta.selectionStart,b=ta.selectionEnd;if(a===b)return toast(Lg('Sélectionne d\'abord un mot dans le texte','Select a word in the text first','حدد كلمة في النص أولا'),'er');
    const used=czIdx(ta.value),n=(used.length?Math.max(...used):0)+1;ta.setRangeText('{{c'+n+'::'+ta.value.slice(a,b)+'}}',a,b,'end');ta.focus()}}
/* images à masquer */
const IO={img:'',rects:[],drag:null};
function ioOpen(){
  if(needMod())return;IO.img='';IO.rects=[];
  dlgShow(`<h3>🖼 ${Lg('Image avec zones masquées','Image occlusion','صورة بمناطق مخفية')}</h3>
   <p class="mu">${Lg("Choisis un schéma (circuit, anatomie…), puis dessine des rectangles sur les parties à retenir.","Pick a diagram (circuit, anatomy…), then draw rectangles over the parts to memorise.","اختر مخططا (دارة، تشريح…) ثم ارسم مستطيلات على الأجزاء المطلوب حفظها.")}</p>
   <select id="iom">${modOpts().map(m=>`<option value="${m[0]}">${esc(m[1])}</option>`).join('')}</select>
   <input id="iot" maxlength="60" placeholder="${Lg('Titre (ex. Montage amplificateur)','Title (e.g. Amplifier circuit)','العنوان (مثال: دارة مضخم)')}">
   <input type="file" id="iof" accept="image/*">
   <div id="ioc" class="ioc" hidden><div class="iob" id="iob"><img id="ioi" alt=""><div id="ioo" class="ioo"></div></div></div>
   <div id="iol" class="iol"></div>
   <div class="row"><button class="b" data-a="ioUndo">↶ ${Lg('Annuler le dernier','Undo last','تراجع')}</button><button class="b" onclick="$('dlg').close()">${tr('Annuler')}</button><button class="b p" data-a="ioSave">${Lg('Créer les fiches','Create cards','إنشاء البطاقات')}</button></div>`);
  $('iof').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{IO.img=await shrink(f,1000,.72)}catch(x){return toast(Lg('Image illisible','Unreadable image','صورة غير مقروءة'),'er')}
    IO.rects=[];$('ioi').src=IO.img;$('ioc').hidden=false;ioPaint();ioWire()}}
function ioPaint(){
  $('ioo').innerHTML=IO.rects.map((r,i)=>`<i class="iom act" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%">${i+1}</i>`).join('');
  $('iol').innerHTML=IO.rects.map((r,i)=>`<label class="rlr"><span>${Lg('Masque','Mask','قناع')} ${i+1}</span><input maxlength="80" placeholder="${Lg('Réponse (ex. R1, Diode…)','Answer (e.g. R1, diode…)','الإجابة (مثال: R1، ثنائي…)')}" value="${esc(r.l||'')}" oninput="act.ioLbl(${i},this.value)"><button type="button" class="x-btn" data-a="ioDel" data-i="${i}" aria-label="${tr('Supprimer')}">✕</button></label>`).join('')}
function ioWire(){
  const ov=$('ioo');ov.onpointerdown=e=>{if(e.target!==ov)return;e.preventDefault();const b=ov.getBoundingClientRect();IO.drag={x0:(e.clientX-b.left)/b.width*100,y0:(e.clientY-b.top)/b.height*100,b};
    const el=document.createElement('i');el.className='iom act';ov.append(el);IO.drag.el=el;ov.setPointerCapture(e.pointerId)};
  ov.onpointermove=e=>{const d=IO.drag;if(!d)return;const x=clamp((e.clientX-d.b.left)/d.b.width*100,0,100),y=clamp((e.clientY-d.b.top)/d.b.height*100,0,100);
    d.r={x:Math.min(d.x0,x),y:Math.min(d.y0,y),w:Math.abs(x-d.x0),h:Math.abs(y-d.y0)};Object.assign(d.el.style,{left:d.r.x+'%',top:d.r.y+'%',width:d.r.w+'%',height:d.r.h+'%'})};
  ov.onpointerup=ov.onpointercancel=()=>{const d=IO.drag;IO.drag=null;if(!d)return;if(d.r&&d.r.w>2&&d.r.h>2&&IO.rects.length<30)IO.rects.push({x:+d.r.x.toFixed(2),y:+d.r.y.toFixed(2),w:+d.r.w.toFixed(2),h:+d.r.h.toFixed(2),l:''});ioPaint()}}
function ioHtml(f,rev){const s=A.ioSets&&A.ioSets[f.io.g];if(!s)return'';
  return`<div class="iob"><img src="${s.img}" alt="">${s.rects.map((r,i)=>{const a=i===f.io.n;return`<i class="iom${a?' act':''}${rev?(a?' rev':' off'):''}" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%">${a&&!rev?'?':''}</i>`}).join('')}</div>`}
window.__ioHtml=ioHtml;
Object.assign(act,{
  addCloze:()=>{if(!needMod())czForm(null)},addIO:ioOpen,
  ioLbl:(i,v)=>{if(IO.rects[i])IO.rects[i].l=v},ioDel:i=>{IO.rects.splice(+i,1);ioPaint()},ioUndo:()=>{IO.rects.pop();ioPaint()},
  ioSave:()=>{if(!IO.img||!IO.rects.length)return toast(Lg('Ajoute une image et au moins un masque','Add an image and at least one mask','أضف صورة وقناعا واحدا على الأقل'),'er');
    const g=uid('io'),mid=$('iom').value,title=($('iot').value||Lg('Schéma','Diagram','مخطط')).trim();A.ioSets=A.ioSets||{};A.ioSets[g]={img:IO.img,rects:IO.rects.map(r=>({...r}))};
    IO.rects.forEach((r,n)=>A.flashcards.push(newCard({moduleId:mid,q:title+' · '+Lg('Que cache le masque','What does mask','ماذا يخفي القناع')+' '+(n+1)+' ?',a:r.l||Lg('Voir le schéma','See the diagram','انظر المخطط'),io:{g,n}})));
    $('dlg').close();upd();toast(IO.rects.length+' '+Lg('fiche(s) créée(s)','card(s) created','بطاقة منشأة'),'ok');IO.img='';IO.rects=[]}});
const _edit=act.editFc;act.editFc=function(i){const f=A.flashcards.find(x=>x.id===i);if(f&&f.cz)return czForm(f);return _edit.apply(this,arguments)};
/* nettoyage des images orphelines */
const _save=window.save;window.save=function(){const r=_save.apply(this,arguments);
  if(A.ioSets){const live=new Set(A.flashcards.filter(f=>f.io).map(f=>f.io.g));Object.keys(A.ioSets).forEach(g=>{if(!live.has(g))delete A.ioSets[g]})}return r};
const _fc=R.fc;R.fc=function(){return _fc().replace('<button class="b p" data-a="addFc">',`<button class="b" data-a="listen" title="${Lg('Écouter les fiches','Listen to cards','استمع للبطاقات')}">🎧</button><button class="b" data-a="addCloze" title="${Lg('Carte à trous','Cloze card','بطاقة الفراغات')}">{{…}}</button><button class="b" data-a="addIO" title="${Lg('Image à masquer','Image occlusion','صورة بمناطق مخفية')}">🖼</button><button class="b p" data-a="addFc">`)};

})();
</script>

<script>
/* ===== v22 : suivi du site ENIAD (lit data/timetables.json et data/events.json publiés par le robot GitHub) ===== */
(function(){
const feedUrl=()=>LS('eduVault_enfeed')||'data/timetables.json',evsUrl=()=>feedUrl().replace(/timetables\.json(\?.*)?$/,'events.json');
const EN={feed:null,events:[],err:'',last:0,prevSeen:'',alerted:false};
const cfg=()=>{const s=A.settings;if(!s.eniad||typeof s.eniad!=='object')s.eniad={cls:'',hash:'',seen:''};return s.eniad};
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’'`]/g,' ').replace(/[^a-z0-9 ]/gi,' ').replace(/\s+/g,' ').trim().toLowerCase();
const sig=t=>new Set(norm(t).split(' ').filter(w=>w.length>=4));
function score(a,b){const x=sig(a),y=sig(b);if(!x.size||!y.size)return 0;let n=0;x.forEach(w=>{if(y.has(w))n++});return n/Math.min(x.size,y.size)}
const items=()=>EN.feed?[...(EN.feed.news||[]),...(EN.feed.docs||[]).filter(d=>!(EN.feed.tables&&Object.values(EN.feed.tables).some(t=>t.src===d.u)))]:[];
const iso_=x=>String(x||'');
const mine_=()=>/eniad/i.test(A.settings.school||'')||!!cfg().cls;
function unseen(){const s=cfg().seen;if(!EN.feed||!s)return 0;return items().filter(i=>iso_(i.first)>s||iso_(i.changed)>s).length}
function ttNew(){const c=cfg();return !!(EN.feed&&c.cls&&EN.feed.tables&&EN.feed.tables[c.cls]&&EN.feed.tables[c.cls].hash!==c.hash&&EN.feed.tables[c.cls].hash!==c.ign)}
const fdate=x=>{try{return new Date(x).toLocaleDateString(LOC(),{day:'numeric',month:'short',year:'numeric'})}catch(e){return''}};
async function load(){
  try{const r=await fetch(feedUrl(),{cache:'no-cache'});if(!r.ok)throw Error(r.status===404?'404':'HTTP '+r.status);EN.feed=await r.json();EN.err='';
    try{const e=await fetch(evsUrl(),{cache:'no-cache'});EN.events=e.ok?await e.json():[]}catch(x){EN.events=[]}}
  catch(e){EN.err=e.message}
  EN.last=Date.now();
  if(EN.feed&&!cfg().seen){cfg().seen=EN.feed.checked||new Date().toISOString();save()}
  if(EN.feed&&mine_()&&!EN.alerted&&(unseen()||ttNew())){EN.alerted=true;toast('🏛 '+(ttNew()?Lg('Emploi du temps ENIAD modifié : à confirmer','ENIAD timetable changed: please confirm','تغيّر جدول ENIAD: يرجى التأكيد'):unseen()+' '+Lg('nouveauté(s) ENIAD','ENIAD update(s)','مستجدات ENIAD')))}
  if(tab==='da'||tab==='se')render()}
/* carte en haut de « Aujourd'hui » */
const _da=R.da;R.da=function(){const h=_da.apply(this,arguments),n=unseen(),t=ttNew();
  if(!EN.feed||!mine_()||(!n&&!t&&cfg().cls))return h;
  const msg=t?Lg('Emploi du temps modifié : touche pour voir les changements','Timetable changed: tap to review','تغيّر الجدول: اضغط للمراجعة'):n?n+' '+Lg('nouveauté(s) sur le site','update(s) on the site','مستجدات على الموقع'):Lg('Choisis ta classe pour suivre ton emploi du temps','Pick your class to follow your timetable','اختر قسمك لمتابعة جدولك');
  return`<div class="c enc" data-a="eniad" role="button" tabindex="0"><span class="enb">🏛</span><span><b>ENIAD</b><small class="mu">${esc(msg)}</small></span><i class="chev"></i></div>`+h};
/* fenêtre « Nouveautés ENIAD » */
function open_(){
  const f=EN.feed;EN.prevSeen=cfg().seen||'';
  if(!f){dlgShow(`<h3>🏛 ${Lg('Nouveautés ENIAD','ENIAD updates','مستجدات ENIAD')}</h3><p class="mu">${Lg("Le suivi n'est pas encore actif : le fichier data/timetables.json est introuvable"+(EN.err?' ('+EN.err+')':'')+". Active le robot GitHub (voir LISEZ-MOI).","Tracking isn't active yet: data/timetables.json was not found. Enable the GitHub robot (see README).","التتبع غير مفعل بعد: الملف data/timetables.json غير موجود. فعّل روبوت GitHub (راجع LISEZ-MOI).")}</p><div class="row"><button class="b" data-a="enSrc">⚙ ${Lg('Source des données','Data source','مصدر البيانات')}</button><button class="b" data-a="enRefresh">⟳</button>${closeBtn()}</div>`);return}
  const c=cfg(),tb=f.tables||{},prev=EN.prevSeen,isNew=i=>prev&&(iso_(i.first)>prev||iso_(i.changed)>prev);
  const ttHtml=Object.keys(tb).length?Object.keys(tb).map(cls=>{const t=tb[cls],mine=c.cls===cls,stale=mine&&c.hash!==t.hash;
    return`<div class="rs enr"><span><b>${esc(cls)}</b>${mine?` <span class="chip" style="margin:0">${Lg('ma classe','my class','قسمي')}</span>`:''}${stale?` <span class="pr h">${Lg('modifié','changed','تغيّر')}</span>`:''}<small class="mu">${esc(t.sem||'')} · ${t.sessions.length} ${Lg('séances','sessions','حصة')}${t.changed?' · '+fdate(t.changed):''}</small></span><button class="b${!mine||stale?' p':''}" data-a="${stale?'enReview':'enApply'}" data-i="${esc(cls)}">${mine?(stale?Lg('Voir les changements','Review changes','عرض التغييرات'):Lg('Réappliquer','Re-apply','إعادة التطبيق')):Lg('Utiliser','Use','استعمال')}</button></div>`}).join(''):`<p class="mu e">${Lg("Aucun emploi du temps lu pour l'instant.","No timetable read yet.","لم يتم قراءة أي جدول بعد.")}</p>`;
  const ev=(EN.events||[]).slice(0,8),ic={news:'📰',doc:'📕','doc-changed':'📕','tt-new':'🗓','tt-changed':'🗓'};
  const evHtml=ev.length?ev.map(e=>`<div class="enl">${ic[e.k]||'•'} <span>${e.u?`<a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.t)}</a>`:esc(e.t)}<small class="mu"> · ${fdate(e.ts)}</small></span></div>`).join(''):'';
  const all=items().sort((a,b)=>iso_(b.changed||b.first)>iso_(a.changed||a.first)?1:-1).slice(0,40);
  const nwHtml=all.length?all.map(i=>`<div class="enl">${i.pdf!==undefined||/\.pdf/i.test(i.u)?'📕':'📰'} <span><a href="${esc(i.u)}" target="_blank" rel="noopener">${esc(i.t)}</a>${isNew(i)?' <span class="pr h">NEW</span>':''}<small class="mu"> · ${fdate(i.changed||i.first)}</small></span></div>`).join(''):`<p class="mu e">—</p>`;
  const pages=[...new Set([...(f.news||[]),...(f.docs||[])].map(i=>i.page).filter(Boolean))];
  dlgShow(`<h3>🏛 ${Lg('Nouveautés ENIAD','ENIAD updates','مستجدات ENIAD')}</h3>
    <small class="mu">${f.checked?Lg('Dernière vérification du site','Site last checked','آخر فحص للموقع')+' : '+new Date(f.checked).toLocaleString(LOC()):''}${f.status&&f.status.err&&f.status.err.length?' · ⚠️ '+f.status.err.length+' '+Lg('erreur(s)','error(s)','خطأ'):''}</small>
    <h4 style="margin:12px 0 4px">${Lg('Emplois du temps','Timetables','جداول الحصص')}</h4>${ttHtml}
    ${evHtml?`<h4 style="margin:14px 0 4px">${Lg('Derniers changements','Latest changes','آخر التغييرات')}</h4>${evHtml}`:''}
    <h4 style="margin:14px 0 4px">${Lg('Sur le site','On the website','على الموقع')}</h4><div class="gcl">${nwHtml}</div>
    <details style="margin-top:8px"><summary class="mu">${Lg('Pages surveillées','Watched pages','الصفحات المراقبة')} (${pages.length})</summary>${pages.map(p=>`<div class="enl"><a href="${esc(p)}" target="_blank" rel="noopener">${esc(p.replace('https://',''))}</a></div>`).join('')}<p class="mu"><small>${Lg("Pour en ajouter : watcher/sources.json dans ton dépôt GitHub.","To add more: watcher/sources.json in your GitHub repo.","للإضافة: ملف watcher/sources.json في مستودع GitHub.")}</small></p></details>

  const ls=f.checked||new Date().toISOString();let mx=ls;items().forEach(i=>{if(iso_(i.first)>mx)mx=iso_(i.first);if(iso_(i.changed)>mx)mx=iso_(i.changed)});cfg().seen=mx;save();render()}
/* appliquer un emploi du temps à mon appli (avec correspondance des modules) */
function enMap(cls){
  const t=EN.feed.tables[cls],names=[...new Set(t.sessions.map(s=>s.m))],mine=A.modules.filter(m=>m.semester===A.activeSemester);
  window.__enNames=names;window.__enCls=cls;
  const row=(nm,i)=>{let best=null,bs=0;mine.forEach(m=>{const s=Math.max(score(nm,m.name),norm(nm)===norm(m.name)?1:0);if(s>bs){bs=s;best=m}});
    return`<div class="rs icsr"><div><b>${esc(nm)}</b></div><select id="enm${i}"><option value="new">➕ ${Lg('Créer ce module','Create this module','إنشاء هذه المادة')}</option>${mine.map(m=>`<option value="${m.id}"${best&&bs>=.6&&best.id===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select></div>`};
  dlgShow(`<h3>🗓 ${esc(cls)} → ${esc(A.activeSemester)}</h3><p class="mu">${Lg("Associe chaque matière de l'école à tes modules (ou crée-les). Tes séances ajoutées à la main ne sont pas supprimées.","Match each school subject to your modules (or create them). Sessions you added by hand are kept.","اربط كل مادة بمواد تطبيقك (أو أنشئها). الحصص التي أضفتها يدويا لا تُحذف.")}</p><div class="gcl">${names.map(row).join('')}</div>
   <div class="row"><button class="b" data-a="eniad">‹</button><button class="b p" data-a="enDo">${Lg('Appliquer','Apply','تطبيق')}</button></div>`)}
function enRun(cls,pick){
  const t=EN.feed.tables[cls],names=[...new Set(t.sessions.map(x=>x.m))],sem=A.activeSemester,map={};
  {const cf=cfg(),cur=new Set(A.timetable.filter(c=>c.en===cls).map(enSkipKey));if(cf.cls&&cf.cls!==cls)cf.skip=[];cf.skip=(cf.skip||[]).filter(k=>!cur.has(k))}
  A.timetable=A.timetable.filter(c=>c.en!==cls);
  names.forEach((nm,i)=>{let id=pick(nm,i);const pf=(t.sessions.find(x=>x.m===nm&&x.p&&!/affecter/i.test(x.p))||{}).p||'';
    if(id==='new'||!A.modules.some(x=>x.id===id)){const m={id:uid('m'),semester:sem,name:nm.slice(0,120),prof:pf,coeff:1,color:nextModColor(),ccc:0,ctp:0,cex:1,ncc:null,ntp:null,nex:null,absences:0,pomo:0,resources:[]};A.modules.push(m);id=m.id}
    else{const m=A.modules.find(x=>x.id===id);if(m&&!m.prof&&pf)m.prof=pf}map[nm]=id});
  let n=0;t.sessions.forEach(x=>{const day=DAYS.find(d=>norm(d)===norm(x.d));if(!day||!map[x.m])return;
    if((cfg().skip||[]).includes([map[x.m],day,x.s,x.e,x.w||'all'].join('|')))return;
    const dup=A.timetable.find(c=>!c.date&&c.moduleId===map[x.m]&&c.day===day&&c.startTime===x.s&&c.endTime===x.e);
    if(dup){dup.room=x.r||dup.room;dup.week=x.w||'all';dup.en=cls;n++;return}
    A.timetable.push({id:uid('c'),moduleId:map[x.m],day,week:x.w||'all',startTime:x.s,endTime:x.e,room:x.r||'—',en:cls});n++});
  const c=cfg();c.cls=cls;c.hash=t.hash;c.ign='';c.snap=t.sessions.map(x=>[x.m,x.d,x.s,x.e,x.r||'',x.w||'all']);c.map=map;save();if($('dlg').open)$('dlg').close();upd();toast(n+' '+Lg('séances appliquées à','sessions applied to','حصة طُبقت على')+' '+sem,'ok')}
function enDiff(cls){
  const t=EN.feed.tables[cls],old=cfg().snap;if(!old)return null;
  const nw=t.sessions.map(x=>[x.m,x.d,x.s,x.e,x.r||'',x.w||'all']),used=new Set(),added=[],removed=[],changed=[],rest=[];
  old.forEach(o=>{const j=nw.findIndex((n,i)=>!used.has(i)&&n[0]===o[0]&&n[1]===o[1]&&n[5]===o[5]&&n[2]===o[2]&&n[3]===o[3]);if(j>=0){used.add(j);if(nw[j][4]!==o[4])changed.push({from:o,to:nw[j]})}else rest.push(o)});
  const left=nw.filter((n,i)=>!used.has(i));
  rest.forEach(o=>{const j=left.findIndex(n=>n[0]===o[0]&&n[1]===o[1]&&n[5]===o[5]);if(j>=0){changed.push({from:o,to:left[j]});left.splice(j,1)}else removed.push(o)});
  left.forEach(n=>added.push(n));return{added,removed,changed}}
function enReview(cls){
  const t=EN.feed.tables[cls],d=enDiff(cls),L=r=>`<b>${esc(r[0])}</b><small class="mu"> ${esc(r[1])} ${esc(r[2])}–${esc(r[3])} · ${esc(r[4]||'—')}${r[5]!=='all'?' · '+Lg('Sem.','Wk','أسبوع')+' '+esc(r[5]):''}</small>`;
  const sec=(ic,tt,arr,f)=>arr.length?`<h4 style="margin:12px 0 4px">${ic} ${tt} (${arr.length})</h4>${arr.map(x=>`<div class="enl">${f(x)}</div>`).join('')}`:'';
  const body=d?(sec('➕',Lg('Ajoutées','Added','مضافة'),d.added,L)+sec('➖',Lg('Supprimées','Removed','محذوفة'),d.removed,L)+sec('✏️',Lg('Modifiées','Changed','معدّلة'),d.changed,x=>`${L(x.from)}<br>→ ${L(x.to)}`)||`<p class="mu">${Lg('Aucune différence sur les séances (seul le fichier a changé).','No differences in sessions (only the file changed).','لا فرق في الحصص (تغيّر الملف فقط).')}</p>`):`<p class="mu">${Lg("Nouvelle version : "+t.sessions.length+" séances. Tu n'as pas encore de version de référence pour comparer.","New version: "+t.sessions.length+" sessions. There is no earlier version to compare with.","نسخة جديدة: "+t.sessions.length+" حصة. لا توجد نسخة سابقة للمقارنة.")}</p>`;
  dlgShow(`<h3>🏛 ${esc(cls)} · ${Lg('changements','changes','التغييرات')}</h3><p class="mu">${Lg("Rien n'est modifié dans ton emploi du temps tant que tu ne confirmes pas. Tes séances ajoutées à la main (dont les supplémentaires) ne sont jamais touchées.","Nothing changes in your timetable until you confirm. Sessions you added by hand (including extra ones) are never touched.","لا يتغير جدولك حتى تؤكد. الحصص التي أضفتها يدويا (ومنها الإضافية) لا تُمَسّ.")}</p><div class="gcl">${body}</div>
   <div class="row"><button class="b" data-a="enIgnore" data-i="${esc(cls)}">${Lg('Ignorer cette version','Ignore this version','تجاهل هذه النسخة')}</button><button class="b" onclick="$('dlg').close()">${Lg('Plus tard','Later','لاحقا')}</button><button class="b p" data-a="enConfirm" data-i="${esc(cls)}">✅ ${Lg('Confirmer et appliquer','Confirm and apply','تأكيد وتطبيق')}</button></div>`)}
Object.assign(act,{
  eniad:()=>{if(!EN.feed&&!EN.err)load().then(open_);else open_()},
  enRefresh:async()=>{await load();open_()},
  enSrc:()=>ask(Lg('Source des données ENIAD','ENIAD data source','مصدر بيانات ENIAD'),[{k:'u',l:Lg("Adresse de timetables.json (vide = data/timetables.json de ce site). Ex. https://raw.githubusercontent.com/TON-COMPTE/TON-DEPOT/main/data/timetables.json","URL of timetables.json (empty = this site's data/timetables.json). E.g. https://raw.githubusercontent.com/YOU/REPO/main/data/timetables.json","عنوان timetables.json (فارغ = ملف هذا الموقع). مثال: https://raw.githubusercontent.com/YOU/REPO/main/data/timetables.json"),v:LS('eduVault_enfeed')||''}],v=>{const u=(v.u||'').trim();if(u&&!/^https:\/\//i.test(u)&&!/^\.?\/?data\//.test(u))return toast(Lg('Adresse https:// attendue','Expected an https:// address','المطلوب عنوان https://'),'er');if(u)LS('eduVault_enfeed',u);else localStorage.removeItem('eduVault_enfeed');EN.feed=null;EN.err='';load().then(open_)}),
  enApply:cls=>enMap(cls),
  enDo:()=>enRun(window.__enCls,(nm,i)=>$('enm'+i).value),
  enReview:cls=>enReview(cls),
  enConfirm:cls=>{const t=EN.feed.tables[cls],names=[...new Set(t.sessions.map(x=>x.m))],mp=cfg().map||{};if(!names.every(n=>mp[n]&&A.modules.some(m=>m.id===mp[n])))return enMap(cls);enRun(cls,nm=>mp[nm])},
  enIgnore:cls=>{cfg().ign=EN.feed.tables[cls].hash;save();$('dlg').close();render()}});
window.__eniad={EN,load,unseen,ttNew,score,norm};
setTimeout(load,1500);
setInterval(()=>{if(document.visibilityState==='visible'&&Date.now()-EN.last>30*6e4)load()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-EN.last>10*6e4)load()});
})();

<script>
/* ===== v24 : séances supplémentaires (ajoutées à la main quand un prof en annonce une) ===== */
(function(){
const KINDS=()=>[['extra',Lg('Séance supplémentaire','Extra session','حصة إضافية')],['rattrapage',Lg('Rattrapage','Make-up session','حصة استدراكية')],['remplacement',Lg('Remplacement','Replacement','تعويض')]];
const wdOf=d=>DAYS[(new Date(d+'T00:00').getDay()+6)%7];
const tmin=x=>{const[h,m]=String(x).split(':');return+h*60+ +m};
function extraForm(c,draft){
  const S=draft||c||{};
  ask(c?Lg('Modifier la séance supplémentaire','Edit extra session','تعديل الحصة الإضافية'):'➕ '+Lg('Séance supplémentaire','Extra session','حصة إضافية'),[
    {k:'moduleId',l:Lg('Module','Module','المادة'),t:'select',o:modOpts(),v:S.moduleId},
    {k:'date',l:Lg('Date','Date','التاريخ'),t:'date',r:1,v:S.date||iso(new Date())},
    {k:'startTime',l:Lg('Début','Start','البداية'),t:'time',r:1,v:S.startTime},
    {k:'endTime',l:Lg('Fin','End','النهاية'),t:'time',r:1,v:S.endTime},
    {k:'room',l:Lg('Salle ou amphi','Room','القاعة'),v:S.room},
    {k:'kind',l:Lg('Type','Type','النوع'),t:'select',o:KINDS(),v:S.ex||'extra'},
    {k:'prof',l:Lg('Annoncée par (prof, facultatif)','Announced by (teacher, optional)','أعلن عنها (الأستاذ، اختياري)'),v:S.prof},
    {k:'note',l:Lg('Note (facultatif)','Note (optional)','ملاحظة (اختياري)'),t:'textarea',v:S.note}],
    v=>{
      const back=m=>{toast(m,'er');extraForm(c,{moduleId:v.moduleId,date:v.date,startTime:v.startTime,endTime:v.endTime,room:v.room,ex:v.kind,prof:v.prof,note:v.note})};
      if(!v.date)return back(Lg('Choisis une date','Pick a date','اختر تاريخا'));
      if(!(tmin(v.endTime)>tmin(v.startTime)))return back(Lg("L'heure de fin doit être après le début","End must be after start","يجب أن تكون النهاية بعد البداية"));
      const o={moduleId:v.moduleId,date:v.date,day:wdOf(v.date),week:'once',startTime:v.startTime,endTime:v.endTime,room:(v.room||'').trim()||'—',ex:v.kind||'extra',prof:(v.prof||'').trim(),note:(v.note||'').trim()};
      /* avertit (sans bloquer) si ça tombe sur un cours habituel */
      const dd=new Date(v.date+'T00:00'),w=weekOfDate(dd),clash=A.timetable.filter(x=>(!c||x.id!==c.id)&&curIds().has(x.moduleId)&&x.day===o.day&&(x.date?x.date===v.date:(x.week==='all'||x.week===w))&&tmin(x.startTime)<tmin(o.endTime)&&tmin(x.endTime)>tmin(o.startTime));
      if(c)Object.assign(c,o);else A.timetable.push({id:uid('c'),...o});
      upd();const when=dd.toLocaleDateString(LOC(),{weekday:'long',day:'numeric',month:'long'});
      toast(Lg('Séance ajoutée : ','Session added: ','تمت إضافة الحصة: ')+when+(clash.length?' · ⚠️ '+Lg('chevauche un autre cours','overlaps another class','تتداخل مع حصة أخرى'):''),clash.length?'':'ok')})}
Object.assign(act,{addExtra:()=>{if(!needMod())extraForm(null)}});
const _edit=act.editCls;act.editCls=function(i){const c=A.timetable.find(x=>x.id===i);if(c&&c.date){$('dlg').close();return extraForm(c)}return _edit.apply(this,arguments)};
/* liste des séances supplémentaires à venir, sous l'emploi du temps */
const _tt=R.tt;
R.tt=function(){const h=_tt.apply(this,arguments),today=iso(new Date());
  const l=A.timetable.filter(c=>c.date&&c.date>=today&&curIds().has(c.moduleId)).sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime));
  if(!l.length)return h;const kl=Object.fromEntries(KINDS());
  return h+`<div class="c" style="margin-top:12px"><h4>➕ ${Lg('Séances supplémentaires à venir','Upcoming extra sessions','الحصص الإضافية القادمة')}</h4>${l.map(c=>`<div class="cl" data-a="cls" data-i="${c.id}" style="${tint(modCol(c.moduleId))}"><small class="br">${esc(new Date(c.date+'T00:00').toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'short'}))} · ${esc(c.startTime)} – ${esc(c.endTime)}</small><b>${esc(modName(c.moduleId))} <span class="pr h">${esc(kl[c.ex]||kl.extra)}</span></b><small class="mu">📍 ${esc(c.room)}${c.prof?' · 👤 '+esc(c.prof):''}${c.note?' · '+esc(c.note):''}</small></div>`).join('')}</div>`};
/* ménage : on oublie les séances ponctuelles vieilles de plus de 30 jours */
setTimeout(()=>{const lim=iso(new Date(Date.now()-30*864e5)),n=A.timetable.length;A.timetable=A.timetable.filter(c=>!c.date||c.date>=lim);if(A.timetable.length!==n)save()},1200);
})();
</script>
<script>
/* Accueil enrichi : coup d'oeil, prochain cours (compte a rebours), prochain examen, raccourcis, demain */
(function(){
  if(typeof R==='undefined'||!R.da)return;
  const _h=R.da;
  const mins=x=>{const p=String(x||'0:0').split(':');return(+p[0])*60+(+p[1]||0)};
  const dur=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+String(m%60).padStart(2,'0'):'');
  const dayCls=(d,wk)=>{
    const hol=isHol(iso(d)),name=DAYS[(d.getDay()+6)%7];
    return A.timetable.filter(c=>curIds().has(c.moduleId)&&c.day===name&&(c.date?c.date===iso(d):(!hol&&(c.week==='all'||c.week===wk)))).sort((a,b)=>a.startTime.localeCompare(b.startTime));
  };
  const row=(c,label)=>`<div class="cl" data-a="cls" data-i="${c.id}" style="${tint(modCol(c.moduleId))}"><small class="br">${label}</small><b>${esc(modName(c.moduleId))}${xTag(c)}</b><small class="mu">📍 ${esc(c.room||'')}</small></div>`;
  function plus(){
    if(!curIds().size)return '';
    const now=new Date(),nm=now.getHours()*60+now.getMinutes(),wk=curWeek();
    const today=dayCls(now,wk),tmr=new Date(now.getTime()+864e5);
    const tom=dayCls(tmr,monday(tmr).getTime()===monday(now).getTime()?wk:(wk==='A'?'B':'A'));
    const left=today.filter(c=>mins(c.endTime)>nm).length;
    const due=A.tasks.filter(x=>curIds().has(x.moduleId)&&!x.completed&&x.type!=='review'&&new Date(x.dueDate).getTime()<now.getTime()+7*864e5).length;
    const nFc=A.flashcards.filter(f=>curIds().has(f.moduleId)&&(!f.nextRev||f.nextRev<=now.getTime())).length;
    let out=`<div class="c"><h4>📌 ${Lg("En un coup d'œil",'At a glance','نظرة سريعة')}</h4><div class="st"><div data-a="go" data-i="tt"><b>${left}</b><small class="mu">${Lg('cours restants','classes left','حصص متبقية')}</small></div><div data-a="go" data-i="ag"><b>${due}</b><small class="mu">${Lg('à rendre (7 j)','due (7 d)','مهام (7 أيام)')}</small></div><div data-a="go" data-i="fc"><b>${nFc}</b><small class="mu">${Lg('fiches à réviser','cards to review','بطاقات للمراجعة')}</small></div></div></div>`;
    /* prochain cours */
    const live=today.find(c=>mins(c.startTime)<=nm&&nm<mins(c.endTime)),nxt=today.find(c=>mins(c.startTime)>nm);
    let nc='';
    if(live)nc=row(live,'● '+Lg('En cours · fin dans ','Now · ends in ','جارية · تنتهي بعد ')+dur(mins(live.endTime)-nm));
    else if(nxt)nc=row(nxt,Lg('Dans ','In ','بعد ')+dur(mins(nxt.startTime)-nm)+' · '+esc(nxt.startTime));
    else if(tom[0])nc=row(tom[0],Lg('Demain à ','Tomorrow at ','غدا على ')+esc(tom[0].startTime));
    if(nc)out+=`<div class="c tod"><h4>⏭ ${Lg('Prochain cours','Next class','الحصة القادمة')}</h4>${nc}</div>`;
    /* prochain examen */
    const ex=A.tasks.filter(x=>curIds().has(x.moduleId)&&!x.completed&&x.type==='exam'&&new Date(x.dueDate)>now).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate))[0];
    if(ex){
      const dd=new Date(ex.dueDate),j=Math.max(0,Math.ceil((dd-now)/864e5)),lc={fr:'fr-FR',en:'en-GB',ar:'ar',ary:'ar-MA'}[LANG()]||'fr-FR';
      out+=`<div class="c"><h4>🚨 ${Lg('Prochain examen','Next exam','الامتحان القادم')}</h4><div class="cl" data-a="go" data-i="ag" style="${tint(modCol(ex.moduleId))}"><small class="br">${j===0?Lg("Aujourd'hui",'Today','اليوم'):'J-'+j} · ${esc(dd.toLocaleDateString(lc,{weekday:'short',day:'numeric',month:'short'}))}</small><b>${esc(ex.title)}</b><small class="mu">${esc(modName(ex.moduleId))}</small></div></div>`;
    }
    /* raccourcis */
    const sc=(a,i,t)=>`<button class="b" data-a="${a}"${i?` data-i="${i}"`:''}>${t}</button>`;
    out+=`<div class="c"><h4>⚡ ${Lg('Raccourcis','Shortcuts','اختصارات')}</h4><div class="qk">${sc('addTask','','➕ '+Lg('Échéance','Deadline','موعد'))}${sc('addFc','','🃏 '+Lg('Fiche','Card','بطاقة'))}${sc('go','po','⏱ Focus')}${sc('go','qz','🧠 Quiz')}${sc('go','mo','📚 '+Lg('Cours','Subjects','المواد'))}${sc('go','ag','📅 Agenda')}</div></div>`;
    /* demain */
    out+=`<div class="c"><h4>📆 ${Lg('Demain','Tomorrow','غدا')}${tom.length?' · '+tom.length+' '+Lg('cours','classes','حصص')+' · '+esc(tom[0].startTime)+' → '+esc(tom[tom.length-1].endTime):''}</h4>${tom.slice(0,4).map(c=>row(c,esc(c.startTime)+' – '+esc(c.endTime))).join('')||`<p class="mu e">${isHol(iso(tmr))?'🌴 '+Lg('Vacances demain','Holiday tomorrow','عطلة غدا'):Lg('Aucun cours demain 🎉','No classes tomorrow 🎉','لا حصص غدا 🎉')}</p>`}${tom.length>4?`<p class="mu e">+${tom.length-4}</p>`:''}</div>`;
    return out;
  }
  R.da=function(){
    const h=_h.apply(this,arguments);
    let x='';try{x=plus()}catch(e){console.warn('accueil+',e)}
    return x?h.replace('<div class="g">',m=>m+x):h;
  };

  /* Redessin intelligent : on ne touche pas a l'ecran si rien n'a change (pas de clignotement, pas de saut de defilement) */
  if(typeof render==='function'){
    let rc=0,sig=null;const _r=render;
    render=function(){rc++;return _r.apply(this,arguments)};
    window.renderSoft=function(){
      let h;try{h=tab+'|'+banner()+acctNudge()+R[tab]()}catch(e){return render()}
      if(sig&&sig.rc===rc&&sig.h===h)return;
      render();sig={rc:rc,h:h};
    };
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(tab==='da'||tab==='tt'))window.renderSoft()});
  }
  try{if(typeof tab!=='undefined'&&tab==='da'&&document.getElementById('v'))render()}catch(e){}
})();
</script>
<style>
#fab{position:fixed;inset-inline-end:14px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:6;width:54px;height:54px;border-radius:50%;border:0;background:var(--br);color:#fff;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .15s}
#fab.open{transform:rotate(45deg)}
#fab.off,body.typing #fab,body.typing #fabm{display:none}
#fabm{position:fixed;inset-inline-end:14px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:6;display:none;flex-direction:column;gap:8px;align-items:flex-end}
#fabm.show{display:flex}
#fabm button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:nowrap}
#ck,#ckh{position:fixed;inset:0;z-index:500;display:none;align-items:flex-start;justify-content:center;padding:10vh 12px 12px;background:rgba(0,0,0,.45)}
#ck.show,#ckh.show{display:flex}
.ckp{width:min(560px,100%);max-height:78vh;overflow:auto;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.4);padding:10px}
.ckp input{width:100%;box-sizing:border-box;border:1px solid var(--ln);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--tx);margin-bottom:8px}
.cki{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--tx);font:inherit;padding:9px 10px;border-radius:10px;cursor:pointer}
.cki.on,.cki:hover{background:var(--bs)}
.cki small{display:block;color:var(--mu)}
.cki span{font-size:20px}
.ckf{color:var(--mu);font-size:12px;text-align:center;padding:8px 0 2px}
.ckh-row{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--ln)}
.ckh-row kbd{background:var(--bs);border:1px solid var(--ln);border-radius:6px;padding:1px 7px;font:inherit;font-weight:700}
/* ===== mise en page mobile : en-tete sur 2 lignes, barre du bas qui tient en entier ===== */
@media (max-width:560px){
  header{flex-wrap:wrap;row-gap:8px;padding:8px 12px 10px}
  header h1{flex:1 1 auto;min-width:0;white-space:nowrap}
  header>div:last-child{flex:0 0 auto}
  header .b{padding:7px 11px;min-width:40px}
  .s-bar{order:3;flex:1 1 100%;margin:0}
  .s-bar input{padding:9px 14px;font-size:15px}
  nav{overflow:hidden;gap:0;padding-left:4px;padding-right:4px}
  nav button{flex:1 1 0;min-width:0;padding:8px 0;font-size:0;gap:0;border-radius:14px;transition:flex-grow .2s,background .2s}
  nav button span{font-size:20px}
  nav button.on{flex:2.2 1 0;font-size:11px;gap:2px}
}
/* ===== finitions communes ===== */
/* texte lisible sur les couleurs claires du mode sombre */
html.dark[data-th=ocean],html.dark[data-th=teal],html.dark[data-th=indigo],html.dark[data-th=forest],html.dark[data-th=sepia],html.dark[data-th=lavender],html.dark[data-th=sunset],html.dark[data-th=amoled],html.dark[data-th=amber],html.dark[data-th=emerald],html.dark[data-th=violet],html.dark[data-th=rose],html.dark[data-th=slate]{--on:#0b1220}
.p,.b.p,.b.p:hover,.sbadge b,.pbtn,.seg button.on,.msg.me .bub,.av,#fab,h1 .ic{color:var(--on,#fff)!important}
.qk{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.qk .b{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 6px;text-align:center;border:1px solid var(--ln);background:var(--card)}
.c>.cl:last-child{margin-bottom:0}
main{max-width:1100px;margin-inline:auto}
.pav.pavbtn:not(.pavx){width:56px;height:56px;display:grid;place-items:center;border-radius:var(--rs,20px);background:var(--in);border:1px solid var(--ln);color:var(--br);font:800 24px system-ui,sans-serif;text-transform:uppercase}
button:focus-visible,[data-a]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.c{transition:box-shadow .2s,border-color .2s}
@media (hover:hover){.c:hover{border-color:color-mix(in srgb,var(--br) 35%,var(--ln))}.cl:hover{filter:brightness(.98)}}
</style>
<button id="fab" class="off" aria-label="Actions rapides" aria-expanded="false">+</button>
<div id="fabm" role="menu"></div>
<div id="ck"><div class="ckp" role="dialog" aria-modal="true"><input id="cki" type="search" autocomplete="off" spellcheck="false"><div id="ckl" role="listbox"></div><div class="ckf" id="ckf"></div></div></div>
<div id="ckh"><div class="ckp" role="dialog" aria-modal="true"><div id="ckhb"></div></div></div>
<script>
/* Outils rapides : bouton +, recherche/commandes (Ctrl+K ou /), raccourcis clavier */
(function(){
  if(typeof act==='undefined'||typeof go!=='function')return;
  const $$=id=>document.getElementById(id);
  const norm=x=>String(x==null?'':x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const plain=x=>String(x==null?'':x).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
  const TABS=['da','tt','ag','mo','fc','qz','po','se'];
  const TL=()=>[Lg('Aujourd\'hui','Today','اليوم'),Lg('Horaires','Timetable','الجدول'),'Agenda',Lg('Cours','Subjects','المواد'),Lg('Fiches','Cards','البطاقات'),'Quiz','Focus',Lg('Plus','More','المزيد')];
  const TI=['🏠','🗓','🔔','📚','🃏','🧠','⏱','⚙️'];
  const dlgOpen=()=>!!document.querySelector('dialog[open]');
  const ckOpen=()=>$$('ck').classList.contains('show'),helpOpen=()=>$$('ckh').classList.contains('show');

  /* ---- commandes ---- */
  const cmds=()=>[
    {i:'➕',t:Lg('Nouvelle échéance','New deadline','موعد جديد'),h:'N',f:()=>act.addTask()},
    {i:'🃏',t:Lg('Nouvelle fiche','New card','بطاقة جديدة'),h:'F',f:()=>act.addFc()},
    {i:'🗓',t:Lg('Nouvelle séance','New class','حصة جديدة'),h:'S',f:()=>act.addCls()}
  ].concat(TABS.map((t,k)=>({i:TI[k],t:Lg('Aller à ','Go to ','انتقل إلى ')+TL()[k],h:String(k+1),f:()=>go(t)})))
   .concat([{i:'⌨️',t:Lg('Raccourcis clavier','Keyboard shortcuts','اختصارات لوحة المفاتيح'),h:'?',f:()=>showHelp()}]);

  /* ---- recherche ---- */
  function compute(q){
    q=norm(q).trim();const all=cmds();
    if(!q)return all;
    const out=all.filter(c=>norm(c.t).includes(q));
    const mn=id=>{try{return modName(id)}catch(e){return ''}};
    (A.modules||[]).filter(m=>norm(m.name).includes(q)).slice(0,4).forEach(m=>out.push({i:'📚',t:m.name,sub:Lg('Cours','Subject','مادة'),f:()=>go('mo')}));
    (A.tasks||[]).filter(x=>norm(x.title).includes(q)).slice(0,5).forEach(x=>out.push({i:x.type==='exam'?'🚨':x.type==='review'?'📖':'📝',t:x.title,sub:mn(x.moduleId)+(x.dueDate?' · '+new Date(x.dueDate).toLocaleDateString():''),f:()=>go('ag')}));
    (A.flashcards||[]).filter(f=>norm(plain(f.q||f.front)).includes(q)||norm(plain(f.a||f.back)).includes(q)).slice(0,5).forEach(f=>out.push({i:'🃏',t:plain(f.q||f.front).slice(0,80),sub:mn(f.moduleId),f:()=>go('fc')}));
    (A.notes||[]).filter(n=>n.text&&norm(n.text).includes(q)&&(A.timetable||[]).some(c=>c.id===n.classId)).slice(0,4).forEach(n=>{const c=A.timetable.find(c=>c.id===n.classId),p=norm(n.text).indexOf(q);out.push({i:'🗒',t:plain(n.text).slice(Math.max(0,p-15),p+60),sub:mn(c.moduleId),f:()=>act.cls(c.id)})});
    (A.timetable||[]).filter(c=>norm(mn(c.moduleId)).includes(q)).slice(0,3).forEach(c=>out.push({i:'📅',t:mn(c.moduleId),sub:c.day+' · '+c.startTime+'–'+c.endTime,f:()=>act.cls(c.id)}));
    return out.slice(0,14);
  }
  let items=[],sel=0;
  function paint(){
    const l=$$('ckl');
    l.innerHTML=items.map((x,k)=>`<button class="cki${k===sel?' on':''}" role="option" data-k="${k}"><span>${x.i}</span><div style="flex:1;min-width:0"><div>${esc(x.t)}</div>${x.sub?`<small>${esc(x.sub)}</small>`:''}</div>${x.h?`<small>${esc(x.h)}</small>`:''}</button>`).join('')||`<p class="ckf">${Lg('Aucun résultat','No results','لا نتائج')}</p>`;
    const on=l.querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});
  }
  function openCk(){
    if(dlgOpen())return;closeFab();$$('ckh').classList.remove('show');
    const i=$$('cki');i.value='';i.placeholder='🔍 '+Lg('Chercher un cours, une fiche, une note… ou une action','Search a subject, card, note… or an action','ابحث عن مادة أو بطاقة أو ملاحظة… أو إجراء');
    $$('ckf').textContent='↑ ↓  ·  Entrée  ·  Échap';
    items=compute('');sel=0;paint();$$('ck').classList.add('show');setTimeout(()=>i.focus(),30);
  }
  function closeCk(){$$('ck').classList.remove('show');$$('cki').blur()}
  function runIt(k){const it=items[k];if(!it)return;closeCk();setTimeout(it.f,40)}
  $$('cki').addEventListener('input',e=>{items=compute(e.target.value);sel=0;paint()});
  $$('cki').addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(items.length-1,sel+1);paint()}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);paint()}
    else if(e.key==='Enter'){e.preventDefault();runIt(sel)}
  });
  $$('ckl').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)runIt(+b.dataset.k)});
  $$('ck').addEventListener('click',e=>{if(e.target===$$('ck'))closeCk()});

  /* ---- aide raccourcis ---- */
  function showHelp(){
    if(dlgOpen())return;closeCk();
    const r=(k,t)=>`<div class="ckh-row"><span>${t}</span><kbd>${k}</kbd></div>`;
    $$('ckhb').innerHTML=`<h3 style="margin:4px 4px 8px">⌨️ ${Lg('Raccourcis clavier','Keyboard shortcuts','اختصارات لوحة المفاتيح')}</h3>`+
      r('Ctrl/⌘ + K  ou  /',Lg('Recherche et actions','Search and actions','بحث وإجراءات'))+
      r('N',Lg('Nouvelle échéance','New deadline','موعد جديد'))+r('F',Lg('Nouvelle fiche','New card','بطاقة جديدة'))+r('S',Lg('Nouvelle séance','New class','حصة جديدة'))+
      r('1 … 8',TL().join(' · '))+r('?',Lg('Cette aide','This help','هذه المساعدة'))+r('Échap',Lg('Fermer','Close','إغلاق'));
    $$('ckh').classList.add('show');
  }
  const closeHelp=()=>$$('ckh').classList.remove('show');
  $$('ckh').addEventListener('click',closeHelp);

  /* ---- bouton + ---- */
  document.querySelectorAll('#nav [data-t]').forEach(b=>{if(!b.title)b.title=(b.textContent||'').trim()});
  const fab=$$('fab'),fm=$$('fabm');
  function fabItems(){return [
    ['➕ '+Lg('Échéance','Deadline','موعد'),()=>act.addTask()],['🃏 '+Lg('Fiche','Card','بطاقة'),()=>act.addFc()],
    ['🗓 '+Lg('Séance','Class','حصة'),()=>act.addCls()],['⏱ Focus',()=>go('po')],['🔍 '+Lg('Recherche','Search','بحث'),()=>openCk()]]}
  function closeFab(){fm.classList.remove('show');fab.classList.remove('open');fab.setAttribute('aria-expanded','false')}
  fab.addEventListener('click',e=>{
    e.stopPropagation();
    if(fm.classList.contains('show'))return closeFab();
    fm.innerHTML='';fabItems().forEach(([t,f])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.addEventListener('click',ev=>{ev.stopPropagation();closeFab();setTimeout(f,40)});fm.appendChild(b)});
    fm.classList.add('show');fab.classList.add('open');fab.setAttribute('aria-expanded','true');
  });
  document.addEventListener('click',e=>{if(!e.target.closest('#fab,#fabm'))closeFab()});
  function fabSync(){
    const off=(typeof tab!=='undefined'&&tab==='ch')||!!window.__fm;fab.classList.toggle('off',off);if(off)closeFab();
    /* le bouton 🤖 occupe deja le coin : on met le + juste au-dessus */
    const bot=document.querySelector('.botfab'),r=bot&&!bot.hidden?bot.getBoundingClientRect():null;
    if(r&&r.width>0){const b=Math.round(window.innerHeight-r.top+10);fab.style.bottom=b+'px';fm.style.bottom=(b+64)+'px'}
    else{fab.style.bottom='calc(86px + env(safe-area-inset-bottom))';fm.style.bottom='calc(150px + env(safe-area-inset-bottom))'}
  }
  window.addEventListener('resize',()=>{try{fabSync()}catch(e){}});
  const _r=render;render=function(){const r=_r.apply(this,arguments);try{fabSync()}catch(e){}return r};
  fabSync();
  document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('input,textarea,select')&&e.target.id!=='cki')document.body.classList.add('typing')});
  document.addEventListener('focusout',()=>document.body.classList.remove('typing'));

  /* ---- clavier ---- */
  document.addEventListener('keydown',e=>{
    const k=e.key;if(!k)return;
    if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='k'){e.preventDefault();ckOpen()?closeCk():openCk();return}
    if(k==='Escape'){if(ckOpen()){closeCk();return}if(helpOpen()){closeHelp();return}closeFab();return}
    const t=e.target,typing=t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);
    if(typing||e.ctrlKey||e.metaKey||e.altKey||e.repeat||dlgOpen()||ckOpen())return;
    if(k==='/'){e.preventDefault();openCk()}
    else if(k==='?'){e.preventDefault();showHelp()}
    else if(k==='n'||k==='N'){e.preventDefault();act.addTask()}
    else if(k==='f'||k==='F'){e.preventDefault();act.addFc()}
    else if(k==='s'||k==='S'){e.preventDefault();act.addCls()}
    else if(/^[1-8]$/.test(k)&&tab!=='ch'){e.preventDefault();go(TABS[+k-1])}
  });
})();
</script>

</body>
</html>
