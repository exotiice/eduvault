<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>EduVault</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#6b7280;--ln:#e5e7eb;--br:#2563eb;--bs:#e0edff;--er:#dc2626;--ok:#059669;--in:#f3f4f6}
.dark{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--ln:#374151;--bs:#1e3a8a66;--in:#374151}
*{box-sizing:border-box;margin:0}
body{font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--ln);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;font-weight:800;color:var(--br)}h2{font-size:17px}h3{margin-bottom:6px}h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:8px}
main{max-width:1000px;margin:auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;font-weight:700;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:19px}nav .on{color:var(--br)}
.b{border:0;border-radius:12px;padding:8px 12px;background:var(--in);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}.p{background:var(--br);color:#fff}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.top>div:last-child{display:flex;gap:6px}
.br{color:var(--br);font-weight:700}.mu{color:var(--mu)}small{font-size:11px;display:block}
.cl{background:var(--bs);border-radius:12px;padding:9px;margin-bottom:8px;cursor:pointer;border:1px solid transparent}.cl.nt{border-color:#f59e0b}.cl b{display:block}
.e{text-align:center;border:1px dashed var(--ln);border-radius:12px;padding:10px;font-size:12px}
.up{background:linear-gradient(90deg,#f59e0b,#ea580c);color:#fff;border-radius:16px;padding:12px;font-weight:700;margin-bottom:12px;cursor:pointer}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.pills .b.p{box-shadow:0 2px 8px #2563eb55}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}.row input{flex:1;min-width:0;margin:0}
.t{display:flex;align-items:center;gap:10px;margin-bottom:8px}.t>div{flex:1}.t.x{border-color:#f87171}.t.d>div{opacity:.5;text-decoration:line-through}.t input{width:18px;margin:0}
.x-btn{border:0;background:none;color:var(--mu);cursor:pointer;font-size:15px}
.rs{background:var(--in);border-radius:12px;padding:8px;margin-top:6px;font-size:12px}.rs div{display:flex;justify-content:space-between;gap:6px;background:var(--card);border-radius:8px;padding:5px 8px;margin-top:4px}.rs a,.rs button.l{color:var(--br);background:none;border:0;font:inherit;text-align:left;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.chip{display:inline-flex;gap:6px;background:var(--in);border-radius:8px;padding:3px 8px;font-size:11px;margin:3px 3px 0 0}
.fc{perspective:900px;height:200px;cursor:pointer}.fi{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}.fc.fl .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:14px;border-radius:16px;border:1px solid var(--ln);background:var(--card);overflow:auto;display:flex;flex-direction:column;justify-content:space-between}
.fb{transform:rotateY(180deg);background:var(--bs);border:2px solid var(--br)}
.pm{max-width:420px;margin:auto;text-align:center}.pm .row{justify-content:center}.ring{position:relative;width:220px;height:220px;margin:18px auto}.ring svg{transform:rotate(-90deg)}.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring b{font-size:44px}
dialog{border:0;border-radius:20px;padding:18px;width:min(440px,94vw);max-height:88vh;background:var(--card);color:var(--tx)}dialog::backdrop{background:#0009}
label{display:block;font-size:12px;font-weight:600;margin:8px 0;color:var(--mu)}
input,select,textarea{width:100%;margin-top:4px;padding:10px;border:0;border-radius:12px;background:var(--in);color:var(--tx);font:inherit}
.ph{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.ph div{position:relative;flex:none}.ph img{width:64px;height:64px;object-fit:cover;border-radius:10px}.ph button{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;border:0;background:var(--er);color:#fff;font-size:11px}
#ts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:6px;pointer-events:none;width:92%;max-width:420px}#ts div{color:#fff;border-radius:99px;padding:9px 14px;font-weight:700;font-size:12px;text-align:center;background:#111827}
#ts .er{background:var(--er)}#ts .ok{background:var(--ok)}
:focus-visible{outline:3px solid var(--br);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>🎓 EduVault</h1>
  <div style="display:flex;gap:6px;align-items:center">
    <small id="avg" class="br"></small>
    <button class="b" id="dv" data-a="drive" title="Google Drive">☁️ <span id="dd">●</span></button>
    <button class="b" data-a="theme" title="Thème">🌓</button>
  </div>
</header>
<main id="v"></main>
<nav id="nav">
  <button data-t="tt"><span>🗓</span>Horaires</button>
  <button data-t="ag"><span>🔔</span>Agenda</button>
  <button data-t="mo"><span>📚</span>Cours</button>
  <button data-t="fc"><span>🃏</span>Fiches</button>
  <button data-t="po"><span>⏱</span>Focus</button>
  <button data-a="set"><span>⚙️</span>Plus</button>
</nav>
<dialog id="dlg"></dialog>
<div id="ts" aria-live="polite"></div>

<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LV={CP1:['S1','S2'],CP2:['S3','S4'],CI1:['S5','S6'],CI2:['S7','S8'],CI3:['S9','S10']};
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const CATS=[['cours','📚 Cours'],['td','📝 TD / TP'],['examen','🎯 Examens'],['resume','⚡ Résumés']];
const KEY='eduVaultData_vFinal3';
const GEMINI_MODEL='gemini-2.5-flash'; /* verifie le nom actuel sur ai.google.dev/gemini-api/docs/models */
const AI={gemini:{n:'Google Gemini',model:GEMINI_MODEL},groq:{n:'Groq Cloud',model:'qwen/qwen3.8-27b'}}; /* modele vision : modifiable dans la fenetre d'import */
const aiKey=p=>localStorage.getItem('eduVault_aiKey_'+p)||(p==='gemini'?localStorage.getItem('eduVault_aiKey'):'')||'';
const aiModel=p=>localStorage.getItem('eduVault_aiModel_'+p)||AI[p].model;
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.';
const CLIENT_ID='786113410432-5c5gh5craje2k8aq6jbgjd35jn7f1eur.apps.googleusercontent.com';
let A={activeSemester:'S1',settings:{level:null,currentWeek:'A',weekRef:'',holidays:[]},modules:[],tasks:[],flashcards:[],timetable:[],notes:[]};
let tab='tt',filt='all',cardMod='all',q='',cur={},tok=null,tc=null;

/* ---------- utils ---------- */
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const sems=()=>LV[A.settings.level]||LV.CP1;
const mods=()=>A.modules.filter(m=>m.semester===A.activeSemester);
const modName=id=>A.modules.find(m=>m.id===id)?.name||'?';
function toast(m,t=''){const e=document.createElement('div');e.className=t;e.textContent=m;$('ts').append(e);setTimeout(()=>e.remove(),3500)}
function notify(t,b){try{if(window.Notification&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}toast(t+' : '+b);try{navigator.vibrate([200,100,200])}catch(e){}}
const L={};const lib=s=>L[s]||(L[s]=new Promise((ok,ko)=>{const e=document.createElement('script');e.src=s;e.onload=ok;e.onerror=()=>{delete L[s];ko(new Error('Chargement impossible (connexion ?)'))};document.head.append(e)}));
function dlBlob(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.append(a);a.click();a.remove()}
function shrink(f,max=800,qa=.6){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',qa))};im.src=r.result};r.readAsDataURL(f)})}

/* ---------- data ---------- */
function load(o){
  try{Object.assign(A,o||JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
  for(const k of ['modules','tasks','flashcards','timetable','notes'])if(!Array.isArray(A[k]))A[k]=[];
  A.settings=Object.assign({level:null,currentWeek:'A',weekRef:'',holidays:[]},A.settings);
  if(!Array.isArray(A.settings.holidays))A.settings.holidays=[];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){toast('Stockage plein : supprimez des photos','er')}}
function upd(){save();render()}

/* ---------- week A/B + holidays ---------- */
function curWeek(){const s=A.settings,c=s.currentWeek||'A';if(!s.weekRef)return c;const k=Math.round((monday(new Date())-monday(new Date(s.weekRef+'T00:00')))/6048e5);return Math.abs(k)%2===0?c:(c==='A'?'B':'A')}
const isHol=d=>A.settings.holidays.includes(d);
function ranges(){const r=[];[...A.settings.holidays].sort().forEach(d=>{const l=r[r.length-1];if(l){const n=new Date(l[1]+'T00:00');n.setDate(n.getDate()+1);if(iso(n)===d){l[1]=d;return}}r.push([d,d])});return r}

/* ---------- generic form dialog ---------- */
function ask(title,fields,ok){
  const d=$('dlg');
  d.innerHTML=`<form><h3>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.l)}${
    f.t==='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}"${o[0]==f.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:
    f.t==='textarea'?`<textarea name="${f.k}" rows="3"${f.r?' required':''}>${esc(f.v)}</textarea>`:
    `<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}"${f.r?' required':''}${f.a||''}>`}</label>`).join('')}
    <div class="row"><button type="button" class="b" onclick="$('dlg').close()">Annuler</button><button class="b p">OK</button></div></form>`;
  d.querySelector('form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);d.close();ok(Object.fromEntries(fd),fd)};
  d.oncancel=null;d.showModal();
}

/* ---------- views ---------- */
const pills=()=>`<div class="pills">${sems().map(s=>`<button class="b${s===A.activeSemester?' p':''}" data-a="sem" data-i="${s}">${s}</button>`).join('')}</div>`;
function banner(){const n=new Date(),t=A.tasks.filter(t=>!t.completed&&new Date(t.dueDate)>n).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate))[0];if(!t)return'';const h=Math.floor((new Date(t.dueDate)-n)/36e5),d=Math.floor(h/24);return`<div class="up" data-a="goAg">⏰ ${t.type==='exam'?'Examen':'Devoir'} : ${esc(t.title)} (${d>0?'dans '+d+' j':h>0?'dans '+h+' h':'très bientôt'})</div>`}
function avg(){const ms=mods().filter(m=>m.grade!==null&&m.grade!==undefined);let t=0,c=0;ms.forEach(m=>{t+=m.grade*m.coeff;c+=m.coeff});$('avg').textContent=ms.length?`Moy. ${A.activeSemester} : ${(t/c).toFixed(2)}`:''}

function rTT(){
  const wk=curWeek(),ids=mods().map(m=>m.id),tt=A.timetable.filter(c=>ids.includes(c.moduleId)&&(c.week==='all'||c.week===wk));
  const days=DAYS.filter((d,i)=>i<6||tt.some(c=>c.day===d));
  return pills()+`<div class="top"><div><h2>Emploi du temps</h2><small class="br">Semaine ${wk}${isHol(iso(new Date()))?' · Vacances aujourd\'hui 🌴':''}</small></div><div><button class="b" data-a="ai">✨ IA</button><button class="b p" data-a="addCls">+ Séance</button></div></div><div class="g">`+
  days.map(d=>`<div class="c"><h4>${d}</h4>`+(tt.filter(c=>c.day===d).sort((a,b)=>a.startTime.localeCompare(b.startTime)).map(c=>{
    const n=A.notes.some(x=>x.classId===c.id&&(x.text||(x.photos||[]).length));
    return`<div class="cl${n?' nt':''}" data-a="cls" data-i="${c.id}"><small class="br">${esc(c.startTime)} – ${esc(c.endTime)}</small><b>${esc(modName(c.moduleId))}</b><small class="mu">📍 ${esc(c.room)}${n?' 📝':''}</small></div>`}).join('')||'<p class="mu e">Aucune séance</p>')+'</div>').join('')+'</div>';
}
function rAg(){
  const ids=mods().map(m=>m.id),l=A.tasks.filter(t=>ids.includes(t.moduleId)&&(filt==='all'||t.type===filt)).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  return pills()+`<div class="top"><h2>Examens & Devoirs</h2><div><button class="b p" data-a="addTask">+ Ajouter</button></div></div><div class="pills">${[['all','Tous'],['exam','Examens'],['homework','Devoirs']].map(f=>`<button class="b${filt===f[0]?' p':''}" data-a="flt" data-i="${f[0]}">${f[1]}</button>`).join('')}</div>`+
  (l.length?l.map(t=>`<div class="c t${t.type==='exam'?' x':''}${t.completed?' d':''}"><input type="checkbox" ${t.completed?'checked':''} data-a="done" data-i="${t.id}" aria-label="Terminé"><div><b>${t.type==='exam'?'🚨 ':'📝 '}${esc(t.title)}</b><small class="mu">${esc(modName(t.moduleId))} • ${new Date(t.dueDate).toLocaleString('fr-FR')}</small></div><button class="x-btn" data-a="delTask" data-i="${t.id}" aria-label="Supprimer">🗑</button></div>`).join(''):'<p class="mu e">Aucune échéance</p>');
}
function mgrid(){
  const l=mods().filter(m=>m.name.toLowerCase().includes(q.toLowerCase()));
  return l.length?l.map(m=>`<div class="c"><div class="top" style="margin:0"><div><small class="br">${m.semester} · Note : ${m.grade!=null?m.grade+'/20':'-'} · coef ${m.coeff}</small><b>${esc(m.name)}</b><small class="mu">${esc(m.prof||'Enseignant non spécifié')}</small></div><div><button class="x-btn" data-a="addRes" data-i="${m.id}" title="Ajouter un document">📎</button><button class="x-btn" data-a="editMod" data-i="${m.id}" title="Modifier">✏️</button><button class="x-btn" data-a="delMod" data-i="${m.id}" title="Supprimer">🗑</button></div></div>`+
    CATS.map(([k,t])=>{const r=(m.resources||[]).filter(x=>x.type===k);return`<div class="rs"><small class="mu"><b>${t} (${r.length})</b></small>${r.map(x=>`<div>${x.isLocal?`<button class="l" data-a="openRes" data-i="${esc(x.localFileId)}">📄 ${esc(x.title)}</button>`:`<a href="${esc(x.url)}" target="_blank" rel="noopener">🔗 ${esc(x.title)}</a>`}<button class="x-btn" data-a="delRes" data-i="${m.id}|${x.id}" aria-label="Supprimer">✕</button></div>`).join('')}</div>`}).join('')+'</div>').join(''):`<p class="mu e" style="grid-column:1/-1">Aucun module dans ${A.activeSemester}</p>`;
}
function rMo(){return pills()+`<div class="top"><h2>Modules & Cours</h2><div><button class="b p" data-a="addMod">+ Module</button></div></div><input type="search" placeholder="Rechercher un module..." value="${esc(q)}" oninput="q=this.value;$('mg').innerHTML=mgrid()" style="margin:0 0 12px"><div class="g" id="mg">${mgrid()}</div>`}
function rFc(){
  const ms=mods(),ids=ms.map(m=>m.id),l=A.flashcards.filter(f=>ids.includes(f.moduleId)&&(cardMod==='all'||f.moduleId===cardMod));
  return pills()+`<div class="top"><h2>Active Recall</h2><div><button class="b p" data-a="addFc">+ Créer</button></div></div><select onchange="cardMod=this.value;render()" style="margin:0 0 12px"><option value="all">Tous les modules</option>${ms.map(m=>`<option value="${m.id}"${cardMod===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select><div class="g">`+
  (l.length?l.map(f=>`<div class="fc" data-a="flip"><div class="fi"><div class="fa"><div><div class="top" style="margin:0"><small class="mu">QUESTION</small><button class="x-btn" data-a="delFc" data-i="${f.id}" aria-label="Supprimer">🗑</button></div><b>${esc(f.q)}</b></div><small class="br">↻ Touchez pour la réponse</small></div><div class="fb"><div><small class="br">RÉPONSE</small>${esc(f.a)}</div><small class="mu">Touchez pour retourner</small></div></div></div>`).join(''):'<p class="mu e" style="grid-column:1/-1">Aucune fiche</p>')+'</div>';
}

/* ---------- pomodoro ---------- */
const PM={work:[1500,'Concentration','Travail (25m)'],short:[300,'Pause','Pause (5m)'],long:[900,'Longue pause','Longue (15m)']};
let P={mode:'work',left:1500,total:1500,end:0,t:null};
function rPo(){return`<div class="c pm"><div class="row">${Object.keys(PM).map(k=>`<button class="b${P.mode===k?' p':''}" data-a="pmode" data-i="${k}">${PM[k][2]}</button>`).join('')}</div><select id="pms" style="margin-top:12px"><option value="">Focus libre</option>${mods().map(m=>`<option>${esc(m.name)}</option>`).join('')}</select><div class="ring"><svg viewBox="0 0 100 100" width="220" height="220"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--in)" stroke-width="5"/><circle id="pp" cx="50" cy="50" r="45" fill="none" stroke="var(--br)" stroke-width="5" stroke-linecap="round" stroke-dasharray="283"/></svg><div><b id="pt"></b><small class="mu" id="pl"></small></div></div><div class="row"><button class="b p" id="pb" data-a="ptoggle" style="min-width:56px">▶</button><button class="b" data-a="preset" aria-label="Réinitialiser">↻</button></div></div>`}
function ppaint(){if(!$('pt'))return;$('pt').textContent=String(Math.floor(P.left/60)).padStart(2,'0')+':'+String(P.left%60).padStart(2,'0');$('pl').textContent=PM[P.mode][1];$('pp').style.strokeDashoffset=283-((P.total-P.left)/P.total)*283;$('pb').textContent=P.t?'⏸':'▶'}
function ptick(){P.left=Math.max(0,Math.round((P.end-Date.now())/1000));ppaint();if(!P.left){clearInterval(P.t);P.t=null;P.left=P.total;notify('Pomodoro','Session terminée !');ppaint()}}

/* ---------- render ---------- */
const R={tt:rTT,ag:rAg,mo:rMo,fc:rFc,po:rPo};
function render(){$('v').innerHTML=banner()+R[tab]();avg();ppaint()}
function go(t){tab=t;document.querySelectorAll('#nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();
  try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}

/* ---------- actions ---------- */
function modForm(m){ask(m?'Modifier le module':'Nouveau module',[
  {k:'semester',l:'Semestre',t:'select',o:sems().map(s=>[s,s]),v:m?.semester||A.activeSemester},
  {k:'name',l:'Nom du module',r:1,v:m?.name},{k:'prof',l:'Professeur (optionnel)',v:m?.prof},
  {k:'grade',l:'Note /20',t:'number',a:' min="0" max="20" step="0.25"',v:m?.grade??''},
  {k:'coeff',l:'Coefficient',t:'number',a:' min="0.5" step="0.5"',v:m?.coeff??1}],v=>{
  const o={semester:v.semester,name:v.name.trim(),prof:v.prof.trim(),grade:v.grade===''?null:+v.grade,coeff:+v.coeff||1};
  m?Object.assign(m,o):A.modules.push({id:uid('m'),resources:[],...o});upd();toast('Module enregistré','ok')})}
const needMod=()=>mods().length?false:(toast("Ajoutez d'abord un module pour ce semestre",'er'),true);
const modOpts=()=>mods().map(m=>[m.id,m.name]);

const act={
  sem:i=>{A.activeSemester=i;cardMod='all';upd()},
  flt:i=>{filt=i;render()},
  goAg:()=>go('ag'),
  theme:()=>{document.documentElement.classList.toggle('dark');localStorage.setItem('eduTheme',document.documentElement.classList.contains('dark')?'dark':'light')},
  lvl:i=>{A.settings.level=i;A.activeSemester=LV[i][0];$('dlg').oncancel=null;$('dlg').close();upd();toast('Niveau '+i+' configuré','ok')},
  addCls:()=>{if(needMod())return;ask('Séance',[{k:'moduleId',l:'Module',t:'select',o:modOpts()},{k:'day',l:'Jour',t:'select',o:DAYS.map(d=>[d,d])},{k:'week',l:'Semaine',t:'select',o:[['all','Toutes les semaines'],['A','Semaine A'],['B','Semaine B']]},{k:'startTime',l:'Début',t:'time',r:1},{k:'endTime',l:'Fin',t:'time',r:1},{k:'room',l:'Salle ou amphi',r:1}],v=>{
    if(v.endTime<=v.startTime)return toast("L'heure de fin doit être après le début",'er');A.timetable.push({id:uid('c'),...v});upd();toast('Séance ajoutée','ok')})},
  addMod:()=>modForm(),
  editMod:i=>modForm(A.modules.find(m=>m.id===i)),
  delMod:i=>{if(!confirm('Supprimer ce module, ses séances, devoirs et fiches ?'))return;
    (A.modules.find(m=>m.id===i)?.resources||[]).forEach(r=>r.isLocal&&fst('delete',r.localFileId).catch(()=>{}));
    A.modules=A.modules.filter(x=>x.id!==i);for(const k of ['timetable','tasks','flashcards'])A[k]=A[k].filter(x=>x.moduleId!==i);upd()},
  addTask:()=>{if(needMod())return;ask('Ajouter une échéance',[{k:'title',l:'Titre',r:1},{k:'moduleId',l:'Module',t:'select',o:modOpts()},{k:'type',l:'Type',t:'select',o:[['exam','🚨 Examen'],['homework','📝 Devoir']]},{k:'dueDate',l:'Date et heure',t:'datetime-local',r:1}],v=>{A.tasks.push({id:uid('t'),...v,title:v.title.trim(),completed:false});upd();toast('Échéance ajoutée','ok')})},
  done:i=>{const t=A.tasks.find(x=>x.id===i);if(t){t.completed=!t.completed;upd()}},
  delTask:i=>{A.tasks=A.tasks.filter(x=>x.id!==i);upd()},
  addFc:()=>{if(needMod())return;ask('Nouvelle fiche',[{k:'moduleId',l:'Module',t:'select',o:modOpts()},{k:'q',l:'Question (recto)',t:'textarea',r:1},{k:'a',l:'Réponse (verso)',t:'textarea',r:1}],v=>{A.flashcards.push({id:uid('f'),moduleId:v.moduleId,q:v.q.trim(),a:v.a.trim()});upd();toast('Fiche créée','ok')})},
  delFc:i=>{A.flashcards=A.flashcards.filter(x=>x.id!==i);upd()},
  flip:(i,b)=>b.classList.toggle('fl'),
  addRes:i=>{const m=A.modules.find(x=>x.id===i);ask('Ajouter un document',[{k:'type',l:'Catégorie',t:'select',o:CATS},{k:'title',l:'Titre',r:1},{k:'src',l:'Source',t:'select',o:[['local','Fichier local (sur cet appareil)'],['drive','Téléverser sur Google Drive'],['url','Lien web']]},{k:'file',l:'Fichier (local / Drive)',t:'file'},{k:'url',l:'Lien (si Lien web)',t:'url'}],async(v,fd)=>{
    try{const f=fd.get('file'),r={id:uid('r'),title:v.title.trim(),type:v.type};
      if(v.src==='url'){if(!v.url)throw Error('Saisissez une URL');r.url=v.url;r.isLocal=false}
      else{if(!f||!f.size)throw Error('Sélectionnez un fichier');
        if(v.src==='local'){r.localFileId=uid('f');r.isLocal=true;await fst('put',{id:r.localFileId,name:f.name,type:f.type,blob:f})}
        else{if(!tok)throw Error("Connectez-vous d'abord à Google Drive (bouton ☁️)");const form=new FormData();form.append('metadata',new Blob([JSON.stringify({name:v.title+' - '+f.name,mimeType:f.type})],{type:'application/json'}));form.append('file',f);
          const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+tok},body:form}),d=await res.json();
          if(!d.id)throw Error('Échec du téléversement Google Drive');r.url='https://drive.google.com/file/d/'+d.id+'/view';r.isLocal=false}}
      (m.resources=m.resources||[]).push(r);upd();toast('Document enregistré','ok')}catch(e){toast(e.message,'er')}})},
  delRes:i=>{const[mi,ri]=i.split('|'),m=A.modules.find(x=>x.id===mi),r=m?.resources.find(x=>x.id===ri);if(!r)return;if(r.isLocal)fst('delete',r.localFileId).catch(()=>{});m.resources=m.resources.filter(x=>x.id!==ri);upd()},
  openRes:async i=>{try{const r=await fst('get',i);if(!r)return toast('Fichier introuvable','er');const b=r.blob||await(await fetch(r.dataUrl)).blob();
    if(window.AndroidBridge)dlBlob(r.name,b);else window.open(URL.createObjectURL(new Blob([b],{type:r.type||b.type})),'_blank')}catch(e){toast(e.message,'er')}},
  cls:i=>clsDlg(i),
  pf:()=>$('pf').click(),
  delPh:i=>{cur.ph.splice(+i,1);drawPh()},
  saveNote:()=>{let n=A.notes.find(x=>x.classId===cur.id);if(!n){n={classId:cur.id};A.notes.push(n)}n.text=$('nt').value.trim();n.photos=[...cur.ph];n.date=new Date().toISOString();$('dlg').close();upd();toast('Notes enregistrées','ok')},
  delCls:i=>{if(!confirm("Supprimer ce cours de l'emploi du temps ?"))return;A.timetable=A.timetable.filter(x=>x.id!==i);A.notes=A.notes.filter(x=>x.classId!==i);$('dlg').close();upd()},
  pmode:i=>{clearInterval(P.t);P.t=null;P.mode=i;P.total=P.left=PM[i][0];render()},
  ptoggle:()=>{if(P.t){clearInterval(P.t);P.t=null;P.left=Math.max(0,Math.round((P.end-Date.now())/1000))}else{P.end=Date.now()+P.left*1000;P.t=setInterval(ptick,300)}ppaint()},
  preset:()=>{clearInterval(P.t);P.t=null;P.left=P.total;ppaint()},
  ai:()=>{const p0=localStorage.getItem('eduVault_aiProv')||'gemini';
    ask('Importation IA',[{k:'prov',l:'Fournisseur',t:'select',o:Object.keys(AI).map(k=>[k,AI[k].n]),v:p0},{k:'key',l:'Clé API (Gemini : aistudio.google.com/apikey · Groq : console.groq.com/keys)',t:'password',r:1,v:aiKey(p0)},{k:'model',l:'Modèle avec vision',r:1,v:aiModel(p0)},{k:'file',l:'Emploi du temps (PDF ou image)',t:'file',a:' accept="application/pdf,image/*" required'}],aiImport);
    const f=$('dlg').querySelector('form'),sel=f.elements.prov;sel.onchange=()=>{f.elements.key.value=aiKey(sel.value);f.elements.model.value=aiModel(sel.value)}},
  drive:async()=>{if(tok){tok=null;paintDrive();return toast('Drive déconnecté')}
    try{await lib('https://accounts.google.com/gsi/client');tc=tc||google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r.error)return toast('Échec authentification Drive','er');tok=r.access_token;paintDrive();toast('Connecté à Google Drive','ok')}});tc.requestAccessToken()}catch(e){toast(e.message,'er')}},
  set:()=>settings(),
  addHol:()=>{const a=$('h1').value,b=$('h2').value||a;if(!a||b<a)return toast('Dates invalides','er');const d=new Date(a+'T00:00');for(let n=0;iso(d)<=b&&n<400;n++){const s=iso(d);if(!isHol(s))A.settings.holidays.push(s);d.setDate(d.getDate()+1)}upd();settings()},
  delHol:i=>{const[a,b]=i.split('|');A.settings.holidays=A.settings.holidays.filter(d=>d<a||d>b);upd();settings()},
  exp:()=>{dlBlob('EduVault_Sauvegarde_'+iso(new Date())+'.json',new Blob([JSON.stringify(A,null,2)],{type:'application/json'}));toast('Sauvegarde exportée','ok')},
  imp:()=>$('jf').click()
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.i,b)});
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)go(b.dataset.t)});

/* ---------- class details (notes + photos) ---------- */
function drawPh(){$('ph').innerHTML=cur.ph.map((s,i)=>`<div><img src="${s}" alt="Photo ${i+1}"><button data-a="delPh" data-i="${i}" aria-label="Retirer">✕</button></div>`).join('')}
function clsDlg(id){
  const c=A.timetable.find(x=>x.id===id);if(!c)return;const n=A.notes.find(x=>x.classId===id)||{text:'',photos:[]};cur={id,ph:[...(n.photos||[])]};
  const d=$('dlg');d.innerHTML=`<h3>${esc(modName(c.moduleId))}</h3><small class="mu">${esc(c.day)} ${esc(c.startTime)} – ${esc(c.endTime)} · 📍 ${esc(c.room)}</small><label>Notes du cours<textarea id="nt" rows="4" placeholder="Points importants, chapitres traités...">${esc(n.text)}</textarea></label><div id="ph" class="ph"></div><input id="pf" type="file" accept="image/*" multiple hidden><div class="row"><button class="b" data-a="pf">📷 Photo (max 3)</button><button class="b" style="color:var(--er)" data-a="delCls" data-i="${id}">🗑 Supprimer</button><button class="b" onclick="$('dlg').close()">Fermer</button><button class="b p" data-a="saveNote">Sauvegarder</button></div>`;
  $('pf').onchange=async e=>{const fs=[...e.target.files];if(cur.ph.length+fs.length>3)return toast('Maximum 3 photos','er');for(const f of fs)try{cur.ph.push(await shrink(f))}catch(x){toast('Image illisible','er')}drawPh()};
  drawPh();d.oncancel=null;d.showModal();
}

/* ---------- settings ---------- */
function settings(){
  const d=$('dlg'),s=A.settings;
  d.innerHTML=`<h3>⚙️ Réglages</h3><label>Niveau actuel<select onchange="chgLvl(this.value)">${Object.keys(LV).map(l=>`<option${l===s.level?' selected':''}>${l}</option>`).join('')}</select></label>
  <label>Semaine actuelle (l'alternance A/B est automatique)<select onchange="chgWk(this.value)"><option value="A"${curWeek()==='A'?' selected':''}>Semaine A</option><option value="B"${curWeek()==='B'?' selected':''}>Semaine B</option></select></label>
  <label>Vacances & jours chômés (du / au)<span class="row" style="margin:4px 0 0"><input type="date" id="h1" aria-label="Du"><input type="date" id="h2" aria-label="Au"><button class="b p" data-a="addHol">+</button></span></label>
  <div>${ranges().map(r=>`<span class="chip">${r[0]===r[1]?r[0]:r[0]+' → '+r[1]}<button class="x-btn" data-a="delHol" data-i="${r[0]}|${r[1]}" aria-label="Supprimer">✕</button></span>`).join('')}</div>
  <div class="row"><button class="b" data-a="exp">⬇ Exporter</button><button class="b" data-a="imp">⬆ Importer</button><button class="b p" onclick="$('dlg').close()">Fermer</button></div><input type="file" id="jf" accept=".json,application/json" hidden>`;
  $('jf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.modules))throw 0;if(!confirm('Remplacer toutes vos données par cette sauvegarde ?'))return;load(o);upd();$('dlg').close();toast('Sauvegarde restaurée','ok')}catch(x){toast('Format JSON invalide','er')}};r.readAsText(f)};
  d.oncancel=null;d.showModal();
}
function chgLvl(l){A.settings.level=l;A.activeSemester=LV[l][0];upd()}
function chgWk(w){A.settings.currentWeek=w;A.settings.weekRef=iso(monday(new Date()));upd()}

/* ---------- local files (IndexedDB) ---------- */
let db;const idb=()=>db?Promise.resolve(db):new Promise((ok,ko)=>{const r=indexedDB.open('EduVaultLocalFiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>ok(db=r.result);r.onerror=()=>ko(r.error)});
const fst=async(m,...a)=>{const d=await idb();return new Promise((ok,ko)=>{const t=d.transaction('files',m==='get'?'readonly':'readwrite'),r=t.objectStore('files')[m](...a);t.oncomplete=()=>ok(r.result);t.onerror=()=>ko(t.error)})};

/* ---------- AI import ---------- */
async function toImages(f){
  if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
    await lib(PDFJS+'min.js');pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];
    for(let i=1;i<=Math.min(pdf.numPages,3);i++){const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1.5}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.push(c.toDataURL('image/jpeg',.85))}
    return out}
  return[await shrink(f,1600,.85)];
}
const normDay=s=>{const x=String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return DAYS.find(d=>d.toLowerCase()===x)};
const AI_PROMPT='Extrais l\'emploi du temps de ces images. Réponds STRICTEMENT avec un tableau JSON valide sans markdown : [{"jour":"LUNDI","debut":"08:30","fin":"10:30","matiere":"Nom du module","salle":"Amphi A"}]. Utilise les jours en français (LUNDI, MARDI, MERCREDI, JEUDI, VENDREDI, SAMEDI).';
async function aiCall(prov,key,model,imgs){
  if(prov==='groq'){
    const call=async m=>{const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},
      body:JSON.stringify({model:m,temperature:.1,max_completion_tokens:4096,messages:[{role:'user',content:[{type:'text',text:AI_PROMPT},...imgs.map(u=>({type:'image_url',image_url:{url:u}}))]}]})});
      return{ok:res.ok,status:res.status,j:await res.json().catch(()=>({}))}};
    let r=await call(model);
    if(!r.ok&&/model|not exist|access/i.test(r.j.error?.message||'')){
      /* modele inconnu pour cette cle : on liste les modeles du compte et on essaie les modeles vision */
      const ml=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+key}}).then(x=>x.json()).catch(()=>({})),
        ids=(ml.data||[]).map(x=>x.id),alt=ids.filter(i=>i!==model&&/llama-4|scout|maverick|vision|-vl|qwen/i.test(i)).slice(0,4);
      for(const m of alt){r=await call(m);if(r.ok){localStorage.setItem('eduVault_aiModel_groq',m);toast('Modèle utilisé : '+m,'ok');break}}
      if(!r.ok)throw Error((r.j.error?.message||'Erreur Groq')+(ids.length?' | Modèles disponibles : '+ids.slice(0,12).join(', '):''));
    }
    if(!r.ok)throw Error(r.j.error?.message||'Erreur Groq HTTP '+r.status);
    return r.j.choices?.[0]?.message?.content||'';
  }
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:AI_PROMPT},...imgs.map(i=>({inline_data:{mime_type:'image/jpeg',data:i.split(',')[1]}}))]}],generationConfig:{temperature:.1}})});
  const j=await res.json().catch(()=>({}));if(!res.ok)throw Error(j.error?.message||'Erreur Gemini HTTP '+res.status);
  return(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
}
async function aiImport(v,fd){
  const f=fd.get('file');if(!f||!f.size)return toast('Sélectionnez un document','er');
  const prov=AI[v.prov]?v.prov:'gemini',key=v.key.trim(),model=v.model.trim();
  localStorage.setItem('eduVault_aiProv',prov);localStorage.setItem('eduVault_aiKey_'+prov,key);localStorage.setItem('eduVault_aiModel_'+prov,model);
  toast('Analyse en cours ('+AI[prov].n+')...');
  try{
    const raw=(await aiCall(prov,key,model,await toImages(f))).replace(/<think>[\s\S]*?<\/think>/g,'').replace(/```(?:json)?/g,''),a=raw.indexOf('['),b=raw.lastIndexOf(']');
    if(a<0||b<a)throw Error("L'IA n'a pas renvoyé de JSON valide.");
    const ss=JSON.parse(raw.slice(a,b+1)).filter(s=>s.matiere&&s.debut&&s.fin&&normDay(s.jour));
    if(!ss.length)throw Error('Aucun cours trouvé dans ce document.');
    ss.forEach(s=>{let m=A.modules.find(x=>x.semester===A.activeSemester&&x.name.toLowerCase()===String(s.matiere).toLowerCase());
      if(!m){m={id:uid('m'),semester:A.activeSemester,name:String(s.matiere),prof:s.prof||'',coeff:1,grade:null,resources:[]};A.modules.push(m)}
      A.timetable.push({id:uid('c'),moduleId:m.id,day:normDay(s.jour),week:'all',startTime:s.debut,endTime:s.fin,room:s.salle||'Salle'})});
    upd();toast(ss.length+' séances importées !','ok');
  }catch(e){toast('Erreur IA : '+e.message,'er')}
}

/* ---------- reminders / drive UI / boot ---------- */
const fired=new Set();
function chk(){const n=new Date();A.tasks.filter(t=>!t.completed).forEach(t=>{const d=new Date(t.dueDate)-n;
  if(d>0&&d<=36e5&&!fired.has(t.id+'h')){fired.add(t.id+'h');notify('Rappel : '+t.title,"Échéance dans moins d'une heure !")}
  if(d>36e5&&d<=864e5&&n.getHours()>=18&&!fired.has(t.id+'d')){fired.add(t.id+'d');notify('Demain : '+t.title,'Révisez ce soir !')}})}
function paintDrive(){$('dd').style.color=tok?'#10b981':'#ef4444'}
function onboard(){const d=$('dlg');d.innerHTML=`<h3>🎓 Bienvenue sur EduVault</h3><p class="mu">Sélectionnez votre niveau actuel :</p><div class="g" style="grid-template-columns:1fr 1fr;margin-top:12px">${Object.keys(LV).map(l=>`<button class="b" data-a="lvl" data-i="${l}">${l}<small class="mu">${LV[l].join(' & ')}</small></button>`).join('')}</div>`;d.oncancel=e=>e.preventDefault();d.showModal()}

load();
if(localStorage.getItem('eduTheme')==='light')document.documentElement.classList.remove('dark');
paintDrive();go('tt');
if(!A.settings.level)onboard();
setInterval(chk,6e4);chk();
</script>
